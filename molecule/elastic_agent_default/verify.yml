---
- name: Verify standalone Elastic Agent deployment
  hosts: all
  vars:
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
  tasks:
    - name: Check Elastic Agent service is running
      ansible.builtin.service:
        name: elastic-agent
        state: started
      check_mode: true
      register: elastic_agent_service
      failed_when: elastic_agent_service.changed

    - name: Read standalone Elastic Agent policy
      ansible.builtin.slurp:
        src: /etc/elastic-agent/elastic-agent.yml
      register: elastic_agent_config

    - name: Check standalone policy file
      ansible.builtin.stat:
        path: /etc/elastic-agent/elastic-agent.yml
      register: config_stat

    - name: Check standalone policy file with an independent parent path
      ansible.builtin.stat:
        path: /var/lib/elastic-agent-independent-policy/nested/elastic-agent.yml
      register: independent_config_stat

    - name: Find standalone policy backups
      ansible.builtin.find:
        paths: /etc/elastic-agent
        patterns: elastic-agent.yml.*
        file_type: file
      register: config_backups

    - name: Check management-disabled directory was not created
      ansible.builtin.stat:
        path: /var/lib/elastic-agent-unmanaged
      register: unmanaged_agent_dir

    - name: Check Elastic Agent version command
      ansible.builtin.command:
        argv:
          - /usr/bin/elastic-agent
          - version
      register: elastic_agent_version
      changed_when: false

    - name: Read the 9.x package flavor marker at the package top directory
      ansible.builtin.slurp:
        src: /var/lib/elastic-agent/.flavor
      register: elastic_agent_package_flavor_marker
      when: elasticstack_release | int >= 9

    - name: Assert standalone policy and service
      ansible.builtin.assert:
        that:
          - elastic_agent_service.changed == false
          - config_stat.stat.exists
          - config_stat.stat.mode == '0600'
          - independent_config_stat.stat.exists
          - independent_config_stat.stat.mode == '0600'
          - config_backups.files | length > 0
          - not unmanaged_agent_dir.stat.exists
          - elastic_agent_version.rc == 0
          - "(elastic_agent_config.content | b64decode | from_yaml)['outputs']['default']['type'] == 'logstash'"
          - "'127.0.0.1:5044' in (elastic_agent_config.content | b64decode)"
          - "'contract-system-metrics' in (elastic_agent_config.content | b64decode)"
          - "'agent.logging.to_stderr: true' in (elastic_agent_config.content | b64decode)"

    - name: Assert the 9.x package flavor marker is stored at the package top directory
      ansible.builtin.assert:
        that:
          - (elastic_agent_package_flavor_marker.content | b64decode | trim) == 'basic'
      when: elasticstack_release | int >= 9
