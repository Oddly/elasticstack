---
- name: Converge
  hosts: all
  vars:
    elasticstack_full_stack: false
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elastic_agent_manage: true
    elastic_agent_mode: standalone
    elastic_agent_package_flavor: basic
    elastic_agent_config_backup: true
    elastic_agent_config_dir: /etc/elastic-agent
    elastic_agent_config_file: /etc/elastic-agent/elastic-agent.yml
    elastic_agent_certificate_dir: /etc/elastic-agent/certs
    elastic_agent_enrollment_state_file: /etc/elastic-agent/.enrollment.sha256
    elastic_agent_standalone_config:
      outputs:
        default:
          type: logstash
          hosts:
            - 127.0.0.1:5044
      inputs:
        - type: system/metrics
          id: contract-system-metrics
          data_stream.namespace: default
          streams:
            - metricsets:
                - cpu
              data_stream.dataset: system.cpu
      agent.logging.to_stderr: true
  tasks:
    - name: Include Elastic repos role
      ansible.builtin.include_role:
        name: oddly.elasticstack.repos

    - name: Include Elastic Agent with management disabled
      ansible.builtin.include_role:
        name: oddly.elasticstack.elastic_agent
      vars:
        elastic_agent_manage: false
        elastic_agent_config_dir: /var/lib/elastic-agent-unmanaged

    - name: Check unmanaged Elastic Agent directory
      ansible.builtin.stat:
        path: /var/lib/elastic-agent-unmanaged
      register: unmanaged_agent_dir

    - name: Assert management opt-in leaves the host untouched
      ansible.builtin.assert:
        that:
          - not unmanaged_agent_dir.stat.exists

    - name: Check whether the Elastic Agent package upgrade fixture was completed
      ansible.builtin.stat:
        path: /tmp/elastic-agent-package-upgrade-complete
      register: package_upgrade_fixture

    - name: Exercise an Elastic Agent 8.x to 9.x package upgrade on one host
      when:
        - elasticstack_release | int >= 9
        - not package_upgrade_fixture.stat.exists
      block:
        - name: Reset the shared role guard before the 8.x installation
          ansible.builtin.set_fact:
            _elasticstack_role_imported: false

        - name: Install the Elastic Agent 8.x package
          ansible.builtin.include_role:
            name: oddly.elasticstack.elastic_agent
          vars:
            elasticstack_release: 8
            elastic_agent_enable: false
            elastic_agent_mode: standalone
            elastic_agent_package_flavor: basic
            elastic_agent_config_dir: /var/lib/elastic-agent-package-upgrade
            elastic_agent_config_file: /var/lib/elastic-agent-package-upgrade/elastic-agent.yml
            elastic_agent_config_backup: false

        - name: Gather package facts after the 8.x installation
          ansible.builtin.package_facts:
            manager: auto

        - name: Assert the upgrade fixture is actually on Elastic Agent 8.x
          ansible.builtin.assert:
            that:
              - "'elastic-agent' in ansible_facts.packages"
              - >-
                (ansible_facts.packages['elastic-agent'][0].version
                | regex_search('^[0-9]+') | int) == 8

        - name: Reset the shared role guard before the 9.x installation
          ansible.builtin.set_fact:
            _elasticstack_role_imported: false

        - name: Upgrade the Elastic Agent package to 9.x
          ansible.builtin.include_role:
            name: oddly.elasticstack.elastic_agent
          vars:
            elasticstack_release: 9
            elastic_agent_enable: false
            elastic_agent_mode: standalone
            elastic_agent_package_flavor: basic
            elastic_agent_config_dir: /var/lib/elastic-agent-package-upgrade
            elastic_agent_config_file: /var/lib/elastic-agent-package-upgrade/elastic-agent.yml
            elastic_agent_config_backup: false

        - name: Gather package facts after the 9.x upgrade
          ansible.builtin.package_facts:
            manager: auto

        - name: Read the post-upgrade package flavor marker
          ansible.builtin.slurp:
            src: /var/lib/elastic-agent/.flavor
          register: package_upgrade_flavor_marker

        - name: Assert the 8.x package upgraded to the requested 9.x flavor
          ansible.builtin.assert:
            that:
              - "'elastic-agent' in ansible_facts.packages"
              - >-
                (ansible_facts.packages['elastic-agent'][0].version
                | regex_search('^[0-9]+') | int) == 9
              - (package_upgrade_flavor_marker.content | b64decode | trim) == 'basic'

        - name: Record the completed package upgrade fixture
          ansible.builtin.file:
            path: /tmp/elastic-agent-package-upgrade-complete
            state: touch
            mode: "0644"

    - name: Install and configure Elastic Agent before the backup fixture
      ansible.builtin.include_role:
        name: oddly.elasticstack.elastic_agent
      vars:
        elastic_agent_config_backup: false

    - name: Confirm a standalone to Fleet mode transition is rejected
      block:
        - name: Include Elastic Agent with a conflicting Fleet mode
          ansible.builtin.include_role:
            name: oddly.elasticstack.elastic_agent
          vars:
            elastic_agent_enable: false
            elastic_agent_mode: fleet
            elastic_agent_package_flavor: "{{ 'servers' if elasticstack_release | int >= 9 else 'basic' }}"
            elastic_agent_fleet_server_url: https://fleet.example.test:8220
            elastic_agent_enrollment_token: contract-transition-enrollment-token
            elastic_agent_fleet_server_ca_source: none
      rescue:
        - name: Assert the mode transition guard caused the failure
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name | default('') is search(
                'Refuse an Elastic Agent mode transition')
        - name: Record expected standalone to Fleet rejection
          ansible.builtin.set_fact:
            standalone_to_fleet_rejected: true

    - name: Assert the standalone to Fleet transition was rejected
      ansible.builtin.assert:
        that:
          - standalone_to_fleet_rejected | default(false)

    - name: Check whether the standalone backup fixture was seeded
      ansible.builtin.stat:
        path: /tmp/elastic-agent-standalone-seeded
      register: standalone_seed_marker

    - name: Create standalone policy directory for backup fixture
      ansible.builtin.file:
        path: /etc/elastic-agent
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Seed an existing standalone policy for backup coverage
      ansible.builtin.copy:
        dest: /etc/elastic-agent/elastic-agent.yml
        owner: root
        group: root
        mode: "0600"
        content: |-
          outputs:
            default:
              type: logstash
              hosts:
                - 127.0.0.1:5043
          inputs:
            - type: system/metrics
              id: previous-policy
              data_stream.namespace: default
              streams: []
      when: not standalone_seed_marker.stat.exists

    - name: Mark the standalone backup fixture as seeded
      ansible.builtin.file:
        path: /tmp/elastic-agent-standalone-seeded
        state: touch
        mode: "0644"
      when: not standalone_seed_marker.stat.exists

    - name: Include Elastic Agent in standalone mode
      ansible.builtin.include_role:
        name: oddly.elasticstack.elastic_agent

    - name: Include Elastic Agent with an independent standalone policy path
      ansible.builtin.include_role:
        name: oddly.elasticstack.elastic_agent
      vars:
        elastic_agent_config_dir: /var/lib/elastic-agent-independent
        elastic_agent_config_file: /var/lib/elastic-agent-independent-policy/nested/elastic-agent.yml
        elastic_agent_config_backup: false
