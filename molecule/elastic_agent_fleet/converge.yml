---
- name: Converge Fleet enrollment contract
  hosts: all
  vars:
    elasticstack_full_stack: false
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elastic_agent_manage: true
    elastic_agent_enable: false
    elastic_agent_mode: fleet
    elastic_agent_package_flavor: servers
    elastic_agent_binary_path: /usr/local/bin/elastic-agent-contract
    elastic_agent_migrate_from_beats: true
    elastic_agent_certificate_dir: /var/lib/elastic-agent-fleet-certs
    elastic_agent_enrollment_state_file: /var/lib/elastic-agent-fleet/.enrollment.sha256
    elastic_agent_fleet_server_url: https://fleet.example.test:8220
    elastic_agent_enrollment_token: contract-enrollment-token
    elastic_agent_fleet_server_insecure: true
    elastic_agent_fleet_server_ca_source: external
    elastic_agent_fleet_server_ca_content: |-
      -----BEGIN CERTIFICATE-----
      contract-ca
      -----END CERTIFICATE-----
    elastic_agent_fleet_server_cert_content: |-
      -----BEGIN CERTIFICATE-----
      contract-fleet-cert
      -----END CERTIFICATE-----
    elastic_agent_fleet_server_cert_key_content: |-
      -----BEGIN PRIVATE KEY-----
      contract-fleet-key
      -----END PRIVATE KEY-----
    elastic_agent_fleet_server_es_ca_content: |-
      -----BEGIN CERTIFICATE-----
      contract-es-ca
      -----END CERTIFICATE-----
  tasks:
    - name: Include Elastic repos role
      ansible.builtin.include_role:
        name: oddly.elasticstack.repos

    - name: Install enrollment command contract stub
      ansible.builtin.copy:
        dest: /usr/local/bin/elastic-agent-contract
        mode: "0755"
        content: |
          #!/usr/bin/python3
          from pathlib import Path
          import sys

          arguments = sys.argv[1:]
          target = (
              "/tmp/elastic-agent-fleet-server-argv"
              if "--fleet-server-es" in arguments
              else "/tmp/elastic-agent-enrollment-argv"
          )
          Path("/tmp/elastic-agent-contract-path").write_text(sys.argv[0] + "\n")
          Path(target).write_text("\n".join(arguments) + "\n")

    - name: Check Beat migration fixture state
      ansible.builtin.stat:
        path: /tmp/elastic-agent-beat-fixtures-ready
      register: beat_fixture_state

    - name: Install Beat services for migration coverage
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Elastic Agent migration fixture for {{ item }}

          [Service]
          ExecStart=/usr/bin/sleep infinity

          [Install]
          WantedBy=multi-user.target
      loop:
        - filebeat
        - metricbeat
        - auditbeat
      when: not beat_fixture_state.stat.exists

    - name: Start Beat services for migration coverage
      ansible.builtin.systemd:
        name: "{{ item }}"
        daemon_reload: true
        enabled: true
        state: started
      loop:
        - filebeat
        - metricbeat
        - auditbeat
      when: not beat_fixture_state.stat.exists

    - name: Mark Beat migration fixtures ready
      ansible.builtin.file:
        path: /tmp/elastic-agent-beat-fixtures-ready
        state: touch
        mode: "0644"
      when: not beat_fixture_state.stat.exists

    - name: Create Fleet Server certificate fixtures
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - path: /tmp/fleet-server-ca.crt
          content: |-
            -----BEGIN CERTIFICATE-----
            fleet-server-ca
            -----END CERTIFICATE-----
        - path: /tmp/fleet-server.crt
          content: |-
            -----BEGIN CERTIFICATE-----
            fleet-server
            -----END CERTIFICATE-----
        - path: /tmp/fleet-server.key
          content: |-
            -----BEGIN PRIVATE KEY-----
            fleet-server-key
            -----END PRIVATE KEY-----
        - path: /tmp/elasticsearch-ca.crt
          content: |-
            -----BEGIN CERTIFICATE-----
            elasticsearch-ca
            -----END CERTIFICATE-----

    - name: Include Elastic Agent
      ansible.builtin.include_role:
        name: oddly.elasticstack.elastic_agent

    - name: Preserve content-mode certificate outputs
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: "0640"
      loop:
        - src: /var/lib/elastic-agent-fleet-certs/fleet-server-ca.crt
          dest: /tmp/content-fleet-server-ca.crt
        - src: /var/lib/elastic-agent-fleet-certs/fleet-server.crt
          dest: /tmp/content-fleet-server.crt
        - src: /var/lib/elastic-agent-fleet-certs/fleet-server.key
          dest: /tmp/content-fleet-server.key
        - src: /var/lib/elastic-agent-fleet-certs/elasticsearch-ca.crt
          dest: /tmp/content-elasticsearch-ca.crt

    - name: Include Elastic Agent as Fleet Server
      ansible.builtin.include_role:
        name: oddly.elasticstack.elastic_agent
      vars:
        elastic_agent_manage: true
        elastic_agent_enable: false
        elastic_agent_mode: fleet_server
        elastic_agent_package_flavor: servers
        elastic_agent_binary_path: /usr/local/bin/elastic-agent-contract
        elastic_agent_migrate_from_beats: true
        elastic_agent_certificate_dir: /var/lib/elastic-agent-fleet-server-certs
        elastic_agent_enrollment_state_file: /var/lib/elastic-agent-fleet-server/.enrollment.sha256
        elastic_agent_fleet_server_url: https://fleet.example.test:8220
        elastic_agent_fleet_server_ca_source: external
        elastic_agent_fleet_server_ca_content: ""
        elastic_agent_fleet_server_ca_file: /tmp/fleet-server-ca.crt
        elastic_agent_fleet_server_ca_remote_src: true
        elastic_agent_fleet_server_insecure: false
        elastic_agent_fleet_server_cert_content: ""
        elastic_agent_fleet_server_cert_key_content: ""
        elastic_agent_fleet_server_es_ca_content: ""
        elastic_agent_fleet_server_es: https://elasticsearch.example.test:9200
        elastic_agent_fleet_server_service_token: contract-service-token
        elastic_agent_fleet_server_policy: contract-fleet-policy
        elastic_agent_fleet_server_host: 0.0.0.0
        elastic_agent_fleet_server_port: 8220
        elastic_agent_fleet_server_cert_file: /tmp/fleet-server.crt
        elastic_agent_fleet_server_cert_key_file: /tmp/fleet-server.key
        elastic_agent_fleet_server_cert_remote_src: true
        elastic_agent_fleet_server_es_ca_file: /tmp/elasticsearch-ca.crt
        elastic_agent_fleet_server_es_ca_remote_src: true

    - name: Preserve file-mode Fleet Server certificate outputs
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: "0640"
      loop:
        - src: /var/lib/elastic-agent-fleet-server-certs/fleet-server-ca.crt
          dest: /tmp/file-fleet-server-ca.crt
        - src: /var/lib/elastic-agent-fleet-server-certs/fleet-server.crt
          dest: /tmp/file-fleet-server.crt
        - src: /var/lib/elastic-agent-fleet-server-certs/fleet-server.key
          dest: /tmp/file-fleet-server.key
        - src: /var/lib/elastic-agent-fleet-server-certs/elasticsearch-ca.crt
          dest: /tmp/file-elasticsearch-ca.crt

    - name: Create collection CA directory for the shared CA branch
      ansible.builtin.file:
        path: /opt/es-ca
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create collection CA fixture for the shared CA branch
      ansible.builtin.copy:
        dest: /opt/es-ca/ca.crt
        owner: root
        group: root
        mode: "0644"
        content: |-
          -----BEGIN CERTIFICATE-----
          contract-collection-ca
          -----END CERTIFICATE-----

    - name: Include Elastic Agent with the collection CA
      ansible.builtin.include_role:
        name: oddly.elasticstack.elastic_agent
      vars:
        elastic_agent_manage: true
        elastic_agent_enable: false
        elastic_agent_mode: fleet
        elastic_agent_package_flavor: servers
        elastic_agent_config_dir: /var/lib/elastic-agent-collection-ca
        elastic_agent_config_file: /var/lib/elastic-agent-collection-ca/elastic-agent.yml
        elastic_agent_certificate_dir: /var/lib/elastic-agent-collection-ca-certs
        elastic_agent_binary_path: /usr/local/bin/elastic-agent-contract
        elastic_agent_migrate_from_beats: false
        elastic_agent_enrollment_state_file: /var/lib/elastic-agent-collection-ca/.enrollment.sha256
        elastic_agent_fleet_server_url: https://fleet.example.test:8220
        elastic_agent_enrollment_token: contract-collection-ca-token
        elastic_agent_fleet_server_insecure: false
        elastic_agent_fleet_server_ca_source: elasticsearch_ca
        elastic_agent_fleet_server_ca_file: ""
        elastic_agent_fleet_server_ca_content: ""
        elastic_agent_fleet_server_ca_remote_src: false
        elastic_agent_fleet_server_cert_file: ""
        elastic_agent_fleet_server_cert_content: ""
        elastic_agent_fleet_server_cert_key_file: ""
        elastic_agent_fleet_server_cert_key_content: ""
        elastic_agent_fleet_server_es_ca_file: ""
        elastic_agent_fleet_server_es_ca_content: ""

    - name: Preserve collection CA output and command
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: "0640"
      loop:
        - src: /var/lib/elastic-agent-collection-ca/certs/fleet-server-ca.crt
          dest: /tmp/collection-fleet-server-ca.crt
        - src: /tmp/elastic-agent-enrollment-argv
          dest: /tmp/elastic-agent-collection-ca-argv

    - name: Add an Elasticsearch host for URL discovery coverage
      ansible.builtin.add_host:
        name: elasticsearch-contract
        groups: elasticsearch
        elasticsearch_api_host: elasticsearch-derived.example.test

    - name: Include Elastic Agent Fleet Server with default CA handling
      ansible.builtin.include_role:
        name: oddly.elasticstack.elastic_agent
      vars:
        elastic_agent_manage: true
        elastic_agent_enable: false
        elastic_agent_mode: fleet_server
        elastic_agent_package_flavor: servers
        elastic_agent_config_dir: /etc/elastic-agent
        elastic_agent_config_file: /etc/elastic-agent/elastic-agent.yml
        elastic_agent_certificate_dir: /var/lib/elastic-agent-no-ca-certs
        elastic_agent_binary_path: /usr/local/bin/elastic-agent-contract
        elastic_agent_migrate_from_beats: false
        elastic_agent_enrollment_state_file: /var/lib/elastic-agent-no-ca/.enrollment.sha256
        elastic_agent_fleet_server_url: https://fleet.example.test:8220
        elastic_agent_enrollment_token: ""
        elastic_agent_fleet_server_insecure: false
        elastic_agent_fleet_server_ca_source: none
        elastic_agent_fleet_server_ca_file: ""
        elastic_agent_fleet_server_ca_content: ""
        elastic_agent_fleet_server_ca_remote_src: false
        elastic_agent_fleet_server_es: ""
        elastic_agent_fleet_server_service_token: contract-derived-service-token
        elastic_agent_fleet_server_policy: contract-derived-fleet-policy
        elastic_agent_fleet_server_host: 127.0.0.1
        elastic_agent_fleet_server_port: 8221
        elastic_agent_fleet_server_cert_file: ""
        elastic_agent_fleet_server_cert_content: ""
        elastic_agent_fleet_server_cert_key_file: ""
        elastic_agent_fleet_server_cert_key_content: ""
        elastic_agent_fleet_server_cert_remote_src: false
        elastic_agent_fleet_server_es_ca_file: ""
        elastic_agent_fleet_server_es_ca_content: ""
        elastic_agent_fleet_server_es_ca_remote_src: false

    - name: Preserve default CA Fleet Server command
      ansible.builtin.copy:
        src: /tmp/elastic-agent-fleet-server-argv
        dest: /tmp/elastic-agent-no-ca-argv
        remote_src: true
        mode: "0640"

    - name: Confirm incomplete Fleet configuration is rejected
      block:
        - name: Include Elastic Agent with incomplete Fleet details
          ansible.builtin.include_role:
            name: oddly.elasticstack.elastic_agent
          vars:
            elastic_agent_manage: true
            elastic_agent_mode: fleet
            elastic_agent_fleet_server_url: ""
            elastic_agent_enrollment_token: ""
      rescue:
        - name: Record expected incomplete Fleet failure
          ansible.builtin.set_fact:
            invalid_agent_configuration_failed: true

    - name: Confirm Fleet Server basic flavor is rejected
      block:
        - name: Include Elastic Agent Fleet Server with the basic flavor
          ansible.builtin.include_role:
            name: oddly.elasticstack.elastic_agent
          vars:
            elastic_agent_manage: true
            elastic_agent_mode: fleet_server
            elastic_agent_package_flavor: basic
            elastic_agent_fleet_server_url: https://fleet.example.test:8220
            elastic_agent_fleet_server_es: https://elasticsearch.example.test:9200
            elastic_agent_fleet_server_service_token: contract-invalid-service-token
            elastic_agent_fleet_server_policy: contract-invalid-fleet-policy
            elastic_agent_fleet_server_ca_source: none
            elastic_agent_fleet_server_cert_content: ""
            elastic_agent_fleet_server_cert_key_content: ""
            elastic_agent_fleet_server_es_ca_content: ""
      rescue:
        - name: Record expected Fleet Server flavor failure
          ansible.builtin.set_fact:
            invalid_fleet_server_flavor_failed: true

    - name: Confirm incomplete Fleet Server certificate pair is rejected
      block:
        - name: Include Elastic Agent with an incomplete certificate pair
          ansible.builtin.include_role:
            name: oddly.elasticstack.elastic_agent
          vars:
            elastic_agent_manage: true
            elastic_agent_mode: fleet
            elastic_agent_package_flavor: servers
            elastic_agent_fleet_server_url: https://fleet.example.test:8220
            elastic_agent_enrollment_token: contract-invalid-enrollment-token
            elastic_agent_fleet_server_ca_source: none
            elastic_agent_fleet_server_cert_content: contract-incomplete-cert
            elastic_agent_fleet_server_cert_key_content: ""
            elastic_agent_fleet_server_es_ca_content: ""
      rescue:
        - name: Record expected certificate pair failure
          ansible.builtin.set_fact:
            invalid_certificate_pair_failed: true

    - name: Assert invalid Elastic Agent configurations failed before deployment
      ansible.builtin.assert:
        that:
          - invalid_agent_configuration_failed | default(false)
          - invalid_fleet_server_flavor_failed | default(false)
          - invalid_certificate_pair_failed | default(false)
