---
- name: Verify Logstash with beats SSL and external certs
  hosts: all
  tasks:
    - name: Check Logstash service is running
      ansible.builtin.include_tasks: ../shared/verify_logstash_service.yml

    # --- Certificate verification ---

    - name: Check certificate directory exists
      ansible.builtin.stat:
        path: /etc/logstash/certs
      register: certs_dir

    - name: Assert certificate directory exists
      ansible.builtin.assert:
        that:
          - certs_dir.stat.exists
          - certs_dir.stat.isdir
        fail_msg: "Certificate directory /etc/logstash/certs not found"

    - name: Check server certificate was copied
      ansible.builtin.stat:
        path: "/etc/logstash/certs/{{ ansible_facts.hostname }}-server.crt"
      register: server_cert

    - name: Assert server certificate exists
      ansible.builtin.assert:
        that:
          - server_cert.stat.exists
        fail_msg: "Server certificate not found in /etc/logstash/certs/"

    - name: Check server key was copied
      ansible.builtin.stat:
        path: "/etc/logstash/certs/{{ ansible_facts.hostname }}.key"
      register: server_key

    - name: Assert server key exists
      ansible.builtin.assert:
        that:
          - server_key.stat.exists
        fail_msg: "Server key not found in /etc/logstash/certs/"

    - name: Verify server key is unencrypted PKCS#8 PEM
      ansible.builtin.command: head -1 /etc/logstash/certs/{{ ansible_facts.hostname }}.key
      register: _server_key_header
      changed_when: false

    - name: Assert PKCS#8 header
      ansible.builtin.assert:
        that:
          - _server_key_header.stdout == '-----BEGIN PRIVATE KEY-----'
        fail_msg: >-
          Expected unencrypted PKCS#8 PEM (-----BEGIN PRIVATE KEY-----),
          got {{ _server_key_header.stdout }}.

    - name: Check CA certificate was copied
      ansible.builtin.stat:
        path: /etc/logstash/certs/ca.crt
      register: ca_cert

    - name: Assert CA certificate exists
      ansible.builtin.assert:
        that:
          - ca_cert.stat.exists
        fail_msg: "CA certificate not found in /etc/logstash/certs/"

    - name: Verify logstash_tls_certificate_file and logstash_tls_key_file were consumed
      ansible.builtin.assert:
        that:
          - server_cert.stat.exists
          - server_key.stat.exists
        fail_msg: >-
          logstash_tls_certificate_file or logstash_tls_key_file was not
          copied from the configured external source.

    - name: Verify logstash_tls_ca_file and logstash_tls_remote_src were consumed
      ansible.builtin.assert:
        that:
          - ca_cert.stat.exists
        fail_msg: >-
          logstash_tls_ca_file or logstash_tls_remote_src did not produce a
          usable CA file on the managed Logstash host.

    # --- Input SSL verification ---

    - name: Read input configuration
      ansible.builtin.slurp:
        src: /etc/logstash/conf.d/main/10-input.conf
      register: input_content

    - name: Verify beats input with SSL is configured
      ansible.builtin.assert:
        that:
          - "'beats {' in (input_content.content | b64decode)"
          - "'port => 5044' in (input_content.content | b64decode)"
          - "'ssl_enabled' in (input_content.content | b64decode) or 'ssl => true' in (input_content.content | b64decode)"
          - "'client_inactivity_timeout => 45' in (input_content.content | b64decode)"
          - >-
            (ansible_facts.distribution_major_version | int < 9) or
            ('ssl_client_authentication => optional' in (input_content.content | b64decode))
        fail_msg: "Beats input with SSL not properly configured"

    - name: Verify Logstash port and configuration syntax
      ansible.builtin.include_tasks: ../shared/verify_logstash_port.yml
      vars:
        _verify_logstash_port_timeout: 120

    # An open socket doesn't prove TLS — Logstash could be serving plain text
    # on 5044 if the SSL block silently failed to load. Run an actual TLS
    # handshake against the port and verify the served cert chains to the
    # external CA we deployed.
    - name: TLS handshake against Logstash 5044 (signed by Test CA)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out=$(echo | openssl s_client \
            -connect localhost:5044 \
            -CAfile /tmp/test-certs/ca.crt \
            -servername {{ ansible_facts.hostname }} 2>&1) || true
          echo "$out" | grep -E 'Verify return code|verify error|issuer=' || true
          echo "$out" | grep -q 'Verify return code: 0 (ok)'
        executable: /bin/bash
      register: _ls_tls_probe
      changed_when: false
      when: logstash_port_check is not failed
