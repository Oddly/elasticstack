---
- name: Verify Elasticsearch with certificate content variables
  hosts: elasticsearch
  tasks:
    - name: Fetch Elastic password
      ansible.builtin.shell: |
        set -o pipefail
        grep "PASSWORD elastic " /usr/share/elasticsearch/initial_passwords |
        awk {' print $4 '}
      args:
        executable: /bin/bash
      register: elastic_pass
      changed_when: false
      run_once: true  # noqa: run-once[task]

    - name: Check cluster health
      ansible.builtin.uri:
        url: "https://localhost:9200/_cluster/health"
        method: GET
        force_basic_auth: true
        user: elastic
        password: "{{ elastic_pass.stdout }}"
        return_content: true
        status_code: 200
        validate_certs: false
      register: health
      run_once: true  # noqa: run-once[task]

    - name: Verify cluster is green or yellow
      ansible.builtin.assert:
        that:
          - health.json.status in ["green", "yellow"]
        fail_msg: "Cluster status is {{ health.json.status }}"
      run_once: true  # noqa: run-once[task]

    # The whole point of the *_content variables is "bytes in == bytes on disk".
    # Compare each deployed cert against the source PEM the converge fed in via
    # /tmp/test-certs/ (which is what got slurped into _test_*_content facts).
    # sha256sum comparison catches empty/wrong/truncated files that the
    # earlier "is the subject string 'http'" heuristic let through.
    - name: Hash deployed certs vs source PEM files
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for pair in \
            "/tmp/test-certs/transport.crt /etc/elasticsearch/certs/{{ inventory_hostname }}-transport.crt" \
            "/tmp/test-certs/http.crt /etc/elasticsearch/certs/{{ inventory_hostname }}-http.crt" \
            "/tmp/test-certs/ca.crt /etc/elasticsearch/certs/ca.crt"; do
            src=$(echo "$pair" | awk '{print $1}')
            dst=$(echo "$pair" | awk '{print $2}')
            src_sum=$(sha256sum "$src" | awk '{print $1}')
            dst_sum=$(sha256sum "$dst" 2>/dev/null | awk '{print $1}' || echo "MISSING")
            echo "$src $src_sum $dst $dst_sum"
          done
        executable: /bin/bash
      register: _cert_hashes
      changed_when: false

    - name: Assert each deployed cert matches the source PEM byte-for-byte
      ansible.builtin.assert:
        that:
          # All three lines present (transport.crt, http.crt, ca.crt).
          - "(_cert_hashes.stdout_lines | length) == 3"
          # No deployed file was missing.
          - "(_cert_hashes.stdout_lines | select('search', ' MISSING$') | list | length) == 0"
          # Each line has the form "<src_path> <src_hash> <dst_path> <dst_hash>";
          # we require src_hash == dst_hash. The regex backreference \\2 enforces it.
          - >-
            (_cert_hashes.stdout_lines
             | map('regex_search', '^\\S+ (\\S+) \\S+ \\1$')
             | select | list | length) == 3
        fail_msg: |
          One or more deployed certs do not match the source PEM content the role
          was fed via *_content variables. Detail (src dst src_hash dst_hash):
          {{ _cert_hashes.stdout }}

    - name: Verify no P12 files exist (content mode is always PEM)
      ansible.builtin.find:
        paths: /etc/elasticsearch/certs
        patterns: "*.p12"
      register: p12_files

    - name: Assert no P12 files
      ansible.builtin.assert:
        that:
          - p12_files.files | length == 0
        fail_msg: "Found unexpected P12 files in content mode: {{ p12_files.files | map(attribute='path') | list }}"

    - name: Slurp elasticsearch.yml for config assertions
      ansible.builtin.slurp:
        src: /etc/elasticsearch/elasticsearch.yml
      register: _es_yml

    - name: Assert verification_mode is certificate, not none, and PEM keys reference the deployed files
      ansible.builtin.assert:
        that:
          - "'xpack.security.transport.ssl.verification_mode: certificate' in (_es_yml.content | b64decode)"
          - "'verification_mode: none' not in (_es_yml.content | b64decode)"
          - >-
            ('xpack.security.transport.ssl.certificate: certs/' ~ inventory_hostname ~ '-transport.crt')
            in (_es_yml.content | b64decode)
          - >-
            ('xpack.security.http.ssl.certificate: certs/' ~ inventory_hostname ~ '-http.crt')
            in (_es_yml.content | b64decode)
        fail_msg: |
          elasticsearch.yml is missing one of the expected verification_mode / cert
          path lines. Content:
          {{ _es_yml.content | b64decode }}
