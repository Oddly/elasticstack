---
# The workaround for arbitrarily named role directory is important because the git repo has one name and the role within it another
# Found at: https://github.com/ansible-community/molecule/issues/1567#issuecomment-436876722
- name: Converge
  hosts: all
  vars:
    elasticstack_full_stack: false
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elasticsearch_heap: "1"
    security_api_admin_password: "TestElasticPassword123!"
    elasticsearch_elastic_password: "{{ security_api_admin_password }}"
    # Exercise the collection's declarative security manager against a real
    # Elasticsearch API. The direct REST calls below remain as API CRUD
    # coverage, while these objects prove the role can reconcile its own
    # public variables with the custom elastic password above.
    elasticsearch_security_roles:
      - name: molecule-managed-role
        cluster:
          - monitor
        indices:
          - names:
              - molecule-managed-*
            privileges:
              - read
        metadata:
          owner: molecule
    elasticsearch_users:
      - name: molecule-managed-user
        password: "MoleculeManagedUserPassword!"
        roles:
          - molecule-managed-role
        full_name: Molecule managed user
        email: molecule-managed@example.test
        metadata:
          owner: molecule
    elasticsearch_role_mappings:
      - name: molecule-managed-mapping
        roles:
          - molecule-managed-role
        rules:
          field:
            username: molecule-managed-user
    elasticstack_no_log: false
  tasks:
    - name: Include Elastics repos role
      ansible.builtin.include_role:
        name: oddly.elasticstack.repos

    - name: Include Elasticsearch
      block:
        - name: Run Elasticsearch role
          ansible.builtin.include_role:
            name: oddly.elasticstack.elasticsearch
      rescue:
        - name: Dump ES diagnostics on failure
          ansible.builtin.shell: |
            set -x
            echo "=== systemctl status elasticsearch ==="
            systemctl status elasticsearch.service --no-pager -l 2>&1 || true
            echo "=== journalctl -u elasticsearch (last 50) ==="
            journalctl -u elasticsearch.service --no-pager -n 50 2>&1 || true
            echo "=== ES log files ==="
            ls -la /var/log/elasticsearch/ 2>&1 || true
            echo "=== ES startup log (first 80 lines) ==="
            head -80 /var/log/elasticsearch/elasticsearch.log 2>/dev/null || echo "No ES log found"
            echo "=== ES server JSON (last 50) ==="
            tail -50 /var/log/elasticsearch/elasticsearch_server.json 2>/dev/null || echo "No server JSON"
            echo "=== JVM custom options ==="
            cat /etc/elasticsearch/jvm.options.d/90-custom.options 2>&1 || echo "No custom options"
            echo "=== JVM options dir ==="
            ls -la /etc/elasticsearch/jvm.options.d/ 2>&1 || true
            echo "=== elasticsearch.yml ==="
            cat /etc/elasticsearch/elasticsearch.yml 2>&1 || true
          args:
            executable: /bin/bash
          register: es_diag
          changed_when: false
          failed_when: false

        - name: Show ES diagnostics
          ansible.builtin.debug:
            var: es_diag.stdout_lines

        - name: Fail after showing diagnostics
          ansible.builtin.fail:
            msg: "Elasticsearch role failed - see diagnostics above"

    - name: CI — set lenient disk watermarks
      ansible.builtin.include_tasks: ../shared/set_ci_watermarks.yml

    - name: Create elasticsearch role via REST API
      ansible.builtin.uri:
        url: https://localhost:9200/_security/role/new-role1
        method: PUT
        user: elastic
        password: "{{ security_api_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          cluster:
            - manage_own_api_key
            - delegate_pki
          indices:
            - names:
                - foobar321
              privileges:
                - read
                - write
        status_code: [200]

    - name: Create elasticsearch user via REST API
      ansible.builtin.uri:
        url: https://localhost:9200/_security/user/new-user1
        method: PUT
        user: elastic
        password: "{{ security_api_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          password: "{{ lookup('community.general.random_string', length=12, min_lower=1, min_upper=1, min_numeric=1, min_special=1, override_special='-_=!') }}"
          full_name: New User
          email: new@user.de
          roles:
            - new-role1
          enabled: true
        status_code: [200]
