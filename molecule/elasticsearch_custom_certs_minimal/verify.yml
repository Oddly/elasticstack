---
- name: Verify Elasticsearch with minimal external cert config
  hosts: elasticsearch
  tasks:
    - name: Fetch Elastic password
      ansible.builtin.shell: |
        set -o pipefail
        grep "PASSWORD elastic " /usr/share/elasticsearch/initial_passwords |
        awk {' print $4 '}
      args:
        executable: /bin/bash
      register: elastic_pass
      changed_when: false
      run_once: true  # noqa: run-once[task]

    - name: Check cluster health
      ansible.builtin.uri:
        url: "https://localhost:9200/_cluster/health"
        method: GET
        force_basic_auth: true
        user: elastic
        password: "{{ elastic_pass.stdout }}"
        return_content: true
        status_code: 200
        validate_certs: false
      register: health
      run_once: true  # noqa: run-once[task]

    - name: Verify cluster is green or yellow
      ansible.builtin.assert:
        that:
          - health.json.status in ["green", "yellow"]
        fail_msg: "Cluster status is {{ health.json.status }}"
      run_once: true  # noqa: run-once[task]

    # Key auto-derivation: the role should have derived the key from server.crt → server.key
    - name: Verify transport key was deployed
      ansible.builtin.stat:
        path: "/etc/elasticsearch/certs/{{ inventory_hostname }}-transport.key"
      register: transport_key_stat

    - name: Assert transport key exists (auto-derived)
      ansible.builtin.assert:
        that:
          - transport_key_stat.stat.exists
        fail_msg: "Transport key not found — auto-derivation from .crt → .key failed"

    # HTTP fallback: HTTP cert should exist (copied from transport cert)
    - name: Verify HTTP cert was deployed (fallback from transport)
      ansible.builtin.stat:
        path: "/etc/elasticsearch/certs/{{ inventory_hostname }}-http.crt"
      register: http_cert_stat

    - name: Assert HTTP cert exists (fell back to transport)
      ansible.builtin.assert:
        that:
          - http_cert_stat.stat.exists
        fail_msg: "HTTP cert not found — fallback from transport cert failed"

    # CA chain extraction: ca.crt should have been extracted from the PEM bundle
    - name: Verify CA cert was extracted from PEM bundle
      ansible.builtin.stat:
        path: /etc/elasticsearch/certs/ca.crt
      register: ca_cert_stat

    - name: Assert CA cert exists (auto-extracted from chain)
      ansible.builtin.assert:
        that:
          - ca_cert_stat.stat.exists
        fail_msg: "CA cert not found — auto-extraction from PEM bundle failed"

    # The point of the minimal scenario is that the role slices the CA
    # out of a chained server+CA PEM bundle. A buggy role that wrote the
    # full bundle to ca.crt (or even just the server cert) would still
    # match 'BEGIN CERTIFICATE' — so count occurrences AND verify the
    # subject matches the test CA, not the server cert.
    - name: Hash extracted ca.crt and inspect its subject
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          path=/etc/elasticsearch/certs/ca.crt
          count=$(grep -c '^-----BEGIN CERTIFICATE-----' "$path" || echo 0)
          src_sum=$(sha256sum /tmp/test-certs/ca.crt | awk '{print $1}')
          dst_sum=$(sha256sum "$path" | awk '{print $1}')
          subject=$(openssl x509 -in "$path" -noout -subject)
          echo "count=$count src_sum=$src_sum dst_sum=$dst_sum subject=$subject"
        executable: /bin/bash
      register: _ca_extract
      changed_when: false

    - name: Assert ca.crt contains exactly one cert and matches the source CA
      ansible.builtin.assert:
        that:
          - "'count=1 ' in _ca_extract.stdout"
          - "_ca_extract.stdout is search('CN ?= ?Test CA')"
          # Source CA on /tmp/test-certs/ca.crt is the standalone CA PEM
          # (single cert), so the extracted ca.crt should match it byte-for-byte.
          - >-
            _ca_extract.stdout is regex('src_sum=(\\S+) dst_sum=\\1')
        fail_msg: |
          CA cert was not extracted correctly from the chained PEM bundle.
          Either the file holds the wrong number of certs, the subject is not
          the test CA, or its bytes don't match the source CA. Got:
          {{ _ca_extract.stdout }}

    - name: Slurp elasticsearch.yml for cert-config assertions
      ansible.builtin.slurp:
        src: /etc/elasticsearch/elasticsearch.yml
      register: _es_yml

    - name: Assert certificate_authorities is configured in BOTH transport and http sections
      ansible.builtin.assert:
        that:
          - "'transport.ssl.certificate_authorities' in (_es_yml.content | b64decode)"
          - "'http.ssl.certificate_authorities' in (_es_yml.content | b64decode)"
        fail_msg: |
          certificate_authorities missing from one of the SSL sections. The
          earlier `grep ca.crt` check would have passed even if only HTTP
          referenced the CA (transport gone silent). Content:
          {{ _es_yml.content | b64decode }}
