---
prerun: false
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: default
platforms:
  - name: "kib-cust-es1-${MOLECULE_DISTRO:-debian12}-r${ELASTIC_RELEASE:-9}${MOLECULE_RUN_SUFFIX}"
    groups:
      - elasticsearch
    distro: "${MOLECULE_DISTRO:-debian12}"
    memory_mb: 4096
  - name: "kib-cust-kb1-${MOLECULE_DISTRO:-debian12}-r${ELASTIC_RELEASE:-9}${MOLECULE_RUN_SUFFIX}"
    groups:
      - kibana
    distro: "${MOLECULE_DISTRO:-debian12}"
    # 3072 MiB: Kibana 9's node process was cgroup-OOM-killed at ~1.6 GB
    # anon RSS under the old 2048 limit (kernel journal, 2026-08); killed
    # Kibana loops under systemd restart and the converge hangs to the
    # job timeout.
    memory_mb: 3072
provisioner:
  name: ansible
  env:
    ANSIBLE_LOG_PATH: /var/log/ansible.log
  connection_options:
    ansible_connection: ssh
    ansible_user: root
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
