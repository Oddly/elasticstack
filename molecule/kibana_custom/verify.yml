---
- name: Verify Kibana custom configuration
  hosts: all
  vars:
    elasticstack_elasticsearch_http_port: 9200
    elasticstack_elasticsearch_group_name: elasticsearch
    elasticstack_kibana_port: 15601
    elasticstack_kibana_port: 15601
  tasks:
    - name: Set elasticsearch_ca variable
      ansible.builtin.set_fact:
        elasticsearch_ca: "{{ groups[elasticstack_elasticsearch_group_name][0] }}"
      when: elasticsearch_ca is undefined

    - name: Fetch Elastic password
      ansible.builtin.include_tasks: ../shared/verify_fetch_password.yml
      vars:
        _verify_delegate_to: "{{ elasticsearch_ca }}"

    - name: Elasticsearch health check
      ansible.builtin.include_tasks: ../shared/verify_es_health.yml
      vars:
        _verify_es_health_query: "?wait_for_status=yellow&timeout=30s"
        _verify_es_statuses: [green, yellow]
        _verify_when: "{{ 'elasticsearch' in group_names }}"

    - name: Run Kibana checks
      when: "'kibana' in group_names"
      block:
        - name: Check Kibana availability
          ansible.builtin.include_tasks: ../shared/verify_kibana_available.yml
          vars:
            _verify_kibana_url: "http://localhost:{{ elasticstack_kibana_port }}/api/status"
            _verify_kibana_auth_http: true

        - name: Read kibana.yml
          ansible.builtin.slurp:
            src: /etc/kibana/kibana.yml
          register: kibana_yml

        - name: Check kibana.yml permissions
          ansible.builtin.stat:
            path: /etc/kibana/kibana.yml
          register: kibana_config

        - name: Assert kibana.yml is service-readable and private
          ansible.builtin.assert:
            that:
              - kibana_config.stat.pw_name == 'root'
              - kibana_config.stat.gr_name == 'kibana'
              - kibana_config.stat.mode == '0640'
              - "'elasticsearch.password:' not in (kibana_yml.content | b64decode)"
            fail_msg: >-
              kibana.yml must be root:kibana 0640 and must not contain the
              Elasticsearch backend password; Kibana should read it from its
              keystore.

        - name: Verify Kibana backend password is in the keystore
          ansible.builtin.command:
            argv:
              - /usr/share/kibana/bin/kibana-keystore
              - show
              - elasticsearch.password
          environment:
            KBN_PATH_CONF: /etc/kibana
          register: kibana_backend_password
          changed_when: false
          no_log: true
          failed_when: kibana_backend_password.rc != 0 or kibana_backend_password.stdout | trim | length == 0

        - name: Verify extra config is present
          ansible.builtin.assert:
            that:
              - "'ops.interval: 10000' in (kibana_yml.content | b64decode)"
              - "'logging.root.level: warn' in (kibana_yml.content | b64decode)"
            fail_msg: "Extra config not found in kibana.yml"

        - name: Verify server.publicBaseUrl uses the override and appears exactly once
          ansible.builtin.assert:
            that:
              # The dedicated variable wins ...
              - "'server.port: 15601' in (kibana_yml.content | b64decode)"
              # ... and a conflicting extra-config value is filtered out.
              - "'server.port: 9999' not in (kibana_yml.content | b64decode)"
              - "(kibana_yml.content | b64decode).split('\\n') | select('match', '\\s*server\\.port\\s*:') | list | length == 1"
              - "'server.publicBaseUrl: \"https://kibana.example.com\"' in (kibana_yml.content | b64decode)"
              # ... the conflicting key from kibana_extra_config is filtered out ...
              - "'duplicate.example.com' not in (kibana_yml.content | b64decode)"
              # ... and the key is emitted exactly once (a duplicate stops Kibana from starting).
              - "(kibana_yml.content | b64decode).split('\n') | select('match', '\\s*server\\.publicBaseUrl\\s*:') | list | length == 1"
              # A quoted managed key must be filtered too (line-based filtering missed it).
              - "(kibana_yml.content | b64decode).split('\n') | select('match', '\\s*.?server\\.host.?\\s*:') | list | length == 1"
              # A multiline managed value must be removed whole, leaving no orphaned list items.
              - "'should-be-filtered' not in (kibana_yml.content | b64decode)"
            fail_msg: "server.publicBaseUrl override missing, duplicated, or not filtered from kibana_extra_config"

        - name: Verify kibana.yml is still valid YAML after filtering
          ansible.builtin.assert:
            that:
              - "(kibana_yml.content | b64decode | from_yaml) is mapping"
            fail_msg: "kibana.yml is not parseable as YAML"

        - name: Read provided encryption keys from the keystore
          ansible.builtin.command: >
            /usr/share/kibana/bin/kibana-keystore show {{ item }}
          environment:
            KBN_PATH_CONF: /etc/kibana
          loop:
            - xpack.security.encryptionKey
            - xpack.encryptedSavedObjects.encryptionKey
          register: provided_keys
          changed_when: false

        - name: Verify provided encryption keys are honoured in the keystore
          ansible.builtin.assert:
            that:
              - "provided_keys.results[0].stdout_lines[-1] == 'moleculeProvidedSecurityKey0123456789abcd'"
              - "provided_keys.results[1].stdout_lines[-1] == 'moleculeProvidedSavedObjectsKey0123456789'"
            fail_msg: "Provided encryption keys not stored in the Kibana keystore"

        - name: Verify sniff on start is enabled (pre-9.x only)
          ansible.builtin.assert:
            that:
              - "'sniffOnStart: true' in (kibana_yml.content | b64decode)"
            fail_msg: "Sniff on start not found in kibana.yml"
          when: (lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int) < 9

        # Negative test on 9.x: even with kibana_sniff_on_start: true the
        # template should NOT emit sniffOnStart (Kibana 9.x removed the
        # sniffing setting). Without this assert, a regression that restored
        # the line on 9.x would only show up under default-release CI as a
        # confusing Kibana startup warning, not a test failure.
        - name: Verify sniff on start is NOT emitted on 9.x
          ansible.builtin.assert:
            that:
              - "'sniffOnStart' not in (kibana_yml.content | b64decode)"
            fail_msg: >-
              kibana_sniff_on_start: true should be silently dropped on
              Kibana 9.x, but sniffOnStart appears in kibana.yml. Kibana
              9.x will log a warning at startup and ignore the value.
          when: (lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int) >= 9

        - name: Check for kibana.yml backup files
          ansible.builtin.find:
            paths: /etc/kibana
            patterns: "kibana.yml.*"
          register: backups

        - name: Report backup status
          ansible.builtin.debug:
            msg: "Found {{ backups.files | length }} kibana.yml backup(s)"

        - name: Assert Kibana configuration backup was created
          ansible.builtin.assert:
            that:
              - backups.files | length > 0
            fail_msg: "No kibana.yml backup found despite kibana_config_backup: true"
