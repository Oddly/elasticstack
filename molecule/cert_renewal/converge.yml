---
# Certificate renewal test:
# 1. Deploy full stack (ES 2-node + Kibana + Logstash)
# 2. Record original certificate fingerprints
# 3. Re-run with *_cert_will_expire_soon: true to trigger renewal
# 4. Verify new certificates are different from originals

# --- Phase 1: Initial deployment ---

- name: Deploy full stack
  hosts: all
  vars:
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elasticstack_full_stack: true
    elasticstack_no_log: false
    elasticsearch_heap: "1"
    logstash_heap: "512m"
    logstash_pipeline_unsafe_shutdown: true
    # Enable Kibana web TLS so the role's readiness check exercises the
    # HTTPS code path (regression guard for #141). The role's curl uses -k,
    # so the self-signed cert chain is fine.
    kibana_tls: true
  tasks:
    - name: Include Elastic repos
      ansible.builtin.include_role:
        name: oddly.elasticstack.repos

    - name: Deploy Elasticsearch
      ansible.builtin.include_role:
        name: oddly.elasticstack.elasticsearch
      when: "'elasticsearch' in group_names"

    - name: CI — set lenient disk watermarks
      ansible.builtin.include_tasks: ../shared/set_ci_watermarks.yml
      when: "'elasticsearch' in group_names"

    - name: CI — clean cache after ES
      ansible.builtin.include_tasks: ../shared/cleanup_cache.yml

    - name: Deploy Logstash
      ansible.builtin.include_role:
        name: oddly.elasticstack.logstash
      when: "'logstash' in group_names"

    - name: Deploy Kibana
      ansible.builtin.include_role:
        name: oddly.elasticstack.kibana
      when: "'kibana' in group_names"

# --- Phase 2: Record original certificate fingerprints ---

- name: Record original certificate fingerprints
  hosts: all
  vars:
    elasticsearch_tls_key_passphrase: PleaseChangeMeIndividually
    logstash_tls_key_passphrase: LogstashChangeMe
    kibana_tls_key_passphrase: PleaseChangeMe
  tasks:
    - name: Get ES transport cert fingerprint
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl pkcs12 -in /etc/elasticsearch/certs/{{ ansible_facts.hostname }}.p12
        -nokeys -passin pass:{{ elasticsearch_tls_key_passphrase }} 2>/dev/null |
        openssl x509 -fingerprint -sha256 -noout 2>/dev/null || echo "NONE"
      args:
        executable: /bin/bash
      register: _es_cert_fp_before
      changed_when: false
      no_log: true
      when: "'elasticsearch' in group_names"

    - name: Get Logstash cert fingerprint
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl pkcs12 -in /etc/logstash/certs/{{ ansible_facts.hostname }}-ls.p12
        -nokeys -passin pass:{{ logstash_tls_key_passphrase }} 2>/dev/null |
        openssl x509 -fingerprint -sha256 -noout 2>/dev/null || echo "NONE"
      args:
        executable: /bin/bash
      register: _ls_cert_fp_before
      changed_when: false
      no_log: true
      when: "'logstash' in group_names"

    - name: Get Kibana cert fingerprint
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl pkcs12 -in /etc/kibana/certs/{{ ansible_facts.hostname }}-kibana.p12
        -nokeys -passin pass:{{ kibana_tls_key_passphrase }} 2>/dev/null |
        openssl x509 -fingerprint -sha256 -noout 2>/dev/null || echo "NONE"
      args:
        executable: /bin/bash
      register: _kb_cert_fp_before
      changed_when: false
      no_log: true
      when: "'kibana' in group_names"

    - name: Display original fingerprints
      ansible.builtin.debug:
        msg: >-
          ES: {{ _es_cert_fp_before.stdout | default('N/A') }},
          LS: {{ _ls_cert_fp_before.stdout | default('N/A') }},
          KB: {{ _kb_cert_fp_before.stdout | default('N/A') }}

# --- Phase 3: Re-run with cert renewal flags ---

- name: Renew all certificates
  hosts: all
  vars:
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elasticstack_full_stack: true
    elasticstack_no_log: false
    elasticsearch_heap: "1"
    logstash_heap: "512m"
    logstash_pipeline_unsafe_shutdown: true
    kibana_tls: true
    # Force certificate renewal by setting the *_cert_will_expire_soon
    # flags directly from play vars. These now live in each role's
    # defaults/main.yml (moved there in #171), so play vars override them
    # cleanly and the role's renewal gates trip immediately without
    # cert_check_expiry having to compute an expiration date first.
    # (Setting *_cert_expiration_buffer to a big number also works and
    # is what this scenario used before #171 landed; both paths are
    # supported, this one is the intended API.)
    elasticstack_ca_will_expire_soon: true
    elasticsearch_cert_will_expire_soon: true
    kibana_cert_will_expire_soon: true
    logstash_cert_will_expire_soon: true
    logstash_cert_force_regenerate: true
  tasks:
    - name: Reset shared role import guard for re-run
      ansible.builtin.set_fact:
        _elasticstack_role_imported: false

    - name: Re-run Elasticsearch (triggers cert renewal)
      ansible.builtin.include_role:
        name: oddly.elasticstack.elasticsearch
      when: "'elasticsearch' in group_names"

    - name: Re-run Logstash (triggers cert renewal)
      ansible.builtin.include_role:
        name: oddly.elasticstack.logstash
      when: "'logstash' in group_names"

    - name: Re-run Kibana (triggers cert renewal)
      ansible.builtin.include_role:
        name: oddly.elasticstack.kibana
      when: "'kibana' in group_names"

# --- Phase 4: Confirm certificates actually changed ---
#
# Captures the post-renewal fingerprint and compares to the pre-renewal value
# from phase 2. Facts persist across plays within a single ansible-playbook
# run, so _*_cert_fp_before from phase 2 is still in scope here. (Verify is
# a separate playbook invocation by molecule, which is why this comparison
# must live in converge, not verify.)

- name: Verify certificate fingerprints changed after renewal
  hosts: all
  vars:
    elasticsearch_tls_key_passphrase: PleaseChangeMeIndividually
    logstash_tls_key_passphrase: LogstashChangeMe
    kibana_tls_key_passphrase: PleaseChangeMe
  tasks:
    - name: Get ES transport cert fingerprint (after renewal)
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl pkcs12 -in /etc/elasticsearch/certs/{{ ansible_facts.hostname }}.p12
        -nokeys -passin pass:{{ elasticsearch_tls_key_passphrase }} 2>/dev/null |
        openssl x509 -fingerprint -sha256 -noout 2>/dev/null
      args:
        executable: /bin/bash
      register: _es_cert_fp_after
      changed_when: false
      no_log: true
      when: "'elasticsearch' in group_names"

    - name: Get Logstash cert fingerprint (after renewal)
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl pkcs12 -in /etc/logstash/certs/{{ ansible_facts.hostname }}-ls.p12
        -nokeys -passin pass:{{ logstash_tls_key_passphrase }} 2>/dev/null |
        openssl x509 -fingerprint -sha256 -noout 2>/dev/null
      args:
        executable: /bin/bash
      register: _ls_cert_fp_after
      changed_when: false
      no_log: true
      when: "'logstash' in group_names"

    - name: Get Kibana cert fingerprint (after renewal)
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl pkcs12 -in /etc/kibana/certs/{{ ansible_facts.hostname }}-kibana.p12
        -nokeys -passin pass:{{ kibana_tls_key_passphrase }} 2>/dev/null |
        openssl x509 -fingerprint -sha256 -noout 2>/dev/null
      args:
        executable: /bin/bash
      register: _kb_cert_fp_after
      changed_when: false
      no_log: true
      when: "'kibana' in group_names"

    - name: Assert ES transport cert was actually replaced
      ansible.builtin.assert:
        that:
          - _es_cert_fp_before.stdout != "NONE"
          - _es_cert_fp_after.stdout | length > 0
          - _es_cert_fp_before.stdout != _es_cert_fp_after.stdout
        fail_msg: >-
          ES transport cert was not renewed (before={{ _es_cert_fp_before.stdout }},
          after={{ _es_cert_fp_after.stdout }}). The renewal play ran but the on-disk
          p12 was not replaced — check elasticsearch_cert_will_expire_soon handling.
      when: "'elasticsearch' in group_names"

    - name: Assert Logstash cert was actually replaced
      ansible.builtin.assert:
        that:
          - _ls_cert_fp_before.stdout != "NONE"
          - _ls_cert_fp_after.stdout | length > 0
          - _ls_cert_fp_before.stdout != _ls_cert_fp_after.stdout
        fail_msg: >-
          Logstash cert was not renewed (before={{ _ls_cert_fp_before.stdout }},
          after={{ _ls_cert_fp_after.stdout }}).
      when: "'logstash' in group_names"

    - name: Assert Kibana cert was actually replaced
      ansible.builtin.assert:
        that:
          - _kb_cert_fp_before.stdout != "NONE"
          - _kb_cert_fp_after.stdout | length > 0
          - _kb_cert_fp_before.stdout != _kb_cert_fp_after.stdout
        fail_msg: >-
          Kibana cert was not renewed (before={{ _kb_cert_fp_before.stdout }},
          after={{ _kb_cert_fp_after.stdout }}).
      when: "'kibana' in group_names"
