---
- name: Verify Elastic repository configuration
  hosts: all
  vars:
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
  tasks:
    - name: Check Elastic GPG key is present (Debian)
      ansible.builtin.stat:
        path: /usr/share/keyrings/elasticsearch.asc
      register: gpg_key
      when: ansible_facts.os_family == "Debian"

    - name: Assert GPG key exists (Debian)
      ansible.builtin.assert:
        that:
          - gpg_key.stat.exists
        fail_msg: "Elastic GPG key not found at /usr/share/keyrings/elasticsearch.asc"
      when: ansible_facts.os_family == "Debian"

    - name: Check Elastic repo file exists (Debian)
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/elasticstack.list
      register: repo_file_deb
      when: ansible_facts.os_family == "Debian"

    - name: Assert repo file exists (Debian)
      ansible.builtin.assert:
        that:
          - repo_file_deb.stat.exists
        fail_msg: "Elastic repo file not found at /etc/apt/sources.list.d/elasticstack.list"
      when: ansible_facts.os_family == "Debian"

    - name: Check Elastic repo file exists (RHEL)
      ansible.builtin.stat:
        path: /etc/yum.repos.d/elastic-release.repo
      register: repo_file_rhel
      when: ansible_facts.os_family == "RedHat"

    - name: Assert repo file exists (RHEL)
      ansible.builtin.assert:
        that:
          - repo_file_rhel.stat.exists
        fail_msg: "Elastic repo file not found at /etc/yum.repos.d/elastic-release.repo"
      when: ansible_facts.os_family == "RedHat"

    - name: Verify elasticsearch package is available (Debian)
      ansible.builtin.shell: >
        set -o pipefail &&
        apt-cache showpkg elasticsearch | grep -c '{{ elasticstack_release }}\.'
      args:
        executable: /bin/bash
      register: es_available_deb
      changed_when: false
      failed_when: es_available_deb.stdout | int < 1
      when: ansible_facts.os_family == "Debian"

    - name: Verify elasticsearch package is available (RHEL)
      ansible.builtin.shell: >
        set -o pipefail &&
        dnf list available elasticsearch 2>/dev/null | grep -c '{{ elasticstack_release }}\.'
      args:
        executable: /bin/bash
      register: es_available_rhel
      changed_when: false
      failed_when: es_available_rhel.stdout | int < 1
      when: ansible_facts.os_family == "RedHat"

    - name: Verify externally managed RPM repository selection
      when: ansible_facts.os_family == "RedHat"
      block:
        - name: Preserve managed repository configuration
          ansible.builtin.slurp:
            src: /etc/yum.repos.d/elastic-release.repo
          register: external_repo_fixture_original

        - name: Require the expected managed repository section
          ansible.builtin.assert:
            that:
              - "'[' ~ 'elastic-' ~ elasticstack_release ~ '.x]' in (external_repo_fixture_original.content | b64decode)"

        - name: Expose the external source and a disabled vendor repository trap
          ansible.builtin.copy:
            content: |
              {{ (external_repo_fixture_original.content | b64decode) |
                 replace('[elastic-' ~ elasticstack_release ~ '.x]', '[external-elastic-fixture]') }}
              [elastic-{{ elasticstack_release }}.x]
              name=Disabled vendor repository fixture
              baseurl=file:///nonexistent-elastic-repository-fixture
              enabled=0
              gpgcheck=1
              skip_if_unavailable=0
              metadata_expire=0
            dest: /etc/yum.repos.d/elastic-release.repo
            owner: root
            group: root
            mode: "{{ repo_file_rhel.stat.mode }}"

        - name: Check package resolution without the managed repository ID
          ansible.builtin.include_role:
            name: oddly.elasticstack.elasticstack
            tasks_from: install_elastic_package
            apply:
              check_mode: true
          vars:
            elasticstack_enable_repos: false
            elasticstack_full_stack: "{{ external_repo_fixture_full_stack }}"
            elasticstack_version: ""
            _package_name: bash
            _package_base_name: bash
          loop: [true, false]
          loop_control:
            loop_var: external_repo_fixture_full_stack

        - name: Assert the installed fixture package needs no transaction
          ansible.builtin.assert:
            that:
              - not _elasticstack_package_changed | bool
      always:
        - name: Restore the managed repository configuration
          ansible.builtin.copy:
            content: "{{ external_repo_fixture_original.content | b64decode }}"
            dest: /etc/yum.repos.d/elastic-release.repo
            owner: root
            group: root
            mode: "{{ repo_file_rhel.stat.mode }}"
          when: external_repo_fixture_original.content is defined
