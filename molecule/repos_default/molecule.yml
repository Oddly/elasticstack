---
prerun: false
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: default
platforms:
  - name: "repos-def-${MOLECULE_DISTRO:-debian12}-r${ELASTIC_RELEASE:-9}${MOLECULE_RUN_SUFFIX}"
    distro: "${MOLECULE_DISTRO:-debian12}"
    # 2048 MiB: dnf/python3 on rockylinux9 peaks near 1 GB during the
    # security-packages install (56 cgroup OOM kills at the old 1024 in
    # the 30 days to 2026-08-12, per the host kernel journal).
    memory_mb: 2048
provisioner:
  name: ansible
  env:
    ANSIBLE_LOG_PATH: /var/log/ansible.log
  connection_options:
    ansible_connection: ssh
    ansible_user: root
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
