---
- name: Verify Elasticsearch default cluster
  hosts: elasticsearch
  vars:
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
  tasks:
    - name: Fetch elastic password
      ansible.builtin.include_tasks: ../shared/verify_fetch_password.yml
      vars:
        _verify_elastic_password: "TestPassword123!"

    - name: Check cluster health
      ansible.builtin.include_tasks: ../shared/verify_es_health.yml
      vars:
        _verify_run_once: true

    - name: Verify expected number of nodes
      ansible.builtin.assert:
        that:
          - health.json.number_of_nodes == groups['elasticsearch'] | length
        fail_msg: "Expected {{ groups['elasticsearch'] | length }} nodes, got {{ health.json.number_of_nodes }}"
      run_once: true  # noqa: run-once[task]

    - name: Verify auto-generated password no longer works  # noqa: run-once[task]
      block:
        - name: Read auto-generated password from file  # noqa: run-once[task]
          ansible.builtin.shell: |
            set -o pipefail
            grep "PASSWORD elastic " /usr/share/elasticsearch/initial_passwords |
            awk {' print $4 '}
          args:
            executable: /bin/bash
          register: _old_pass
          changed_when: false
          run_once: true

        # The role MUST preserve the auto-generated password in initial_passwords
        # when the user supplies a custom one — overwriting it (to the user's
        # password) is the exact regression this block exists to catch. The
        # previous version skipped the API call when _old_pass.stdout matched
        # the user password, which silently turned the regression-guard into a
        # no-op the moment the regression actually happened.
        - name: Assert initial_passwords still holds the auto-generated password (not overwritten)  # noqa: run-once[task]
          ansible.builtin.assert:
            that:
              - _old_pass.stdout | length > 0
              - _old_pass.stdout != "TestPassword123!"
            fail_msg: >-
              initial_passwords was overwritten with the user-defined password.
              The role is supposed to preserve the auto-generated value here
              and only switch to the user password for API calls. If
              initial_passwords now contains the user value, the role has
              regressed and downstream services (Kibana, Logstash) that read
              from this file will end up with the wrong credentials.
          run_once: true

        - name: Try API with old password (should fail)  # noqa: run-once[task]
          ansible.builtin.uri:
            url: "https://localhost:9200/"
            user: elastic
            password: "{{ _old_pass.stdout }}"
            force_basic_auth: true
            validate_certs: false
            status_code: 401
          run_once: true

    - name: Read cluster settings  # noqa: run-once[task]
      ansible.builtin.uri:
        url: "https://localhost:9200/_cluster/settings?flat_settings=true"
        method: GET
        user: elastic
        password: "{{ elastic_pass.stdout }}"
        force_basic_auth: true
        validate_certs: false
      register: cluster_settings
      run_once: true

    - name: Verify cluster settings were applied  # noqa: run-once[task]
      ansible.builtin.assert:
        that:
          - cluster_settings.json.persistent['action.destructive_requires_name'] == 'true'
        fail_msg: >-
          elasticsearch_cluster_settings not applied.
          Got: {{ cluster_settings.json.persistent }}
      run_once: true

    - name: Verify LogsDB is enabled (9.x default)  # noqa: run-once[task]
      ansible.builtin.assert:
        that:
          - cluster_settings.json.persistent['cluster.logsdb.enabled'] == 'true'
        fail_msg: >-
          LogsDB not enabled.
          Got: {{ cluster_settings.json.persistent }}
      run_once: true
      when: elasticstack_release | int >= 9

    # OS tuning checks — skipped in containers where sysctl is restricted
    - name: Verify vm.max_map_count  # noqa: run-once[task]
      ansible.builtin.command: sysctl -n vm.max_map_count
      register: _max_map_count
      changed_when: false
      run_once: true
      when: ansible_facts.virtualization_type | default('') not in ['docker', 'container', 'containerd', 'lxc', 'podman']

    - name: Assert vm.max_map_count is 1048576  # noqa: run-once[task]
      ansible.builtin.assert:
        that:
          - _max_map_count.stdout | int == 1048576
        fail_msg: "vm.max_map_count is {{ _max_map_count.stdout }}, expected 1048576"
      run_once: true
      when: _max_map_count is not skipped

    - name: Verify vm.swappiness  # noqa: run-once[task]
      ansible.builtin.command: sysctl -n vm.swappiness
      register: _swappiness
      changed_when: false
      run_once: true
      when: ansible_facts.virtualization_type | default('') not in ['docker', 'container', 'containerd', 'lxc', 'podman']

    - name: Assert vm.swappiness is 1  # noqa: run-once[task]
      ansible.builtin.assert:
        that:
          - _swappiness.stdout | int == 1
        fail_msg: "vm.swappiness is {{ _swappiness.stdout }}, expected 1"
      run_once: true
      when: _swappiness is not skipped

    - name: Verify Elasticsearch logrotate config exists
      ansible.builtin.stat:
        path: /etc/logrotate.d/elasticsearch
      register: _es_logrotate

    - name: Assert Elasticsearch logrotate config is installed
      ansible.builtin.assert:
        that:
          - _es_logrotate.stat.exists
          - _es_logrotate.stat.mode == '0644'
        fail_msg: "/etc/logrotate.d/elasticsearch missing or wrong permissions"

    - name: Read logrotate config
      ansible.builtin.slurp:
        src: /etc/logrotate.d/elasticsearch
      register: _es_logrotate_content

    - name: Assert logrotate config sets expected directives
      ansible.builtin.assert:
        that:
          - "'copytruncate' in (_es_logrotate_content.content | b64decode)"
          - "'daily' in (_es_logrotate_content.content | b64decode)"
          - "'rotate 32' in (_es_logrotate_content.content | b64decode)"
          - "'/var/log/elasticsearch/*.log' in (_es_logrotate_content.content | b64decode)"
        fail_msg: "logrotate config missing expected directives"
