---
- name: Verify Kibana extras
  hosts: all
  tasks:
    - name: Run Kibana-side assertions
      when: "'kibana' in group_names"
      block:
        - name: Read kibana.yml
          ansible.builtin.slurp:
            src: /etc/kibana/kibana.yml
          register: kibana_yml

        - name: Assert server.protocol is emitted
          ansible.builtin.assert:
            that:
              - "'server.protocol: \"http1\"' in (kibana_yml.content | b64decode)"
              - >-
                'server.publicBaseUrl: "http://kibana-extras.example.test:5601"'
                in (kibana_yml.content | b64decode)
              - groups['elasticsearch'][0] in (kibana_yml.content | b64decode)
            fail_msg: >-
              Kibana server or explicit Elasticsearch host configuration did
              not render.

        - name: Assert elasticsearch.sniffOnConnectionFault fired
          ansible.builtin.assert:
            that:
              - "'elasticsearch.sniffOnConnectionFault: true' in (kibana_yml.content | b64decode)"
            fail_msg: >-
              sniffOnConnectionFault not rendered; the < 9 gate on
              kibana_sniff_on_connection_fault may have flipped without
              this scenario noticing.

        - name: Assert elasticsearch.sniffOnStart fired
          ansible.builtin.assert:
            that:
              - "'elasticsearch.sniffOnStart: true' in (kibana_yml.content | b64decode)"
            fail_msg: >-
              sniffOnStart not rendered; the < 9 gate on kibana_sniff_on_start
              may have flipped without this scenario noticing.

        - name: Assert elasticsearch.sniffInterval fired
          ansible.builtin.assert:
            that:
              - "'elasticsearch.sniffInterval: 30000' in (kibana_yml.content | b64decode)"
            fail_msg: >-
              sniffInterval not rendered; the < 9 gate on
              kibana_sniff_interval may have flipped.

        - name: Read node.options for max-old-space-size
          ansible.builtin.slurp:
            src: /etc/kibana/node.options
          register: kibana_node_opts

        - name: Assert --max-old-space-size was set from the variable
          ansible.builtin.assert:
            that:
              - "'--max-old-space-size=2048' in (kibana_node_opts.content | b64decode)"
            fail_msg: >-
              --max-old-space-size line missing from /etc/kibana/node.options;
              the kibana_node_max_old_space_size lineinfile task in
              roles/kibana/tasks/main.yml did not fire.

        - name: Verify kibana.yml is still valid YAML
          ansible.builtin.assert:
            that:
              - "(kibana_yml.content | b64decode | from_yaml) is mapping"
            fail_msg: "kibana.yml is not parseable as YAML after the extras were applied"

        # Coverage for #173's fail-fast rescue branch. The shared readiness
        # probe short-circuits with rc=2 when `systemctl is-active` reports
        # the unit as dead. Stop Kibana, run that task file, and assert its
        # diagnostic identifies the permanent service failure.
        - name: Stop Kibana to trigger the permanent-error branch
          ansible.builtin.service:
            name: kibana
            state: stopped

        - name: Run the shared readiness probe against a stopped Kibana
          block:
            - name: Include shared Kibana readiness task
              ansible.builtin.include_tasks:
                file: ../../roles/elasticstack/tasks/wait_for_http_service.yml
              vars:
                _wait_service_name: kibana
                _wait_url: "http://localhost:{{ elasticstack_kibana_port | default(5601) }}/api/status"
                _wait_fatal_pattern: "FATAL|Unable to connect to Elasticsearch|Authentication.*failed|Kibana server is not ready.*fatal"

            - name: Fail if the stopped-service readiness probe unexpectedly passed
              ansible.builtin.fail:
                msg: "The shared Kibana readiness probe unexpectedly passed for a stopped service"

          rescue:
            - name: Assert the shared probe failed with permanent-service diagnostics
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('service died while waiting for HTTP readiness')
                fail_msg: >-
                  The shared Kibana readiness probe did not report a permanent
                  service failure: {{ ansible_failed_result.msg | default('no failure message') }}

        # Start Kibana again so the follow-up idempotence run sees it as
        # already-started and Start Kibana reports changed=false.
        - name: Restart Kibana so idempotence sees no change
          ansible.builtin.service:
            name: kibana
            state: started
