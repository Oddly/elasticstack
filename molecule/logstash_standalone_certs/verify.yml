---
- name: Verify Logstash standalone certs
  hosts: all
  tasks:
    - name: Check Logstash service is running
      ansible.builtin.include_tasks: ../shared/verify_logstash_service.yml

    # --- Standalone-generated files exist ---

    - name: Stat each standalone artefact
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _ls_artefacts
      loop:
        - /etc/logstash/certs/standalone-ca.crt
        - /etc/logstash/certs/standalone-ca.key
        - /etc/logstash/certs/{{ inventory_hostname }}-server.crt
        - /etc/logstash/certs/{{ inventory_hostname }}.key
        - /etc/logstash/certs/keystore.pfx
        - /etc/logstash/certs/ca.crt

    - name: Assert every standalone-generated cert/key/keystore exists
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "{{ item.item }} not generated by standalone cert_source path"
      loop: "{{ _ls_artefacts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert standalone cert permissions are 0640
      ansible.builtin.assert:
        that:
          - item.stat.mode == "0640"
        fail_msg: "{{ item.item }} has mode {{ item.stat.mode }}, expected 0640"
      loop: "{{ _ls_artefacts.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- Standalone CA subject matches the hardcoded role value ---

    - name: Inspect standalone CA subject
      ansible.builtin.command:
        cmd: openssl x509 -in /etc/logstash/certs/standalone-ca.crt -noout -subject
      register: _ca_subject
      changed_when: false

    - name: Assert standalone CA was self-signed with the expected CN
      ansible.builtin.assert:
        that:
          - "'CN = Logstash Standalone CA' in _ca_subject.stdout or 'CN=Logstash Standalone CA' in _ca_subject.stdout"
        fail_msg: |
          standalone-ca.crt subject is unexpected. The role hardcodes
          /CN=Logstash Standalone CA. Got: {{ _ca_subject.stdout }}

    # --- Server cert chains to the standalone CA ---

    - name: Verify server cert was signed by the standalone CA
      ansible.builtin.shell:
        cmd: |
          openssl verify -CAfile /etc/logstash/certs/standalone-ca.crt \
            /etc/logstash/certs/{{ inventory_hostname }}-server.crt
        executable: /bin/bash
      register: _server_verify
      changed_when: false

    - name: Assert verify returned "OK"
      ansible.builtin.assert:
        that:
          - "'OK' in _server_verify.stdout"
        fail_msg: "openssl verify did not return OK: {{ _server_verify.stdout }}"

    # --- Server key is PKCS#8 PEM (Logstash requirement) ---

    - name: Read server key header
      ansible.builtin.command:
        cmd: head -1 /etc/logstash/certs/{{ inventory_hostname }}.key
      register: _server_key_header
      changed_when: false

    - name: Assert server key is unencrypted PKCS#8 PEM
      ansible.builtin.assert:
        that:
          - _server_key_header.stdout == '-----BEGIN PRIVATE KEY-----'
        fail_msg: >-
          Expected PKCS#8 PEM (-----BEGIN PRIVATE KEY-----), got
          {{ _server_key_header.stdout }}. The beats input plugin requires PKCS#8.

    # --- Keystore unlocks with the configured passphrase ---

    - name: Confirm PKCS12 keystore unlocks with the test passphrase
      ansible.builtin.command:
        cmd: >-
          openssl pkcs12 -in /etc/logstash/certs/keystore.pfx
          -nokeys -passin pass:StandaloneTestPass
      register: _pfx_check
      changed_when: false
      failed_when: _pfx_check.rc != 0

    - name: Confirm PKCS12 keystore REJECTS a wrong passphrase
      ansible.builtin.command:
        cmd: >-
          openssl pkcs12 -in /etc/logstash/certs/keystore.pfx
          -nokeys -passin pass:wrong-passphrase
      register: _pfx_bad_check
      changed_when: false
      failed_when: false

    - name: Assert wrong-passphrase open failed
      ansible.builtin.assert:
        that:
          - _pfx_bad_check.rc != 0
        fail_msg: >-
          keystore.pfx accepted a wrong passphrase — the role generated
          an unencrypted (or null-password) keystore.

    - name: Verify Logstash port and configuration syntax
      ansible.builtin.include_tasks: ../shared/verify_logstash_port.yml
      vars:
        _verify_logstash_port_timeout: 180

    - name: TLS handshake against Logstash 5044 (signed by standalone CA)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out=$(echo | openssl s_client \
            -connect localhost:5044 \
            -CAfile /etc/logstash/certs/standalone-ca.crt \
            -servername {{ ansible_facts.hostname }} 2>&1) || true
          echo "$out" | grep -E 'Verify return code|verify error|issuer=' || true
          echo "$out" | grep -q 'Verify return code: 0 (ok)'
        executable: /bin/bash
      register: _ls_tls_probe
      changed_when: false
      when: logstash_port_check is not failed
