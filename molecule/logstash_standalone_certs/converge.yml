---
# Exercises logstash_cert_source: standalone — the path where Logstash
# generates its own self-signed CA + server cert and PKCS12 keystore.
# Previously uncovered by any molecule scenario (the directory named
# logstash_standalone_certs actually tested cert_source: external).
- name: Converge
  hosts: all
  vars:
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elasticstack_full_stack: false
    elasticstack_no_log: false
    logstash_output_elasticsearch: false
    logstash_create_user: false
    logstash_create_role: false
    logstash_pipeline_unsafe_shutdown: true
    logstash_heap: "512m"
    logstash_input_beats: true
    logstash_input_beats_ssl: true
    logstash_input_beats_port: 5044
    logstash_cert_source: standalone
    logstash_tls_key_passphrase: StandaloneTestPass
    logstash_extra_outputs: |
      stdout { codec => rubydebug }
  tasks:
    - name: Include Elastic repos role
      ansible.builtin.include_role:
        name: oddly.elasticstack.repos

    - name: Include Logstash role
      ansible.builtin.include_role:
        name: oddly.elasticstack.logstash
