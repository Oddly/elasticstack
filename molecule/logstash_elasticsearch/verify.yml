---
- name: Verify Logstash + ES integration
  hosts: all
  vars:
    elasticstack_elasticsearch_http_port: 9200
    elasticstack_elasticsearch_group_name: elasticsearch
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
  tasks:
    - name: Set elasticsearch_ca variable
      ansible.builtin.set_fact:
        elasticsearch_ca: "{{ groups[elasticstack_elasticsearch_group_name][0] }}"
      when: elasticsearch_ca is undefined

    - name: Fetch Elastic password
      ansible.builtin.shell: |
        set -o pipefail
        grep "PASSWORD elastic " /usr/share/elasticsearch/initial_passwords |
        awk {' print $4 '}
      args:
        executable: /bin/bash
      register: elastic_pass
      changed_when: false
      delegate_to: "{{ elasticsearch_ca }}"

    - name: Elasticsearch health check
      ansible.builtin.uri:
        url: "https://localhost:{{ elasticstack_elasticsearch_http_port }}/_cluster/health"
        method: GET
        force_basic_auth: true
        user: elastic
        password: "{{ elastic_pass.stdout }}"
        return_content: true
        status_code: 200
        validate_certs: false
      register: es_health
      until: es_health.json.status in ["green", "yellow"]
      retries: 6
      delay: 10
      when: "'elasticsearch' in group_names"

    - name: Check Logstash is running
      ansible.builtin.wait_for:
        port: 5044
      when: "'logstash' in group_names"

    - name: Verify Logstash service is running
      ansible.builtin.service_facts:
      when: "'logstash' in group_names"

    - name: Assert Logstash service is active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['logstash.service'].state == 'running'
        fail_msg: "Logstash service is not running"
      when: "'logstash' in group_names"

    - name: Verify Logstash certificates exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: cert_check
      loop:
        - /etc/logstash/certs/ca.crt
        - /etc/logstash/certs/keystore.pfx
      when: "'logstash' in group_names"

    - name: Assert Logstash certs are present
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing certificate: {{ item.item }}"
      loop: "{{ cert_check.results }}"
      when: "'logstash' in group_names"

    - name: Check Logstash output configuration permissions
      ansible.builtin.stat:
        path: /etc/logstash/conf.d/main/90-output.conf
      register: logstash_output_config
      when: "'logstash' in group_names"

    - name: Assert Logstash output configuration is service-readable and private
      ansible.builtin.assert:
        that:
          - logstash_output_config.stat.pw_name == 'root'
          - logstash_output_config.stat.gr_name == 'logstash'
          - logstash_output_config.stat.mode == '0640'
        fail_msg: >-
          Logstash output configuration must be root:logstash 0640 because it
          contains the Elasticsearch writer password.
      when: "'logstash' in group_names"

    - name: Read secured Elasticsearch output configuration
      ansible.builtin.slurp:
        src: /etc/logstash/conf.d/main/90-output.conf
      register: logstash_output_content
      when: "'logstash' in group_names"

    - name: Verify logstash_security, logstash_output_elasticsearch, and sniffing variables
      ansible.builtin.assert:
        that:
          - "'elasticsearch {' in (logstash_output_content.content | b64decode)"
          - "'ssl_enabled' in (logstash_output_content.content | b64decode) or 'ssl => true' in (logstash_output_content.content | b64decode)"
          - "'sniffing => true' in (logstash_output_content.content | b64decode)"
          - "'sniffing_delay => 8' in (logstash_output_content.content | b64decode)"
          - "'sniffing_path => \"/_nodes/http\"' in (logstash_output_content.content | b64decode)"
        fail_msg: "Secured Elasticsearch output or sniffing variables did not render"
      when: "'logstash' in group_names"

    - name: Stop Logstash for syntax check
      ansible.builtin.service:
        name: logstash
        state: stopped
      when: "'logstash' in group_names"

    - name: Run Logstash config syntax check
      ansible.builtin.command: "/usr/share/logstash/bin/logstash --path.settings=/etc/logstash -t"
      become: true
      become_user: logstash
      become_method: ansible.builtin.su
      become_flags: '-s /bin/sh'
      environment:
        HOME: /tmp
      when: "'logstash' in group_names"
      changed_when: false

    - name: Start Logstash after syntax check
      ansible.builtin.service:
        name: logstash
        state: started
      when: "'logstash' in group_names"

    - name: Verify Logstash pipeline is loaded
      ansible.builtin.uri:
        url: "http://localhost:9600/_node/stats/pipelines"
        return_content: true
      register: logstash_stats
      changed_when: false
      retries: 6
      delay: 10
      until: (logstash_stats.json.pipelines.main | default(none)) is not none
      when: "'logstash' in group_names"

    - name: Show Logstash pipeline stats
      ansible.builtin.debug:
        msg: >-
          Pipeline loaded —
          in: {{ (logstash_stats.json.pipelines.main.events | default({})).in | default('N/A') }},
          out: {{ (logstash_stats.json.pipelines.main.events | default({})).out | default('N/A') }}
      when:
        - "'logstash' in group_names"
        - logstash_stats.json is defined

    - name: Verify Logstash output config has ES connection
      ansible.builtin.command: grep -l "ssl_enabled" /etc/logstash/conf.d/main/90-output.conf
      changed_when: false
      when:
        - "'logstash' in group_names"
        - elasticstack_release | default(9) | int >= 9
