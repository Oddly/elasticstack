---
# Real-world scenario: Logstash sending data to Elasticsearch with full
# security chain (TLS, authentication, dedicated user/role).
# This tests the most important Logstash integration path.
- name: Deploy Logstash with Elasticsearch backend
  hosts: all
  vars:
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elasticstack_full_stack: true
    elasticstack_no_log: false
    elasticsearch_heap: "1"
    logstash_heap: "512m"
    logstash_security: true
    logstash_output_elasticsearch: true
    logstash_sniffing: true
    logstash_pipeline_unsafe_shutdown: true
    logstash_create_role: true
    logstash_role_name: molecule_writer
    logstash_role_cluster_privileges:
      - monitor
      - manage_ilm
    logstash_role_indices_names:
      - molecule-logs-*
    logstash_role_indices_privileges:
      - write
      - create_index
    logstash_create_user: true
    logstash_user_name: molecule_writer
    logstash_user_password: "MoleculeLogstashPassword!"
    logstash_user_email: molecule@example.test
    logstash_user_fullname: Molecule Logstash Writer
    logstash_filters: |
      grok {
        match => { "message" => "%{SYSLOGLINE}" }
      }
      date {
        match => [ "timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
      }
  tasks:
    - name: Include Elastic repos
      ansible.builtin.include_role:
        name: oddly.elasticstack.repos

    - name: Deploy Elasticsearch
      ansible.builtin.include_role:
        name: oddly.elasticstack.elasticsearch
      when: "'elasticsearch' in group_names"

    - name: CI — set lenient disk watermarks
      ansible.builtin.include_tasks: ../shared/set_ci_watermarks.yml
      when: "'elasticsearch' in group_names"

    - name: CI — clean cache after ES
      ansible.builtin.include_tasks: ../shared/cleanup_cache.yml

    - name: Deploy Logstash
      ansible.builtin.include_role:
        name: oddly.elasticstack.logstash
      when: "'logstash' in group_names"
