---
- name: Install Elasticsearch with good config
  hosts: all
  vars:
    elasticstack_full_stack: false
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elasticsearch_heap: "1"
    elasticstack_no_log: false
  tasks:
    - name: Include Elastic repos role
      ansible.builtin.include_role:
        name: oddly.elasticstack.repos

    - name: Include Elasticsearch role
      ansible.builtin.include_role:
        name: oddly.elasticstack.elasticsearch

    - name: CI — set lenient disk watermarks
      ansible.builtin.include_tasks: ../shared/set_ci_watermarks.yml

- name: Test startup failure diagnostics
  hosts: all
  tasks:
    - name: Back up good config
      ansible.builtin.copy:
        src: /etc/elasticsearch/elasticsearch.yml
        dest: /etc/elasticsearch/elasticsearch.yml.good
        remote_src: true
        mode: "0644"

    - name: Test bad config produces fast failure with diagnostics
      block:
        # Use a setting ES guarantees to reject (malformed YAML at the
        # top level). The previous "bogus.nonexistent.setting: true"
        # bait relied on ES rejecting unknown root settings, which some
        # versions silently archive as "archived.bogus..." — the rescue
        # below would then not fire and the test would mis-report.
        - name: Inject malformed setting that ES is guaranteed to reject
          ansible.builtin.lineinfile:
            path: /etc/elasticsearch/elasticsearch.yml
            line: "discovery.type: bogus-invalid-discovery-type"

        - name: Attempt restart with bad config (should fail with diagnostics)
          ansible.builtin.include_role:
            name: oddly.elasticstack.elasticsearch
            tasks_from: restart_and_verify_elasticsearch.yml

        - name: This should not be reached
          ansible.builtin.fail:
            msg: "restart_and_verify_elasticsearch.yml did not fail on bad config"

      rescue:
        - name: Assert failure includes non-empty diagnostic log output
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is defined
              - "'Recent log output' in ansible_failed_result.msg"
              # The previous check only required the literal header string
              # 'Recent log output' to appear — the role hardcodes that
              # string, so the assertion would pass even if journalctl
              # returned an empty stdout (broken diagnostics). Require
              # enough trailing content that real journal output must be
              # present (200+ chars beyond the header).
              - ansible_failed_result.msg | length > (('Recent log output:' | length) + 200)
              # And require at least one of the systemd/ES tokens that any
              # real ES startup-failure log would contain.
              - >-
                ('elasticsearch.service' in ansible_failed_result.msg)
                or ('Elasticsearch' in ansible_failed_result.msg)
                or ('exit code' in ansible_failed_result.msg)
            fail_msg: >-
              Expected a substantial diagnostic message containing real
              journal output, got:
              {{ ansible_failed_result.msg | default('no message') }}

    - name: Restore good config
      ansible.builtin.copy:
        src: /etc/elasticsearch/elasticsearch.yml.good
        dest: /etc/elasticsearch/elasticsearch.yml
        remote_src: true
        mode: "0644"

    # systemd may refuse to restart a recently-failed service; clear the
    # failure state and give ES a moment to release node locks.
    - name: Reset systemd failure state before recovery restart
      ansible.builtin.command:
        cmd: systemctl reset-failed elasticsearch.service
      changed_when: false

    - name: Wait for node lock to be released
      ansible.builtin.pause:
        seconds: 5

    - name: Restart Elasticsearch with restored config
      ansible.builtin.include_role:
        name: oddly.elasticstack.elasticsearch
        tasks_from: restart_and_verify_elasticsearch.yml
