---
- name: Verify Logstash centralized pipeline management configuration
  hosts: all
  tasks:
    - name: Read logstash.yml
      ansible.builtin.slurp:
        src: /etc/logstash/logstash.yml
      register: logstash_yml

    - name: Decode logstash.yml
      ansible.builtin.set_fact:
        logstash_config: "{{ logstash_yml.content | b64decode }}"

    # --- Centralized pipeline management ---

    - name: Verify xpack.management.enabled is true
      ansible.builtin.assert:
        that:
          - "'xpack.management.enabled: true' in logstash_config"
        fail_msg: "xpack.management.enabled not set to true"

    - name: Verify management username
      ansible.builtin.assert:
        that:
          - "'xpack.management.elasticsearch.username: logstash_internal' in logstash_config"
        fail_msg: "Management username not configured"

    - name: Verify management password
      ansible.builtin.assert:
        that:
          - "'xpack.management.elasticsearch.password: testpassword' in logstash_config"
        fail_msg: "Management password not configured"

    - name: Verify management ES hosts
      ansible.builtin.assert:
        that:
          - "'es-001.example.com:9200' in logstash_config"
          - "'es-002.example.com:9200' in logstash_config"
        fail_msg: "Management ES hosts not configured"

    - name: Verify pipeline IDs
      ansible.builtin.assert:
        that:
          - "'beats' in logstash_config"
          - "'syslog' in logstash_config"
          - "'agent-input-pipeline' in logstash_config"
        fail_msg: "Pipeline IDs not configured"

    # --- Dead letter queue ---

    - name: Verify DLQ is enabled
      ansible.builtin.assert:
        that:
          - "'dead_letter_queue.enable: true' in logstash_config"
        fail_msg: "Dead letter queue not enabled"

    - name: Verify DLQ retention
      ansible.builtin.assert:
        that:
          - "'dead_letter_queue.retain.age: 7d' in logstash_config"
        fail_msg: "DLQ retention age not set"

    # --- Log format ---

    - name: Verify log format is json
      ansible.builtin.assert:
        that:
          - "'log.format: json' in logstash_config"
        fail_msg: "Log format not set to json"

    # --- Monitoring ---

    - name: Verify monitoring is disabled
      ansible.builtin.assert:
        that:
          - "'monitoring.enabled: false' in logstash_config"
        fail_msg: "Monitoring not disabled"

    # --- HTTP API binding ---

    - name: Verify HTTP host is set
      ansible.builtin.assert:
        that:
          - "'api.http.host: 127.0.0.1' in logstash_config"
        fail_msg: "api.http.host not set to 127.0.0.1 in logstash.yml"

    - name: Verify HTTP port is set
      ansible.builtin.assert:
        that:
          - "'api.http.port: 9600' in logstash_config"
        fail_msg: "api.http.port not set to 9600 in logstash.yml"

    # --- Extra config ---

    - name: Verify extra_config settings are rendered
      ansible.builtin.assert:
        that:
          - "'queue.checkpoint.writes' in logstash_config"
          - "'xpack.management.elasticsearch.sniffing' in logstash_config"
          - "'xpack.management.logstash.poll_interval' in logstash_config"
          - "'xpack.management.elasticsearch.ssl.certificate_authority' in logstash_config"
        fail_msg: "Extra config settings not rendered in logstash.yml"

    # --- Verify no local pipelines ---

    - name: Check no pipeline config directory
      ansible.builtin.stat:
        path: /etc/logstash/conf.d/main
      register: pipeline_dir

    - name: Assert no local pipeline configs exist with centralized management
      ansible.builtin.assert:
        that:
          - >-
            (not pipeline_dir.stat.exists) or
            (pipeline_dir.stat.isdir and pipeline_dir.stat.size == 0)
        fail_msg: >-
          /etc/logstash/conf.d/main exists with content despite
          logstash_no_pipelines: true. The role should not have written
          local pipeline files when xpack.management is configured.

    # --- Confirm Logstash actually starts ---
    #
    # The previous version of this verify only inspected /etc/logstash/logstash.yml
    # — never confirmed Logstash came up. If xpack.management.* was misconfigured
    # (broken cert path, wrong URL, missing required field) Logstash crashes on
    # startup but every assertion above still passes because they only test
    # rendered config.

    - name: Check Logstash service is running
      ansible.builtin.service:
        name: logstash
        state: started
      check_mode: true
      register: _ls_svc
      failed_when: _ls_svc.changed

    - name: Wait for Logstash monitoring API
      ansible.builtin.wait_for:
        port: 9600
        timeout: 180
        state: started
      register: _ls_api_wait

    - name: Scrape recent Logstash log for xpack.management bootstrap errors
      ansible.builtin.shell:
        cmd: |
          journalctl -u logstash --no-pager -n 200 2>/dev/null \
            || tail -200 /var/log/logstash/logstash-plain.log 2>/dev/null \
            || true
        executable: /bin/bash
      register: _ls_log
      changed_when: false

    - name: Assert no xpack.management configuration-retrieval failures in the log
      ansible.builtin.assert:
        that:
          # Concrete error messages Logstash emits when xpack.management
          # can't connect or load a pipeline. If any of these appear,
          # Logstash is up but central-pipeline retrieval is broken — the
          # scenario claims to test the feature, so this matters.
          - "'Could not load the configuration' not in _ls_log.stdout"
          - "'Configuration retrieval failed' not in _ls_log.stdout"
          - "'Failed to fetch X-Pack information' not in _ls_log.stdout"
        fail_msg: |
          Logstash started but xpack.management failed to retrieve the
          centralized pipeline. Recent log:
          {{ _ls_log.stdout }}
