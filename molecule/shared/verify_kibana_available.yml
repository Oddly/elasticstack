---
# Wait for Kibana's status endpoint to report that all plugins are available.
# The caller supplies the Elasticsearch password through ``elastic_pass``.
# Optional variables:
#   _verify_kibana_url: status endpoint (default: local HTTP endpoint)
#   _verify_kibana_retries: number of status checks (default: 30)
#   _verify_kibana_delay: seconds between checks (default: 10)
#   _verify_kibana_validate_certs: validate HTTPS certificates (default: false)
#   _verify_kibana_status_codes: accepted transient/ready HTTP statuses
#   _verify_kibana_user: HTTP basic-auth user (default: elastic)
- name: Connect to Kibana
  ansible.builtin.uri:
    url: "{{ _verify_kibana_url | default('http://localhost:5601/api/status') }}"
    method: GET
    force_basic_auth: true
    user: "{{ _verify_kibana_user | default('elastic') }}"
    password: "{{ elastic_pass.stdout }}"
    return_content: true
    status_code: "{{ _verify_kibana_status_codes | default([200, 503]) }}"
    validate_certs: "{{ _verify_kibana_validate_certs | default(false) | bool }}"
  register: kibana_status
  retries: "{{ _verify_kibana_retries | default(30) }}"
  delay: "{{ _verify_kibana_delay | default(10) }}"
  until: (kibana_status.json.status.overall.level | default('')) == 'available'

- name: Verify Kibana is available
  ansible.builtin.assert:
    that:
      - kibana_status.json.status.overall.level == 'available'
    fail_msg: "Kibana status: {{ kibana_status.json.status.overall.level | default('unknown') }}"
