---
# Generate the three PEM certificate pairs used by the external-certificate
# scenarios. The caller must gather facts before including this file.
# Outputs in /tmp/test-certs/: ca.crt, transport.crt, transport.key,
# http.crt, and http.key.
- name: Install openssl for test certificate generation
  ansible.builtin.package:
    name: openssl
    state: present

- name: Create test certificate directory
  ansible.builtin.file:
    path: /tmp/test-certs
    state: directory
    mode: "0700"

- name: Generate CA private key
  ansible.builtin.command:
    argv:
      - openssl
      - genrsa
      - -out
      - /tmp/test-certs/ca.key
      - "2048"
    creates: /tmp/test-certs/ca.key

- name: Generate CA certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -new
      - -nodes
      - -key
      - /tmp/test-certs/ca.key
      - -sha256
      - -days
      - "365"
      - -subj
      - /CN=Test CA
      - -out
      - /tmp/test-certs/ca.crt
    creates: /tmp/test-certs/ca.crt

- name: Generate transport key
  ansible.builtin.command:
    argv:
      - openssl
      - genrsa
      - -out
      - /tmp/test-certs/transport.key
      - "2048"
    creates: /tmp/test-certs/transport.key

- name: Create transport CSR config
  ansible.builtin.copy:
    content: |
      [req]
      distinguished_name = req_dn
      req_extensions = v3_req
      prompt = no
      [req_dn]
      CN = {{ ansible_facts.hostname }}
      [v3_req]
      subjectAltName = DNS:{{ ansible_facts.hostname }},DNS:{{ ansible_facts.fqdn | default(ansible_facts.hostname) }},DNS:{{ inventory_hostname }},DNS:localhost,IP:{{ ansible_facts.default_ipv4.address | default(ansible_facts.all_ipv4_addresses[0]) }},IP:127.0.0.1
    dest: /tmp/test-certs/transport.cnf
    mode: "0600"

- name: Generate transport CSR
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -key
      - /tmp/test-certs/transport.key
      - -config
      - /tmp/test-certs/transport.cnf
      - -out
      - /tmp/test-certs/transport.csr
    creates: /tmp/test-certs/transport.csr

- name: Sign transport certificate
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - /tmp/test-certs/transport.csr
      - -CA
      - /tmp/test-certs/ca.crt
      - -CAkey
      - /tmp/test-certs/ca.key
      - -CAcreateserial
      - -out
      - /tmp/test-certs/transport.crt
      - -days
      - "365"
      - -sha256
      - -extensions
      - v3_req
      - -extfile
      - /tmp/test-certs/transport.cnf
    creates: /tmp/test-certs/transport.crt

- name: Generate HTTP key
  ansible.builtin.command:
    argv:
      - openssl
      - genrsa
      - -out
      - /tmp/test-certs/http.key
      - "2048"
    creates: /tmp/test-certs/http.key

- name: Create HTTP CSR config
  ansible.builtin.copy:
    content: |
      [req]
      distinguished_name = req_dn
      req_extensions = v3_req
      prompt = no
      [req_dn]
      CN = {{ ansible_facts.hostname }}-http
      [v3_req]
      subjectAltName = DNS:{{ ansible_facts.hostname }},DNS:{{ ansible_facts.fqdn | default(ansible_facts.hostname) }},DNS:{{ inventory_hostname }},DNS:localhost,IP:{{ ansible_facts.default_ipv4.address | default(ansible_facts.all_ipv4_addresses[0]) }},IP:127.0.0.1
    dest: /tmp/test-certs/http.cnf
    mode: "0600"

- name: Generate HTTP CSR
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -key
      - /tmp/test-certs/http.key
      - -config
      - /tmp/test-certs/http.cnf
      - -out
      - /tmp/test-certs/http.csr
    creates: /tmp/test-certs/http.csr

- name: Sign HTTP certificate
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - /tmp/test-certs/http.csr
      - -CA
      - /tmp/test-certs/ca.crt
      - -CAkey
      - /tmp/test-certs/ca.key
      - -CAcreateserial
      - -out
      - /tmp/test-certs/http.crt
      - -days
      - "365"
      - -sha256
      - -extensions
      - v3_req
      - -extfile
      - /tmp/test-certs/http.cnf
    creates: /tmp/test-certs/http.crt
