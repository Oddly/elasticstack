---
- name: Converge
  hosts: all
  vars:
    elasticstack_release: "{{ lookup('env', 'ELASTIC_RELEASE') | default('9', true) | int }}"
    elasticstack_full_stack: false
    elasticstack_security: false
    elasticstack_no_log: false
    # Keep an Elasticsearch output in the rendered pipeline so the scenario
    # proves the inherited stack security setting produces a plain output.
    logstash_output_elasticsearch: true
    logstash_elasticsearch_hosts:
      - 127.0.0.1
    logstash_create_user: false
    logstash_create_role: false
    logstash_input_beats_ssl: false
    logstash_pipeline_unsafe_shutdown: true
    logstash_heap: "512m"
    logstash_filters: |
      grok {
        match => { "message" => "%{SYSLOGLINE}" }
      }
      date {
        match => [ "timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
      }
    logstash_extra_outputs: |
      file {
        path => "/var/log/logstash/standalone-output.log"
      }
  tasks:
    - name: Include Elastic repos role
      ansible.builtin.include_role:
        name: oddly.elasticstack.repos

    - name: Include Logstash role
      ansible.builtin.include_role:
        name: oddly.elasticstack.logstash
