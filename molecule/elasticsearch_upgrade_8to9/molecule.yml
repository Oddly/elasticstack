---
prerun: false
# Molecule scenario for testing Elasticsearch 8.x to 9.x upgrade
# This scenario first installs ES 8.x, then upgrades to 9.x
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: default
platforms:
  - name: "es-upg89-n1-${MOLECULE_DISTRO:-debian12}${MOLECULE_RUN_SUFFIX}"
    groups:
      - elasticsearch
    distro: "${MOLECULE_DISTRO:-debian12}"
    memory_mb: 4096
  - name: "es-upg89-n2-${MOLECULE_DISTRO:-debian12}${MOLECULE_RUN_SUFFIX}"
    groups:
      - elasticsearch
    distro: "${MOLECULE_DISTRO:-debian12}"
    memory_mb: 4096
  # Three master-eligible nodes, not two. A two-node cluster has no quorum
  # tolerance: when the rolling upgrade stops one node the survivor cannot
  # elect a master alone, and the upgraded node comes back as its own
  # single-node cluster — the two never reconverge, number_of_nodes stays 1,
  # and the health gate hangs until the job times out. Three nodes keep a
  # majority (2 of 3) available while one is down, which is the whole point
  # of exercising a rolling upgrade.
  - name: "es-upg89-n3-${MOLECULE_DISTRO:-debian12}${MOLECULE_RUN_SUFFIX}"
    groups:
      - elasticsearch
    distro: "${MOLECULE_DISTRO:-debian12}"
    memory_mb: 4096
provisioner:
  name: ansible
  env:
    ANSIBLE_LOG_PATH: /var/log/ansible.log
  connection_options:
    ansible_connection: ssh
    ansible_user: root
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
        # CI-appropriate health-gate budget. In this scenario the cluster is
        # tiny and reconverges in seconds, so 20 x 15s (~5 min) is ample
        # headroom when healthy. The point is the failure mode: if a future
        # regression re-breaks cluster reformation, the gate fails cleanly
        # inside timeout-minutes rather than spinning the default
        # 100 x 30s = 50 min into a timeout — which GitHub records as
        # "cancelled", under which the if: !success() diagnostics still run
        # but a plain failure is clearer and faster to triage.
        elasticsearch_upgrade_health_retries: 20
        elasticsearch_upgrade_health_delay: 15
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
