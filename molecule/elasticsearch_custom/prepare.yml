---
- name: Import shared Molecule preparation
  import_playbook: ../shared/prepare.yml

- name: Prepare custom Elasticsearch directories
  hosts: all
  tasks:
    - name: Create custom data directory
      ansible.builtin.file:
        path: /data/elasticsearch
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create custom log directory
      ansible.builtin.file:
        path: /var/log/elasticsearch-custom
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create snapshot repository directory
      ansible.builtin.file:
        path: /mnt/es-snapshots
        state: directory
        owner: root
        group: root
        mode: "0755"
