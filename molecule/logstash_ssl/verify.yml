---
- name: Verify Logstash SSL deployment
  hosts: all
  tasks:
    - name: Check Logstash service is running
      ansible.builtin.include_tasks: ../shared/verify_logstash_service.yml

    # --- Certificate verification ---

    - name: Check certificate directory exists
      ansible.builtin.stat:
        path: /etc/logstash/certs
      register: certs_dir
      failed_when: not certs_dir.stat.exists

    - name: Check server certificate exists
      ansible.builtin.stat:
        path: "/etc/logstash/certs/{{ inventory_hostname }}-server.crt"
      register: server_cert
      failed_when: not server_cert.stat.exists

    - name: Check server key exists
      ansible.builtin.stat:
        path: "/etc/logstash/certs/{{ inventory_hostname }}.key"
      register: server_key
      failed_when: not server_key.stat.exists

    - name: Check CA certificate exists
      ansible.builtin.stat:
        path: /etc/logstash/certs/ca.crt
      register: ca_cert
      failed_when: not ca_cert.stat.exists

    - name: Verify certificate permissions
      ansible.builtin.assert:
        that:
          - server_cert.stat.mode == '0640'
          - server_key.stat.mode == '0640'
          - ca_cert.stat.mode == '0640'
        fail_msg: "Certificate file permissions are not correct (expected 0640)"

    - name: Verify server key is unencrypted PKCS#8 PEM (not PKCS#1, not encrypted)
      ansible.builtin.command: head -1 /etc/logstash/certs/{{ inventory_hostname }}.key
      register: _server_key_header
      changed_when: false

    - name: Assert PKCS#8 header
      ansible.builtin.assert:
        that:
          - _server_key_header.stdout == '-----BEGIN PRIVATE KEY-----'
        fail_msg: >-
          Expected unencrypted PKCS#8 PEM (-----BEGIN PRIVATE KEY-----),
          got {{ _server_key_header.stdout }}. The beats/elastic_agent input
          requires PKCS#8 per upstream Logstash docs.

    # --- Input verification (elastic_agent with SSL) ---

    - name: Read input configuration
      ansible.builtin.slurp:
        src: /etc/logstash/conf.d/main/10-input.conf
      register: input_content

    - name: Verify elastic_agent input is configured with SSL
      ansible.builtin.assert:
        that:
          - "'elastic_agent {' in (input_content.content | b64decode)"
          - "'port => 5044' in (input_content.content | b64decode)"
          - "'ssl_enabled => true' in (input_content.content | b64decode) or 'ssl => true' in (input_content.content | b64decode)"
          - "'ssl_certificate' in (input_content.content | b64decode)"
          - "'ssl_key' in (input_content.content | b64decode)"
        fail_msg: "Elastic Agent input with SSL not properly configured"

    - name: Verify beats input is NOT configured
      ansible.builtin.assert:
        that:
          - "'beats {' not in (input_content.content | b64decode)"
        fail_msg: "Beats input should not be present when disabled"

    - name: Verify Logstash port and configuration syntax
      ansible.builtin.include_tasks: ../shared/verify_logstash_port.yml
      vars:
        _verify_logstash_port_timeout: 300

    # An open socket doesn't prove TLS — Logstash could be serving plain text
    # on 5044 if the SSL block silently failed to load. Run an actual TLS
    # handshake against the port and verify the served cert chains to our
    # test CA.
    - name: TLS handshake against Logstash 5044 (signed by Test CA)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out=$(echo | openssl s_client \
            -connect localhost:5044 \
            -CAfile /tmp/test-certs/ca.crt \
            -servername {{ ansible_facts.hostname }} 2>&1) || true
          echo "$out" | grep -E 'Verify return code|verify error|issuer=' || true
          echo "$out" | grep -q 'Verify return code: 0 (ok)'
        executable: /bin/bash
      register: _ls_tls_probe
      changed_when: false
      when: logstash_port_check is not failed
