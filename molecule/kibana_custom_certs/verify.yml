---
- name: Verify Kibana with external cert source, web TLS on, system trust store CA
  hosts: all
  vars:
    elasticstack_elasticsearch_http_port: 9200
    elasticstack_elasticsearch_group_name: elasticsearch
    kibana_certs_dir: /etc/kibana/custom-certs
  tasks:
    - name: Set elasticsearch_ca variable
      ansible.builtin.set_fact:
        elasticsearch_ca: "{{ groups[elasticstack_elasticsearch_group_name][0] }}"
      when: elasticsearch_ca is undefined

    - name: Fetch Elastic password
      ansible.builtin.include_tasks: ../shared/verify_fetch_password.yml
      vars:
        _verify_delegate_to: "{{ elasticsearch_ca }}"

    - name: Elasticsearch health check
      ansible.builtin.include_tasks: ../shared/verify_es_health.yml
      vars:
        _verify_es_health_query: "?wait_for_status=yellow&timeout=30s"
        _verify_es_statuses: [green, yellow]
        _verify_when: "{{ 'elasticsearch' in group_names }}"

    - name: Run Kibana checks
      when: "'kibana' in group_names"
      block:
        - name: Check Kibana availability
          ansible.builtin.include_tasks: ../shared/verify_kibana_available.yml
          vars:
            _verify_kibana_url: "https://localhost:5601/api/status"
            _verify_kibana_retries: 18
            _verify_kibana_validate_certs: false

        - name: Read kibana.yml
          ansible.builtin.slurp:
            src: /etc/kibana/kibana.yml
          register: kibana_yml

        - name: Verify CA is NOT in kibana.yml (system trust store used)
          ansible.builtin.assert:
            that:
              - "'certificateAuthorities' not in (kibana_yml.content | b64decode)"
            fail_msg: "certificateAuthorities should not be present — CA is in system trust store"

        - name: Verify server.ssl.enabled IS present (TLS enabled)
          ansible.builtin.assert:
            that:
              - "'server.ssl.enabled: true' in (kibana_yml.content | b64decode)"
            fail_msg: "server.ssl.enabled: true should be present when kibana_tls is true"

        # An open https://localhost:5601 with validate_certs:false doesn't
        # prove the role rendered the right cert paths — Kibana could be
        # serving its bundled default cert if the role's PEM branch picked
        # up the wrong filename (e.g. wrong _kibana_cert_format default
        # silently re-routed to the .p12 keystore.path branch).
        - name: Verify server.ssl.certificate and server.ssl.key paths are rendered
          ansible.builtin.assert:
            that:
              - >-
                ('server.ssl.certificate: ' ~
                ((kibana_certs_dir ~ '/' ~ inventory_hostname ~ '-kibana.crt') | to_json))
                in (kibana_yml.content | b64decode)
              - >-
                ('server.ssl.key: ' ~
                ((kibana_certs_dir ~ '/' ~ inventory_hostname ~ '-kibana.key') | to_json))
                in (kibana_yml.content | b64decode)
              - "'keystore.path' not in (kibana_yml.content | b64decode)"
              - "'elasticsearch.ssl.verificationMode: none' in (kibana_yml.content | b64decode)"
            fail_msg: |
              kibana.yml is missing PEM cert/key paths, or accidentally rendered
              a keystore.path entry (wrong cert format detection), or dropped
              the elasticsearch.ssl.verificationMode: none line from extra_config.
              Got:
              {{ kibana_yml.content | b64decode }}

        # An open socket on 5601 doesn't prove the cert chains to our test CA.
        # Confirm the served cert is signed by "Test CA" — the role's
        # auto-generated fallback would have a different issuer.
        - name: TLS handshake against Kibana 5601 (signed by Test CA)
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              out=$(echo | openssl s_client \
                -connect localhost:5601 \
                -CAfile /tmp/test-certs/ca.crt \
                -servername {{ ansible_facts.hostname }} 2>&1) || true
              echo "$out" | grep -E 'Verify return code|verify error|issuer=' || true
              echo "$out" | grep -q 'Verify return code: 0 (ok)'
            executable: /bin/bash
          register: _kb_tls_probe
          changed_when: false
