---
argument_specs:
  main:
    short_description: Install, configure, and manage Elastic Agent
    description: Handles package installation, standalone policy deployment, Fleet enrollment, self-managed Fleet Server setup,
      TLS certificate distribution, migration from Beats, and systemd service management.
    options:
      elastic_agent_manage:
        description: Install and configure Elastic Agent. Leave false when the role is included only for shared playbook composition
        type: bool
        default: false
      elastic_agent_enable:
        description: Enable and start the Elastic Agent systemd service
        type: bool
        default: true
      elastic_agent_mode:
        description: Operating mode. Use standalone for a local policy, fleet to enroll in an existing Fleet Server, or fleet_server
          to run Fleet Server on this host
        type: str
        default: standalone
        choices:
        - standalone
        - fleet
        - fleet_server
      elastic_agent_package_flavor:
        description: Elastic Agent package flavor. On 9.x use servers for Fleet Server; 8.x packages use basic because Fleet
          Server is included in the regular package
        type: str
        default: basic
        choices:
        - basic
        - servers
      elastic_agent_config_backup:
        description: Create a backup before replacing the standalone Elastic Agent policy
        type: bool
        default: false
      elastic_agent_migrate_from_beats:
        description: Stop and disable Filebeat, Metricbeat, and Auditbeat services before starting Elastic Agent
        type: bool
        default: false
      elastic_agent_binary_path:
        description: Path to the Elastic Agent command installed by the package
        type: str
        default: /usr/bin/elastic-agent
      elastic_agent_config_dir:
        description: Directory containing the package-managed Elastic Agent configuration
        type: str
        default: /etc/elastic-agent
      elastic_agent_config_file:
        description: Path to the standalone Elastic Agent policy file
        type: str
        default: '{{ elastic_agent_config_dir }}/elastic-agent.yml'
      elastic_agent_package_flavor_file:
        description: Optional path to the 9.x package-managed Elastic Agent flavor marker used to detect basic and servers transitions;
          leave empty to resolve the marker at the package top directory from the active package binary; 8.x packages do not use a flavor marker
        type: str
        default: ''
      elastic_agent_certificate_dir:
        description: Directory where Fleet Server CA, certificate, and private key files are stored
        type: str
        default: '{{ elastic_agent_config_dir }}/certs'
      elastic_agent_enrollment_state_file:
        description: Path to the enrollment fingerprint file that records the desired Fleet command without storing credentials
        type: str
        default: '{{ elastic_agent_config_dir }}/.enrollment.sha256'
      elastic_agent_standalone_config:
        description: Complete standalone elastic-agent.yml policy. It must contain a default output and at least one input;
          values may include credentials and should come from Ansible Vault or a secrets manager
        type: dict
        default: {}
        no_log: true
      elastic_agent_fleet_server_url:
        description: Fleet Server URL used for agent enrollment, for example https://fleet.example.test:8220
        type: str
        default: ''
      elastic_agent_enrollment_token:
        description: Fleet enrollment token for the agent policy. Keep it in Ansible Vault or a secrets manager
        type: str
        default: ''
        no_log: true
      elastic_agent_fleet_server_insecure:
        description: Disable TLS certificate verification when connecting to Fleet Server. Use only for temporary development
          deployments
        type: bool
        default: false
      elastic_agent_fleet_server_ca_source:
        description: Source for the CA used to verify Fleet Server. Use none for a publicly trusted CA, elasticsearch_ca to
          reuse the collection CA, or external for a supplied CA file/content
        type: str
        default: none
        choices:
        - none
        - elasticsearch_ca
        - external
      elastic_agent_fleet_server_ca_file:
        description: Path to an external Fleet Server CA certificate on the controller or managed host
        type: str
        default: ''
      elastic_agent_fleet_server_ca_content:
        description: Inline PEM content for the external Fleet Server CA certificate
        type: str
        default: ''
        no_log: true
      elastic_agent_fleet_server_ca_remote_src:
        description: Read the external Fleet Server CA from the managed host instead of the Ansible controller
        type: bool
        default: false
      elastic_agent_fleet_server_es:
        description: Elasticsearch URL used by a self-managed Fleet Server
        type: str
        default: ''
      elastic_agent_fleet_server_service_token:
        description: Elasticsearch service token used by a self-managed Fleet Server. Keep it in Ansible Vault or a secrets
          manager
        type: str
        default: ''
        no_log: true
      elastic_agent_fleet_server_service_token_file:
        description: Root-owned file used to pass the Fleet Server Elasticsearch service token without placing it in process
          arguments
        type: str
        default: '{{ elastic_agent_config_dir }}/.fleet-server-service-token'
      elastic_agent_fleet_server_policy:
        description: Fleet Server agent policy ID used by a self-managed Fleet Server
        type: str
        default: ''
      elastic_agent_fleet_server_host:
        description: Fleet Server bind or advertised host passed to the Elastic Agent Fleet Server process
        type: str
        default: ''
      elastic_agent_fleet_server_port:
        description: Fleet Server HTTP port
        type: int
        default: 8220
      elastic_agent_fleet_server_cert_file:
        description: Path to the Fleet Server certificate on the controller or managed host
        type: str
        default: ''
      elastic_agent_fleet_server_cert_content:
        description: Inline PEM content for the Fleet Server certificate
        type: str
        default: ''
        no_log: true
      elastic_agent_fleet_server_cert_key_file:
        description: Path to the Fleet Server private key on the controller or managed host
        type: str
        default: ''
      elastic_agent_fleet_server_cert_key_content:
        description: Inline PEM content for the Fleet Server private key
        type: str
        default: ''
        no_log: true
      elastic_agent_fleet_server_cert_remote_src:
        description: Read Fleet Server certificate and key files from the managed host instead of the Ansible controller
        type: bool
        default: false
      elastic_agent_fleet_server_es_ca_file:
        description: Path to the CA used by Fleet Server to verify Elasticsearch on the controller or managed host
        type: str
        default: ''
      elastic_agent_fleet_server_es_ca_content:
        description: Inline PEM content for the Elasticsearch CA used by Fleet Server
        type: str
        default: ''
        no_log: true
      elastic_agent_fleet_server_es_ca_remote_src:
        description: Read the Fleet Server Elasticsearch CA from the managed host instead of the Ansible controller
        type: bool
        default: false
