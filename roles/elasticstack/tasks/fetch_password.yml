---
# Fetch a user password from the Elasticsearch initial passwords file.
# Delegates to elasticstack_ca_host.
#
# Required variables:
#   _password_user: Username to match (e.g. "elastic", "kibana_system")
#   _password_fact: Fact name to set (e.g. "elasticstack_password")
#
# The result is a command register dict — use {{ fact_name.stdout }} downstream.

- name: fetch_password | Fetch password - {{ _password_user }}
  ansible.builtin.command:
    argv:
      - awk
      - -v
      - "user={{ _password_user }}"
      - '$1 == "PASSWORD" && $2 == user { print $4; exit }'
      - "{{ elasticstack_initial_passwords }}"
  register: elasticstack_fetched_password_result
  changed_when: false
  check_mode: false
  failed_when: >-
    elasticstack_fetched_password_result.rc != 0 or
    elasticstack_fetched_password_result.stdout | trim | length == 0
  no_log: "{{ elasticstack_no_log }}"
  delegate_to: "{{ elasticstack_ca_host }}"

- name: fetch_password | Register password fact - {{ _password_fact }}
  ansible.builtin.set_fact:
    "{{ _password_fact }}": "{{ elasticstack_fetched_password_result }}"
  no_log: "{{ elasticstack_no_log }}"
