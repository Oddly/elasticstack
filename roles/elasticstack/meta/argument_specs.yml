---
argument_specs:
  main:
    short_description: Shared defaults and CA management for the oddly.elasticstack collection
    description: Provides collection-wide variables (inventory group names, ports, CA host, certificate settings) and the
      internal certificate authority workflow used by the elasticsearch, kibana, logstash, and beats roles.
    options:
      elasticstack_elasticsearch_group_name:
        description: Ansible inventory group name containing Elasticsearch hosts
        type: str
        default: elasticsearch
      elasticstack_logstash_group_name:
        description: Ansible inventory group name containing Logstash hosts
        type: str
        default: logstash
      elasticstack_kibana_group_name:
        description: Ansible inventory group name containing Kibana hosts
        type: str
        default: kibana
      elasticstack_beats_port:
        description: Port used for Beats-to-Logstash communication
        type: int
        default: 5044
      elasticstack_elasticsearch_http_port:
        description: Elasticsearch HTTP API port
        type: int
        default: 9200
      elasticstack_kibana_port:
        description: Kibana web interface port
        type: int
        default: 5601
      elasticstack_ca_host:
        description: Host that runs the Elasticsearch certificate authority. Defaults to the first host in the elasticsearch
          group
        type: str
        default: '{{ (groups[elasticstack_elasticsearch_group_name] | default([inventory_hostname]))[0] }}'
      elasticstack_ca_dir:
        description: Directory where the CA certificate and key are stored
        type: str
        default: /opt/es-ca
      elasticstack_ca_expiration_buffer:
        description: Days before CA certificate expiry to trigger renewal
        type: int
        default: 30
      elasticstack_ca_name:
        description: Subject name for the generated CA certificate
        type: str
        default: CN=Elastic Certificate Tool Autogenerated CA
      elasticstack_ca_pass:
        description: Passphrase for the CA private key
        type: str
        default: PleaseChangeMe
      elasticstack_cert_pass:
        description: Common passphrase applied to all role TLS private keys when set. Overrides elasticsearch_tls_key_passphrase,
          kibana_tls_key_passphrase, logstash_tls_key_passphrase, and beats_tls_key_passphrase. Leave empty to use the per-role
          passphrases.
        type: raw
      elasticstack_ca_validity_period:
        description: Validity period in days for the CA certificate
        type: int
        default: 1095
      elasticstack_enable_repos:
        description: Let the repos role manage Elastic APT/YUM repositories
        type: bool
        default: true
      elasticstack_full_stack:
        description: Running a full Elastic Stack deployment. Enables auto-discovery of hosts from inventory groups and cross-role
          TLS setup
        type: bool
        default: true
      elasticstack_initial_passwords:
        description: Path to the file containing initial Elasticsearch passwords generated during security setup
        type: str
        default: /usr/share/elasticsearch/initial_passwords
      elasticstack_override_beats_tls:
        description: Force Beats to use TLS certificates from the Elasticsearch CA instead of its own
        type: bool
        default: false
      elasticstack_release:
        description: Major version of the Elastic Stack to install (8 or 9)
        type: int
        default: 8
      elasticstack_repo_base_url:
        description: Base URL for Elastic package repositories. Override to use a local mirror or cache
        type: str
        default: '{{ lookup(''env'', ''ELASTICSTACK_REPO_BASE_URL'') | default(''https://artifacts.elastic.co'', true) }}'
      elasticstack_repo_key:
        description: URL to the GPG key used to verify Elastic packages
        type: str
        default: '{{ elasticstack_repo_base_url }}/GPG-KEY-elasticsearch'
      elasticstack_rpm_workaround:
        description: Apply workaround for RPM package installation issues on certain RHEL versions
        type: bool
        default: false
      elasticstack_security:
        description: Enable security features across the entire stack (TLS, authentication, RBAC)
        type: bool
        default: true
      elasticstack_no_log:
        description: Suppress sensitive output in Ansible logs. Set to false for debugging
        type: bool
        default: true
      elasticstack_ca_will_expire_soon:
        description: Force renewal of the CA certificate on the next run. Normally flipped to true automatically by the cert_check_expiry
          task when the certificate is within `elasticstack_ca_expiration_buffer` days of expiry; set to true from a playbook
          to force renewal regardless of buffer.
        type: bool
        default: false
