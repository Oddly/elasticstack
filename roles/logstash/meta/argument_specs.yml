---
argument_specs:
  main:
    short_description: Install, configure, and manage Logstash
    description: Handles package install, pipeline configuration, TLS certificate management for input/output, JVM tuning,
      and systemd service management.
    options:
      logstash_heap:
        description: JVM heap size for Logstash (e.g. '1g', '512m'). When set, the heap values in jvm.options are updated;
          when empty, the package default (usually 1g) is left in place.
        type: str
        default: ''
      logstash_enable:
        description: Whether to enable and start the Logstash service
        type: bool
        default: true
      logstash_config_backup:
        description: Create a backup of logstash.yml before overwriting
        type: bool
        default: false
      logstash_manage_yaml:
        description: Let the role manage logstash.yml. Set to false to manage it yourself
        type: bool
        default: true
      logstash_manage_logging:
        description: Let the role manage log4j2.properties for Logstash logging
        type: bool
        default: false
      logstash_config_autoreload:
        description: Automatically reload pipeline configuration when files change
        type: bool
        default: true
      logstash_config_path_data:
        description: Filesystem path for Logstash persistent data (queue, dead letter queue)
        type: str
        default: /var/lib/logstash
      logstash_config_path_logs:
        description: Filesystem path for Logstash log files
        type: str
        default: /var/log/logstash
      logstash_pipeline_buffer_type:
        description: Pipeline buffer type ('direct' or 'heap'). Logstash 9.x changed the default from 'direct' to 'heap'.
          This is set version-aware to prevent silent behaviour changes during 8.x to 9.x upgrades.
        type: str
        default: '{{ ''heap'' if (elasticstack_release | int >= 9) else ''direct'' }}'
      logstash_manage_pipelines:
        description: Let the role manage pipelines.yml and pipeline config files
        type: bool
        default: true
      logstash_no_pipelines:
        description: Remove all pipeline configuration. Useful when Logstash is managed externally
        type: bool
        default: false
      logstash_queue_type:
        description: Queue type for pipeline buffering. Use 'persisted' for disk-backed queues that survive restarts
        type: str
        default: persisted
      logstash_queue_max_bytes:
        description: Maximum size of the persisted queue before Logstash applies backpressure
        type: str
        default: 1gb
      logstash_input_beats:
        description: Enable the Beats input plugin (receives from Filebeat, Metricbeat, etc.)
        type: bool
        default: true
      logstash_input_beats_port:
        description: Port for the Beats input listener
        type: int
        default: 5044
      logstash_input_beats_ssl:
        description: Enable TLS on the Beats input. Inherits from logstash_beats_tls for backwards compatibility
        type: str
        default: '{{ logstash_beats_tls | default(omit) }}'
      logstash_input_elastic_agent:
        description: Enable the Elastic Agent input plugin
        type: bool
        default: false
      logstash_input_elastic_agent_port:
        description: Port for the Elastic Agent input listener
        type: int
        default: 5044
      logstash_input_elastic_agent_ssl:
        description: Enable TLS on the Elastic Agent input
        type: bool
        default: true
      logstash_extra_inputs:
        description: Raw Logstash input config appended to the input section of the pipeline
        type: str
        default: ''
      logstash_filters:
        description: Raw Logstash filter config inserted into the filter section of the pipeline
        type: str
        default: ''
      logstash_filter_files:
        description: List of filter config files to copy to the Logstash pipeline directory
        type: list
        default: []
      logstash_output_elasticsearch:
        description: Enable the Elasticsearch output plugin
        type: bool
        default: true
      logstash_elasticsearch_hosts:
        description: List of Elasticsearch hosts. Leave empty to auto-discover from inventory
        type: list
        default: []
      logstash_elasticsearch_index:
        description: Index name pattern. Leave empty for the default (logstash-%{+YYYY.MM.dd})
        type: str
        default: ''
      logstash_validate_after_inactivity:
        description: Seconds before re-validating an idle Elasticsearch connection
        type: int
        default: 300
      logstash_sniffing:
        description: Enable Elasticsearch node sniffing to discover all cluster members
        type: bool
        default: false
      logstash_extra_outputs:
        description: Raw Logstash output config appended to the output section of the pipeline
        type: str
        default: ''
      logstash_custom_pipeline:
        description: Complete pipeline config that replaces all input/filter/output settings above
        type: str
        default: ''
      logstash_ident:
        description: Add a mutate filter that stamps each event with the Logstash instance hostname
        type: bool
        default: true
      logstash_ident_field_name:
        description: Field name for the Logstash instance identifier stamp
        type: str
        default: '[logstash][instance]'
      logstash_pipeline_identifier:
        description: Add a mutate filter that stamps each event with the pipeline name
        type: bool
        default: true
      logstash_pipeline_identifier_field_name:
        description: Field name for the pipeline identifier stamp
        type: str
        default: '[logstash][pipeline]'
      logstash_create_role:
        description: Create an Elasticsearch role for Logstash to write indices
        type: bool
        default: true
      logstash_role_name:
        description: Name of the Elasticsearch role created for Logstash
        type: str
        default: logstash_writer
      logstash_role_cluster_privileges:
        description: Cluster-level privileges granted to the Logstash writer role
        type: list
        default:
        - manage_index_templates
        - monitor
        - manage_ilm
      logstash_role_indicies_names:
        description: Index patterns the Logstash writer role is allowed to write to
        type: list
        default:
        - ecs-logstash*
        - logstash*
        - logs*
      logstash_role_indicies_privileges:
        description: Index-level privileges granted to the Logstash writer role
        type: list
        default:
        - write
        - create
        - delete
        - create_index
        - manage
        - manage_ilm
      logstash_create_user:
        description: Create an Elasticsearch user for Logstash
        type: bool
        default: true
      logstash_user_name:
        description: Username for the Logstash Elasticsearch user
        type: str
        default: logstash_writer
      logstash_user_password:
        description: Password for the Logstash Elasticsearch user. Change this in production
        type: str
        default: password
      logstash_user_email:
        description: Email address for the Logstash Elasticsearch user
        type: str
        default: ''
      logstash_user_fullname:
        description: Full name for the Logstash Elasticsearch user
        type: str
        default: Internal Logstash User
      logstash_cert_source:
        description: Where to get TLS certificates. 'elasticsearch_ca' fetches from ES CA, 'standalone' generates its own,
          'external' uses provided files
        type: str
        default: elasticsearch_ca
      logstash_tls_copy_certs:
        description: "Copy externally-managed certificate files into `logstash_certs_dir` (default). Set to `false` to reference\
          \ the `logstash_tls_*_file` paths directly from the pipeline config \u2014 Logstash reads them in place. Use this\
          \ for certmonger, cert-manager, or any renewal system where the cert files update out-of-band and you don't want\
          \ to re-run Ansible to pick up rotations. Logstash must have read access to the files (typically `root:logstash\
          \ 0640` and a world-traversable parent directory)."
        type: bool
        default: true
      logstash_certs_dir:
        description: Directory on the Logstash host where TLS certificates are stored
        type: str
        default: /etc/logstash/certs
      logstash_cert_validity_period:
        description: Validity period in days for generated TLS certificates
        type: int
        default: 1095
      logstash_cert_expiration_buffer:
        description: Days before certificate expiry to trigger renewal
        type: int
        default: 30
      logstash_cert_force_regenerate:
        description: Force TLS certificate regeneration even if current certificates are valid
        type: bool
        default: false
      logstash_tls_key_passphrase:
        description: Passphrase for the Logstash TLS private key
        type: str
        default: LogstashChangeMe
      logstash_xpack_management:
        description: Enable centralized pipeline management via Elasticsearch
        type: bool
        default: false
      logstash_extra_config:
        description: 'Dictionary of additional logstash.yml settings not covered by dedicated variables. Keys are written
          as-is into logstash.yml. Nested values are rendered as YAML. @var logstash_extra_config:example: > logstash_extra_config:
          queue.checkpoint.writes: 1024 xpack.management.elasticsearch.sniffing: true xpack.management.logstash.poll_interval:
          5s'
        type: dict
        default: {}
      logstash_logging_console:
        description: Enable Logstash console (stdout) logging
        type: bool
        default: true
      logstash_logging_file:
        description: Enable Logstash file-based logging
        type: bool
        default: true
      logstash_logging_slow_console:
        description: Enable slow log output to console
        type: bool
        default: true
      logstash_logging_slow_file:
        description: Enable slow log output to file
        type: bool
        default: true
      logstash_plugins:
        description: List of Logstash plugins to install
        type: list
        default: []
      logstash_pipeline_unsafe_shutdown:
        description: Allow Logstash to shut down even if there are inflight events in the pipeline
        type: bool
        default: false
      logstash_skip_root_check:
        description: Skip the Logstash 9.x root user upgrade warning check
        type: bool
        default: false
      logstash_cert_will_expire_soon:
        description: Force renewal of the Logstash client certificate on the next run. Normally flipped to true automatically
          by the cert_check_expiry task when the certificate is within `logstash_cert_expiration_buffer` days of expiry; set
          to true from a playbook to force renewal regardless of buffer.
        type: bool
        default: false
