---
- name: logstash-password-validation | Validate Logstash Elasticsearch password
  ansible.builtin.assert:
    that:
      - logstash_user_password | default('', true) | string | trim | length > 0
      - logstash_user_password | default('', true) | string | length >= 6
    fail_msg: >-
      Set logstash_user_password to a nonempty secret of at least 6 characters
      when Logstash creates its Elasticsearch user or uses the secured standard
      Elasticsearch output. Store it in Ansible Vault or retrieve it from a
      secret manager. Set logstash_create_user: false when the user is managed
      externally, but still provide the password for the secured standard output.
  when:
    - >-
      (logstash_create_user | bool and
       ((elasticstack_full_stack | default(false) | bool and _logstash_security | bool) or
        logstash_cert_source | default('elasticsearch_ca') == 'standalone')) or
      (_logstash_security | bool and logstash_output_elasticsearch | default(true) | bool)
  tags:
    - preflight
