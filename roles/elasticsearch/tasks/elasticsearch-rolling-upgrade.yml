# Rolling Upgrade of Elasticsearch
#
# Follows the official Elastic upgrade procedure:
#   https://www.elastic.co/docs/deploy-manage/upgrade/deployment-or-cluster/elasticsearch
#
# Recommended inventory ordering for multi-tier clusters:
#   frozen → cold → warm → hot → other data → ingest/coordinating → master
# The play must use serial: 1 so nodes upgrade one at a time.

---
- name: elasticsearch-rolling-upgrade | Require a secured serial upgrade
  ansible.builtin.assert:
    that:
      - elasticsearch_security | bool
      - not (elasticstack_full_stack | bool) or elasticstack_security | bool
      - ansible_play_batch | intersect(groups[elasticstack_elasticsearch_group_name] | default([])) | length == 1
    fail_msg: Rolling upgrades require security and one Elasticsearch host per play batch.

- name: elasticsearch-rolling-upgrade | Validate the existing installation
  ansible.builtin.include_tasks: elasticsearch-upgrade-preflight.yml

- name: elasticsearch-rolling-upgrade | Read allocation settings
  ansible.builtin.uri:
    url: "{{ _elasticsearch_upgrade_api_url }}/_cluster/settings?flat_settings=true"
    method: GET
    user: elastic
    password: "{{ elasticstack_password.stdout }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
    timeout: 20
  register: _elasticsearch_upgrade_settings
  changed_when: false
  check_mode: false
  no_log: "{{ elasticstack_no_log }}"

- name: elasticsearch-rolling-upgrade | Read ML upgrade mode
  ansible.builtin.uri:
    url: "{{ _elasticsearch_upgrade_api_url }}/_ml/info?filter_path=upgrade_mode"
    method: GET
    user: elastic
    password: "{{ elasticstack_password.stdout }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
    timeout: 20
  register: _elasticsearch_upgrade_ml_info
  changed_when: false
  check_mode: false
  no_log: "{{ elasticstack_no_log }}"
  when: elasticsearch_ml_enabled | bool

- name: elasticsearch-rolling-upgrade | Validate recorded cluster settings
  ansible.builtin.assert:
    that:
      - (_elasticsearch_upgrade_settings.json | default({})).persistent is mapping
      - >-
        ((_elasticsearch_upgrade_settings.json.transient | default({})).get('cluster.routing.allocation.enable', none)) is none
      - >-
        not (elasticsearch_ml_enabled | bool)
        or ((_elasticsearch_upgrade_ml_info.json | default({})).upgrade_mode | default(none)) is boolean
    fail_msg: >-
      The current allocation or ML upgrade-mode settings could not be recorded,
      or a transient allocation override prevents safe temporary configuration.

- name: elasticsearch-rolling-upgrade | Record original cluster settings
  ansible.builtin.set_fact:
    _elasticsearch_upgrade_previous_allocation: >-
      {{ _elasticsearch_upgrade_settings.json.persistent.get('cluster.routing.allocation.enable', none) }}
    _elasticsearch_upgrade_allocation_attempted: false
    _elasticsearch_upgrade_ml_attempted: false
    _elasticsearch_upgrade_failed_task: ""

- name: elasticsearch-rolling-upgrade | Upgrade one Elasticsearch node
  when: not ansible_check_mode
  block:
    - name: elasticsearch-rolling-upgrade | Record allocation change attempt
      ansible.builtin.set_fact:
        _elasticsearch_upgrade_allocation_attempted: true

    - name: elasticsearch-rolling-upgrade | Disable replica allocation
      ansible.builtin.uri:
        url: "{{ _elasticsearch_upgrade_api_url }}/_cluster/settings"
        method: PUT
        body:
          persistent:
            cluster.routing.allocation.enable: primaries
        body_format: json
        user: elastic
        password: "{{ elasticstack_password.stdout }}"
        force_basic_auth: true
        validate_certs: "{{ elasticsearch_validate_api_certs }}"
        timeout: 20
      register: _elasticsearch_upgrade_allocation
      failed_when: >-
        (_elasticsearch_upgrade_allocation.status | default(0)) != 200
        or not ((_elasticsearch_upgrade_allocation.json | default({})).acknowledged | default(false) | bool)
      no_log: "{{ elasticstack_no_log }}"

    - name: elasticsearch-rolling-upgrade | Record ML upgrade-mode change attempt
      ansible.builtin.set_fact:
        _elasticsearch_upgrade_ml_attempted: true
      when:
        - elasticsearch_ml_enabled | bool
        - not ((_elasticsearch_upgrade_ml_info.json | default({})).upgrade_mode | default(false) | bool)

    - name: elasticsearch-rolling-upgrade | Enable ML upgrade mode
      ansible.builtin.uri:
        url: "{{ _elasticsearch_upgrade_api_url }}/_ml/set_upgrade_mode?enabled=true"
        method: POST
        user: elastic
        password: "{{ elasticstack_password.stdout }}"
        force_basic_auth: true
        validate_certs: "{{ elasticsearch_validate_api_certs }}"
        timeout: 20
      register: _elasticsearch_upgrade_ml
      failed_when: >-
        (_elasticsearch_upgrade_ml.status | default(0)) != 200
        or not ((_elasticsearch_upgrade_ml.json | default({})).acknowledged | default(false) | bool)
      no_log: "{{ elasticstack_no_log }}"
      when: _elasticsearch_upgrade_ml_attempted | bool

    - name: elasticsearch-rolling-upgrade | Flush indices to speed up shard recovery
      ansible.builtin.uri:
        url: "{{ _elasticsearch_upgrade_api_url }}/_flush"
        method: POST
        user: elastic
        password: "{{ elasticstack_password.stdout }}"
        force_basic_auth: true
        validate_certs: "{{ elasticsearch_validate_api_certs }}"
        timeout: 20
        status_code: [200, 409, 503]
      register: _elasticsearch_upgrade_flush
      failed_when: >-
        (_elasticsearch_upgrade_flush.status | default(0)) not in [-1, 200, 409, 503]
      changed_when: false
      no_log: "{{ elasticstack_no_log }}"

    - name: elasticsearch-rolling-upgrade | Warn when optional flush did not complete
      ansible.builtin.debug:
        msg: >-
          Flush did not complete successfully; proceeding without this optional
          optimization (HTTP {{ _elasticsearch_upgrade_flush.status | default(0) }}).
      when: >-
        (_elasticsearch_upgrade_flush.status | default(0)) != 200
        or (((_elasticsearch_upgrade_flush.json | default({}))._shards | default({})).failed | default(0) | int) > 0

    - name: elasticsearch-rolling-upgrade | Recheck the cluster before stopping this node
      ansible.builtin.include_tasks: elasticsearch-upgrade-preflight.yml

    - name: elasticsearch-rolling-upgrade | Stop Elasticsearch
      ansible.builtin.service:
        name: elasticsearch
        enabled: true
        state: stopped
      when: not elasticsearch_unsafe_upgrade_restart | bool

    - name: elasticsearch-rolling-upgrade | Update Elasticsearch
      ansible.builtin.package:
        name: "{{ elasticsearch_package }}"
        state: "{{ 'latest' if (elasticstack_version | default('')) in ['', 'latest'] else 'present' }}"
        enablerepo: "{{ ['elastic-' ~ elasticstack_release ~ '.x'] if ansible_facts.os_family == 'RedHat' else omit }}"

    - name: elasticsearch-rolling-upgrade | Start Elasticsearch
      ansible.builtin.service:
        name: elasticsearch
        enabled: true
        state: "{{ 'restarted' if elasticsearch_unsafe_upgrade_restart | bool else 'started' }}"

    - name: elasticsearch-rolling-upgrade | Wait for the Elasticsearch service
      ansible.builtin.systemd:
        name: elasticsearch
      register: _elasticsearch_upgrade_started
      until: (_elasticsearch_upgrade_started.status | default({})).ActiveState | default('') == 'active'
      retries: "{{ elasticsearch_upgrade_health_retries | int }}"
      delay: "{{ elasticsearch_upgrade_health_delay | int }}"

    - name: elasticsearch-rolling-upgrade | Wait for this node to rejoin the cluster
      ansible.builtin.uri:
        url: "{{ _elasticsearch_upgrade_api_url }}/_cat/nodes?h=name"
        method: GET
        user: elastic
        password: "{{ elasticstack_password.stdout }}"
        force_basic_auth: true
        validate_certs: "{{ elasticsearch_validate_api_certs }}"
        timeout: 20
        return_content: true
      register: _elasticsearch_upgrade_rejoined
      until: >-
        (_elasticsearch_upgrade_rejoined.status | default(0)) == 200
        and elasticsearch_nodename | default(ansible_facts.hostname | default(inventory_hostname))
           in (_elasticsearch_upgrade_rejoined.content | default('')).split()
      retries: "{{ elasticsearch_upgrade_health_retries | int }}"
      delay: "{{ elasticsearch_upgrade_health_delay | int }}"
      changed_when: false
      no_log: "{{ elasticstack_no_log }}"

    - name: elasticsearch-rolling-upgrade | Read this node's running version
      ansible.builtin.uri:
        url: "{{ _elasticsearch_upgrade_api_url }}/_nodes/{{ elasticsearch_nodename | default(ansible_facts.hostname | default(inventory_hostname)) | urlencode }}?filter_path=nodes.*.name,nodes.*.version"
        method: GET
        user: elastic
        password: "{{ elasticstack_password.stdout }}"
        force_basic_auth: true
        validate_certs: "{{ elasticsearch_validate_api_certs }}"
        timeout: 20
      register: _elasticsearch_upgrade_node_info
      changed_when: false
      no_log: "{{ elasticstack_no_log }}"

    - name: elasticsearch-rolling-upgrade | Require the requested node version
      ansible.builtin.assert:
        that:
          - _elasticsearch_upgrade_node_values | length == 1
          - >-
            (_elasticsearch_upgrade_node_values | first | default({})).name | default('')
            == elasticsearch_nodename | default(ansible_facts.hostname | default(inventory_hostname))
          - >-
            ((_elasticsearch_upgrade_node_values | first | default({})).version | default('')).split('.')[0] | int
            == elasticstack_release | int
          - >-
            elasticstack_version | default('') | string in ['', 'latest']
            or (_elasticsearch_upgrade_node_values | first | default({})).version | default('') == elasticstack_version
        fail_msg: The restarted node is not running the requested Elasticsearch version.
      vars:
        _elasticsearch_upgrade_node_values: "{{ (_elasticsearch_upgrade_node_info.json.nodes | default({})).values() | list }}"

  rescue:
    - name: elasticsearch-rolling-upgrade | Record the original failed task
      ansible.builtin.set_fact:
        _elasticsearch_upgrade_failed_task: "{{ ansible_failed_task.name }}"

  always:
    - name: elasticsearch-rolling-upgrade | Restore temporary cluster settings
      ansible.builtin.include_tasks: elasticsearch-upgrade-restore.yml

- name: elasticsearch-rolling-upgrade | Propagate the original upgrade failure
  ansible.builtin.assert:
    that:
      - _elasticsearch_upgrade_failed_task | length == 0
    fail_msg: >-
      Elasticsearch upgrade failed at '{{ _elasticsearch_upgrade_failed_task }}'.
      Temporary settings were restored, but the upgrade did not succeed.

- name: elasticsearch-rolling-upgrade | Verify the cluster after the upgrade
  ansible.builtin.include_tasks: elasticsearch-upgrade-preflight.yml
  when: not ansible_check_mode

- name: elasticsearch-rolling-upgrade | Record completed rolling restart
  ansible.builtin.set_fact:
    _elasticsearch_rolling_upgrade_performed: true
  when: not ansible_check_mode
