---
# Entry point: restore cluster state after node maintenance. Counterpart of
# node_maintenance_start; attempts each restore step before validating its
# result and final state. Can run from an always block after failed maintenance.
#
# Optional: set elasticsearch_maintenance_wait_for_node to a node name to wait
# for that node to rejoin the cluster before the health gate.

- name: node_maintenance_end | Validate credentials
  ansible.builtin.assert:
    that:
      - elasticsearch_maintenance_password is defined
      - elasticsearch_maintenance_password | length > 0
    fail_msg: elasticsearch_maintenance_password must be set to the elastic user password.
    quiet: true

- name: node_maintenance_end | Resolve API URL
  ansible.builtin.set_fact:
    _elasticsearch_maintenance_url: >-
      {{ elasticsearch_maintenance_api_url
         if elasticsearch_maintenance_api_url is defined
         else elasticsearch_http_protocol ~ '://' ~ elasticsearch_api_host
              ~ ':' ~ (elasticstack_elasticsearch_http_port | default(9200)) }}

- name: node_maintenance_end | Wait for cluster API
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_cluster/health"
    method: GET
    status_code: [200, 503]
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
  register: _elasticsearch_maintenance_api
  until: (_elasticsearch_maintenance_api.status | default(0)) == 200
  retries: 12
  delay: 10
  changed_when: false
  failed_when: false
  ignore_errors: true
  ignore_unreachable: true
  any_errors_fatal: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"

- name: node_maintenance_end | Re-enable shard allocation
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_cluster/settings"
    method: PUT
    body: '{ "persistent": { "cluster.routing.allocation.enable": null } }'
    body_format: json
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
  register: _elasticsearch_maintenance_alloc
  until: (_elasticsearch_maintenance_alloc.json | default({})).acknowledged | default(false)
  retries: 10
  delay: 30
  failed_when: false
  ignore_errors: true
  ignore_unreachable: true
  any_errors_fatal: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"

- name: node_maintenance_end | Clear voting config exclusions
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_cluster/voting_config_exclusions?wait_for_removal=false"
    method: DELETE
    status_code: [200]
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
  register: _elasticsearch_maintenance_voting
  failed_when: false
  ignore_errors: true
  ignore_unreachable: true
  any_errors_fatal: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"

- name: node_maintenance_end | Compute the declared recovery baseline
  ansible.builtin.set_fact:
    _elasticsearch_maintenance_baseline: >-
      {{ dict(_elasticsearch_maintenance_drain_keys
              | zip([None] * (_elasticsearch_maintenance_drain_keys | length)))
         | combine(elasticsearch_cluster_settings | default({}) | dict2items
                   | selectattr('key', 'in', _elasticsearch_maintenance_drain_keys) | items2dict) }}
  vars:
    _elasticsearch_maintenance_drain_keys: "{{ elasticsearch_drain_cluster_settings | list }}"

- name: node_maintenance_end | Restore recovery settings to the baseline
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_cluster/settings"
    method: PUT
    body: "{{ {'persistent': _elasticsearch_maintenance_baseline} | to_json }}"
    body_format: json
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
  register: _elasticsearch_maintenance_restore
  until: (_elasticsearch_maintenance_restore.json | default({})).acknowledged | default(false)
  retries: 5
  delay: 10
  failed_when: false
  ignore_errors: true
  ignore_unreachable: true
  any_errors_fatal: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"
  when: elasticsearch_drain_cluster_settings | length > 0

- name: node_maintenance_end | Restore owned ML state through the shared lifecycle
  ansible.builtin.include_tasks: ml_upgrade_end.yml
  vars:
    elasticsearch_maintenance_api_url: "{{ _elasticsearch_maintenance_url }}"
    elasticsearch_ml_upgrade_state_host: "{{ inventory_hostname }}"
  when: elasticsearch_maintenance_manage_ml | default(true) | bool

- name: node_maintenance_end | Read restored cluster settings
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_cluster/settings?flat_settings=true"
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
    timeout: 20
  register: _elasticsearch_maintenance_settings_readback
  changed_when: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"

- name: node_maintenance_end | Read remaining voting exclusions and cluster identity
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_cluster/state/metadata?filter_path=cluster_name,metadata.cluster_coordination.voting_config_exclusions"
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
    timeout: 20
  register: _elasticsearch_maintenance_voting_readback
  changed_when: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"

- name: node_maintenance_end | Require acknowledged cleanup and restored cluster state
  ansible.builtin.assert:
    that:
      - (_elasticsearch_maintenance_alloc.json | default({})).acknowledged | default(false) | bool
      - (_elasticsearch_maintenance_voting.status | default(0)) == 200
      - _elasticsearch_maintenance_voting_readback.json.cluster_name == elasticsearch_clustername
      - _elasticsearch_maintenance_voting_readback.json.metadata.cluster_coordination.voting_config_exclusions == []
      - _elasticsearch_maintenance_settings_readback.json.persistent.get('cluster.routing.allocation.enable', 'all') == 'all'
      - >-
        _elasticsearch_maintenance_settings_readback.json.transient.get('cluster.routing.allocation.enable',
          _elasticsearch_maintenance_settings_readback.json.persistent.get('cluster.routing.allocation.enable', 'all')) == 'all'
      - >-
        not (elasticsearch_drain_cluster_settings | length > 0)
        or ((_elasticsearch_maintenance_restore.json | default({})).acknowledged | default(false) | bool)
    fail_msg: Cleanup was not acknowledged or its final state is not restored; do not continue to the next node.
  when: not ansible_check_mode

- name: node_maintenance_end | Require the declared recovery baseline without transient overrides
  ansible.builtin.assert:
    that:
      - _elasticsearch_maintenance_settings_readback.json.persistent.get(item.key, none) | string == item.value | string
      - _elasticsearch_maintenance_settings_readback.json.transient.get(item.key, item.value) | string == item.value | string
  loop: "{{ _elasticsearch_maintenance_baseline | dict2items }}"
  when: not ansible_check_mode

- name: node_maintenance_end | Read final ML mode, including defensive cleanup without recorded ownership
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_ml/info?filter_path=upgrade_mode"
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
    timeout: 20
  register: _elasticsearch_maintenance_ml_readback
  changed_when: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"
  when:
    - elasticsearch_ml_enabled | bool
    - elasticsearch_maintenance_manage_ml | default(true) | bool

- name: node_maintenance_end | Require the original ML mode or a safe unpaused state without ownership
  ansible.builtin.assert:
    that:
      - >-
        _elasticsearch_maintenance_ml_readback.json.upgrade_mode
        is sameas ((_elasticsearch_ml_upgrade_state | default({})).get('previous', false) | bool)
    fail_msg: ML mode is not restored, or ownership is unknown; inspect this cluster before proceeding.
  when:
    - not ansible_check_mode
    - elasticsearch_ml_enabled | bool
    - elasticsearch_maintenance_manage_ml | default(true) | bool

- name: node_maintenance_end | Confirm the node rejoined the cluster
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_cat/nodes?h=name"
    method: GET
    return_content: true
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
  register: _elasticsearch_maintenance_nodes
  until: elasticsearch_maintenance_wait_for_node in (_elasticsearch_maintenance_nodes.content | default('')).split()
  retries: 60
  delay: 10
  changed_when: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"
  when: elasticsearch_maintenance_wait_for_node | default('') | length > 0

- name: node_maintenance_end | Wait for cluster health
  ansible.builtin.uri:
    url: "{{ _elasticsearch_maintenance_url }}/_cluster/health"
    method: GET
    user: elastic
    password: "{{ elasticsearch_maintenance_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_api_certs }}"
  register: _elasticsearch_maintenance_health
  until: >-
    ((_elasticsearch_maintenance_health.json | default({})).status | default(''))
    in (['green'] if elasticsearch_maintenance_wait_status == 'green' else ['green', 'yellow'])
  retries: "{{ elasticsearch_maintenance_health_retries }}"
  delay: "{{ elasticsearch_maintenance_health_delay }}"
  changed_when: false
  failed_when: false
  no_log: "{{ elasticstack_no_log | default(true) | bool }}"
  when: elasticsearch_maintenance_wait_health | bool

# Hard stop for serialised maintenance loops: with any_errors_fatal in the
# calling play this keeps the next node untouched on an unhealthy cluster.
- name: node_maintenance_end | Require a workable cluster before continuing
  ansible.builtin.assert:
    that:
      - _elasticsearch_maintenance_status in ['green', 'yellow']
      - >-
        not (elasticsearch_maintenance_require_green | bool)
        or _elasticsearch_maintenance_status == 'green'
    fail_msg: >-
      Cluster status is '{{ _elasticsearch_maintenance_status }}' after maintenance;
      not proceeding to the next node.
    quiet: true
  vars:
    _elasticsearch_maintenance_status: >-
      {{ (_elasticsearch_maintenance_health.json | default({})).status | default('unreachable') }}
  when:
    - not ansible_check_mode
    - elasticsearch_maintenance_wait_health | bool
