---
- name: Check if kibana is installed
  ansible.builtin.package_facts:
    manager: "auto"
  delegate_to: "{{ item }}"
  changed_when: false

- name: Restart and wait for Kibana
  when: "'kibana' in hostvars[item].ansible_facts.packages | default({})"
  block:
    - name: Restart Kibana service
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/../elasticstack/tasks/restart_and_verify_service.yml"
        apply:
          delegate_to: "{{ item }}"
      vars:
        _service_name: kibana

    - name: Wait for Kibana HTTP readiness after restart
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/../elasticstack/tasks/wait_for_http_service.yml"
        apply:
          delegate_to: "{{ item }}"
      vars:
        _wait_service_name: kibana
        _wait_url: >-
          {{ ('https://' ~ (hostvars[item].elasticstack_kibana_host | default(hostvars[item].ansible_facts.hostname))
              if hostvars[item].kibana_tls | default(false) | bool
              else 'http://localhost') }}:{{ hostvars[item].elasticstack_kibana_port | default(5601) }}/api/status
        _wait_fatal_pattern: "FATAL|Unable to connect to Elasticsearch|Authentication.*failed|Kibana server is not ready.*fatal"
        _wait_validate_certs: "{{ hostvars[item].kibana_tls_validate_certs | default(true) | bool }}"
        _wait_ca_file: >-
          {{ (hostvars[item].kibana_certs_dir | default('/etc/kibana/certs', true)) ~ '/ca.crt'
             if hostvars[item].kibana_tls | default(false) | bool and
                (hostvars[item].kibana_cert_source | default('elasticsearch_ca') == 'elasticsearch_ca' or
                 hostvars[item].kibana_tls_ca_file | default('', true) | length > 0 or
                 hostvars[item].kibana_tls_ca_content | default('', true) | length > 0 or
                 hostvars[item]._kibana_ca_extracted | default(false) | bool)
             else '' }}
        _wait_resolve: >-
          {{ (hostvars[item].elasticstack_kibana_host | default(hostvars[item].ansible_facts.hostname)) ~ ':' ~
             (hostvars[item].elasticstack_kibana_port | default(5601) | string) ~ ':127.0.0.1'
             if hostvars[item].kibana_tls | default(false) | bool else '' }}

  rescue:
    - name: Get recent Kibana journal output
      ansible.builtin.command:
        cmd: journalctl -u kibana --no-pager -n 50
      register: _elasticsearch_kibana_handler_journal
      delegate_to: "{{ item }}"
      changed_when: false

    - name: Fail with Kibana startup diagnostics
      ansible.builtin.fail:
        msg: |
          Kibana failed to start after restart by elasticsearch handler.

          Recent log output:
          {{ _elasticsearch_kibana_handler_journal.stdout }}
