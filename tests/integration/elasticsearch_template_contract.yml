---  # noqa: run-once[play]
- name: Elasticsearch template contract - single node
  hosts: single_es
  gather_facts: false
  vars:
    ansible_managed: "Ansible managed"
    elasticstack_elasticsearch_group_name: single_es
    elasticsearch_datapath: /var/lib/elasticsearch
    elasticsearch_logpath: /var/log/elasticsearch
    elasticsearch_clustername: template-single
    elasticsearch_cluster_set_up: false
    elasticsearch_ml_enabled: false
    elasticsearch_security: false
    elasticsearch_memory_lock: false
    elasticsearch_extra_config:
      cluster.name: should-be-filtered
      thread_pool.write.queue_size: 500
  tasks:
    - name: Include Elasticsearch role vars
      ansible.builtin.include_vars: ../../roles/elasticsearch/vars/main.yml

    - name: Resolve Elasticsearch template values
      ansible.builtin.include_tasks: ../../roles/elasticsearch/tasks/elasticsearch-template-values.yml

    - name: Render single-node elasticsearch.yml
      ansible.builtin.template:
        src: ../../roles/elasticsearch/templates/elasticsearch.yml.j2
        dest: /tmp/elasticsearch-template-single.yml
        mode: "0644"

    - name: Read single-node elasticsearch.yml
      ansible.builtin.slurp:
        src: /tmp/elasticsearch-template-single.yml
      register: _single_template

    - name: Assert single-node template contract
      ansible.builtin.assert:
        that:
          - "'cluster.name: \"template-single\"' in (_single_template.content | b64decode)"
          - "'discovery.type: single-node' in (_single_template.content | b64decode)"
          - "'xpack.security.enabled: false' in (_single_template.content | b64decode)"
          - "'cluster.name: should-be-filtered' not in (_single_template.content | b64decode)"
          - "'thread_pool.write.queue_size: 500' in (_single_template.content | b64decode)"

- name: Elasticsearch template contract - multi node external certs
  hosts: elasticsearch
  gather_facts: false
  vars:
    ansible_managed: "Ansible managed"
    elasticstack_elasticsearch_group_name: elasticsearch
    elasticstack_elasticsearch_http_port: 9200
    elasticstack_temperature: warm
    elasticsearch_datapath: /var/lib/elasticsearch
    elasticsearch_logpath: /var/log/elasticsearch
    elasticsearch_clustername: template-multi
    elasticsearch_cluster_set_up: false
    elasticsearch_network_host:
      - 10.10.10.10
      - _site_
    elasticsearch_http_publish_host: 10.10.10.20
    elasticsearch_http_publish_port: 19200
    elasticsearch_transport_port: 19300
    elasticsearch_node_types:
      - master
      - data
      - ingest
    elasticsearch_ml_enabled: true
    elasticsearch_security: true
    elasticsearch_http_security: true
    elasticsearch_security_enrollment: false
    elasticsearch_ssl_verification_mode: certificate
    elasticsearch_cert_source: external
    elasticsearch_certs_dir: /etc/elasticsearch/template-certs
    _elasticsearch_transport_cert_format: pem
    _elasticsearch_http_cert_format: pem
    _elasticsearch_external_has_ca: true
    elasticsearch_memory_lock: true
    elasticsearch_fs_repo:
      - /mnt/snapshots
  tasks:
    - name: Include Elasticsearch role vars
      ansible.builtin.include_vars: ../../roles/elasticsearch/vars/main.yml

    - name: Resolve Elasticsearch template values
      ansible.builtin.include_tasks: ../../roles/elasticsearch/tasks/elasticsearch-template-values.yml

    - name: Render multi-node elasticsearch.yml
      ansible.builtin.template:
        src: ../../roles/elasticsearch/templates/elasticsearch.yml.j2
        dest: "/tmp/elasticsearch-template-{{ inventory_hostname }}.yml"
        mode: "0644"

    - name: Read multi-node elasticsearch.yml
      ansible.builtin.slurp:
        src: "/tmp/elasticsearch-template-{{ inventory_hostname }}.yml"
      register: _multi_template

    - name: Assert multi-node template contract
      ansible.builtin.assert:
        that:
          - "'cluster.name: \"template-multi\"' in (_multi_template.content | b64decode)"
          - "'discovery.type: single-node' not in (_multi_template.content | b64decode)"
          - "'network.host: [\"10.10.10.10\", \"_site_\"]' in (_multi_template.content | b64decode)"
          - "'http.port: \"9200\"' in (_multi_template.content | b64decode)"
          - "'transport.port: \"19300\"' in (_multi_template.content | b64decode)"
          - "'http.publish_host: \"10.10.10.20\"' in (_multi_template.content | b64decode)"
          - "'http.publish_port: 19200' in (_multi_template.content | b64decode)"
          - "'node.roles: [\"master\", \"data\", \"ingest\"]' in (_multi_template.content | b64decode)"
          - "'discovery.seed_hosts: [\"10.10.10.1\", \"10.10.10.2\"]' in (_multi_template.content | b64decode)"
          - "'node.attr.temp: \"warm\"' in (_multi_template.content | b64decode)"
          - "'10.10.10.1' in (_multi_template.content | b64decode)"
          - "'10.10.10.2' in (_multi_template.content | b64decode)"
          - "'es-node-1' in (_multi_template.content | b64decode)"
          - "'es-node-2' in (_multi_template.content | b64decode)"
          - "'xpack.security.transport.ssl.certificate: \"/etc/elasticsearch/template-certs/' ~ inventory_hostname ~ '-transport.crt\"' in (_multi_template.content | b64decode)"
          - "'xpack.security.http.ssl.certificate: \"/etc/elasticsearch/template-certs/' ~ inventory_hostname ~ '-http.crt\"' in (_multi_template.content | b64decode)"
          - "'xpack.security.transport.ssl.certificate_authorities: [\"/etc/elasticsearch/template-certs/ca.crt\"]' in (_multi_template.content | b64decode)"
          - "'bootstrap.memory_lock: true' in (_multi_template.content | b64decode)"
          - "'/mnt/snapshots' in (_multi_template.content | b64decode)"

    - name: Render post-bootstrap elasticsearch.yml
      ansible.builtin.template:
        src: ../../roles/elasticsearch/templates/elasticsearch.yml.j2
        dest: "/tmp/elasticsearch-template-{{ inventory_hostname }}-post-bootstrap.yml"
        mode: "0644"
      vars:
        elasticsearch_cluster_set_up: true

    - name: Read post-bootstrap elasticsearch.yml
      ansible.builtin.slurp:
        src: "/tmp/elasticsearch-template-{{ inventory_hostname }}-post-bootstrap.yml"
      register: _post_bootstrap_template

    - name: Assert bootstrap-only setting is removed after cluster setup
      ansible.builtin.assert:
        that:
          - "'cluster.initial_master_nodes:' not in (_post_bootstrap_template.content | b64decode)"

- name: Elasticsearch quorum contract - even bootstrap count is rejected
  hosts: elasticsearch
  gather_facts: false
  strategy: free
  vars:
    elasticsearch_node_types:
      - master
      - data
    elasticsearch_cluster_set_up: false
    elasticsearch_check_calculation: false
  tasks:
    # Delay one host so the old group_by-based count would be evaluated before
    # the peer joined the dynamic group. The actual count must be identical on
    # both hosts even with the free strategy.
    - name: Stagger one quorum host
      ansible.builtin.command:
        argv:
          - sleep
          - "1"
      changed_when: false
      when: inventory_hostname == groups['elasticsearch'][1]

    - name: Run quorum guard
      block:
        - name: Include the role's quorum guard
          ansible.builtin.include_tasks: ../../roles/elasticsearch/tasks/elasticsearch-node-role-check.yml
      rescue:
        - name: Record expected quorum failure
          ansible.builtin.set_fact:
            _quorum_guard_failed: true

    - name: Assert the even quorum was rejected consistently
      ansible.builtin.assert:
        that:
          - _quorum_guard_failed | default(false) | bool
          - elasticsearch_count_of_master_nodes | int == 2
