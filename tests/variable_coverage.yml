---
# Optional variables must be assigned by an executable contract or Molecule
# scenario. Variables with runtime defaults are covered by the role's baseline
# scenario; feature-specific non-default branches have their own scenarios.
baselines:
  beats:
    - molecule/beats_default/converge.yml
  elasticsearch:
    - molecule/elasticsearch_default/converge.yml
  elasticstack:
    - molecule/elasticstack_common_passphrase/converge.yml
    - molecule/elasticstack_default/converge.yml
  kibana:
    - molecule/kibana_default/converge.yml
  logstash:
    - molecule/logstash_default/converge.yml

explicit:
  beats:
    beats_filebeat_output_file_path:
      - tests/integration/collection_variable_contract.yml
  elasticsearch:
    elasticsearch_security_enrollment:
      - tests/integration/collection_variable_contract.yml
    elasticsearch_network_host:
      - tests/integration/collection_variable_contract.yml
    elasticsearch_http_publish_host:
      - tests/integration/collection_variable_contract.yml
    elasticsearch_http_publish_port:
      - tests/integration/collection_variable_contract.yml
    elasticsearch_transport_port:
      - tests/integration/collection_variable_contract.yml
    elasticsearch_nodename:
      - tests/integration/collection_variable_contract.yml
    elasticsearch_node_types:
      - tests/integration/collection_variable_contract.yml
    elasticsearch_seed_hosts:
      - tests/integration/collection_variable_contract.yml
    elasticsearch_cluster_set_up:
      - tests/integration/collection_variable_contract.yml
  elasticstack:
    elasticstack_version:
      - tests/integration/collection_variable_contract.yml
    elasticstack_kibana_host:
      - tests/integration/collection_variable_contract.yml
    elasticstack_temperature:
      - tests/integration/collection_variable_contract.yml
  kibana:
    kibana_elasticsearch_hosts:
      - tests/integration/collection_variable_contract.yml
    kibana_server_protocol:
      - tests/integration/collection_variable_contract.yml
    kibana_sniff_interval:
      - tests/integration/collection_variable_contract.yml
  logstash:
    logstash_security:
      - tests/integration/collection_variable_contract.yml
    logstash_input_beats:
      - tests/integration/collection_variable_contract.yml
    logstash_input_beats_ssl:
      - tests/integration/collection_variable_contract.yml
    logstash_config_autoreload_interval:
      - tests/integration/collection_variable_contract.yml
    logstash_http_host:
      - tests/integration/collection_variable_contract.yml
    logstash_http_port:
      - tests/integration/collection_variable_contract.yml
    logstash_input_beats_client_auth:
      - tests/integration/collection_variable_contract.yml
    logstash_input_beats_timeout:
      - tests/integration/collection_variable_contract.yml
    logstash_beats_tls:
      - tests/integration/collection_variable_contract.yml
    logstash_beats_input:
      - tests/integration/collection_variable_contract.yml
    logstash_sniffing_delay:
      - tests/integration/collection_variable_contract.yml
    logstash_sniffing_path:
      - tests/integration/collection_variable_contract.yml
    logstash_output_elasticsearch:
      - tests/integration/collection_variable_contract.yml
    logstash_elasticsearch_output:
      - tests/integration/collection_variable_contract.yml
    logstash_tls_certificate_file:
      - molecule/logstash_external_certs/converge.yml
    logstash_tls_key_file:
      - molecule/logstash_external_certs/converge.yml
    logstash_tls_ca_file:
      - molecule/logstash_external_certs/converge.yml
    logstash_tls_remote_src:
      - molecule/logstash_external_certs/converge.yml
    logstash_dead_letter_queue_enable:
      - tests/integration/collection_variable_contract.yml
    logstash_dead_letter_queue_retain_age:
      - tests/integration/collection_variable_contract.yml
    logstash_log_format:
      - tests/integration/collection_variable_contract.yml
    logstash_global_ecs:
      - tests/integration/collection_variable_contract.yml
    logstash_monitoring_enabled:
      - tests/integration/collection_variable_contract.yml
    logstash_xpack_management_elasticsearch_username:
      - tests/integration/collection_variable_contract.yml
    logstash_xpack_management_elasticsearch_password:
      - tests/integration/collection_variable_contract.yml
    logstash_xpack_management_elasticsearch_hosts:
      - tests/integration/collection_variable_contract.yml
    logstash_xpack_management_pipeline_id:
      - tests/integration/collection_variable_contract.yml

# Defaulted variables that change how multiple roles interact need a rollout
# of the behavior they control. They are kept separate from `explicit` because
# their normal default path is already covered by a baseline scenario.
behaviors:
  - name: beats_external_certificates
    role: beats
    variables:
      - beats_cert_source
      - beats_tls_certificate_file
      - beats_tls_key_file
      - beats_tls_ca_file
      - beats_tls_certificate_content
      - beats_tls_key_content
      - beats_tls_ca_content
      - beats_tls_remote_src
    scenario: beats_external_certs
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.beats
    expected:
      - "_beats_cert_stat.results | selectattr('stat.exists') | list | length == 3"
      - "_beats_cert_hashes.stdout_lines | select('match', '^(\\\\S+) \\\\1$') | list | length == 3"
  - name: elasticsearch_external_certificate_files
    role: elasticsearch
    variables:
      - elasticsearch_cert_source
      - elasticsearch_transport_tls_certificate
      - elasticsearch_transport_tls_key
      - elasticsearch_http_tls_certificate
      - elasticsearch_http_tls_key
      - elasticsearch_tls_ca_certificate
      - elasticsearch_tls_remote_src
      - elasticsearch_ssl_verification_mode
    scenario: elasticsearch_custom_certs
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "'CN = Test CA' in es_http_cert_issuer.stdout or 'CN=Test CA' in es_http_cert_issuer.stdout"
      - "'transport.ssl.certificate_authorities' in _es_config"
  - name: elasticsearch_external_certificate_content
    role: elasticsearch
    variables:
      - elasticsearch_cert_source
      - elasticsearch_transport_tls_certificate_content
      - elasticsearch_transport_tls_key_content
      - elasticsearch_http_tls_certificate_content
      - elasticsearch_http_tls_key_content
      - elasticsearch_tls_ca_certificate_content
      - elasticsearch_ssl_verification_mode
    scenario: elasticsearch_cert_content
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "(_cert_hashes.stdout_lines | length) == 3"
      - "p12_files.files | length == 0"
      - "'xpack.security.transport.ssl.verification_mode: certificate' in (_es_yml.content | b64decode)"
  - name: elasticsearch_external_certificate_fallback
    role: elasticsearch
    variables:
      - elasticsearch_cert_source
      - elasticsearch_transport_tls_certificate
      - elasticsearch_tls_remote_src
      - elasticsearch_ssl_verification_mode
    scenario: elasticsearch_custom_certs_minimal
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "transport_key_stat.stat.exists"
      - "http_cert_stat.stat.exists"
      - "'count=1 ' in _ca_extract.stdout"
  - name: kibana_external_certificate_files
    role: kibana
    variables:
      - kibana_cert_source
      - kibana_tls
      - kibana_tls_certificate_file
      - kibana_tls_key_file
      - kibana_tls_remote_src
      - kibana_extra_config
    scenario: kibana_custom_certs
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.kibana
    expected:
      - "'certificateAuthorities' not in (kibana_yml.content | b64decode)"
      - "'server.ssl.enabled: true' in (kibana_yml.content | b64decode)"
      - "'server.ssl.certificate:' in (kibana_yml.content | b64decode)"
  - name: kibana_external_certificate_content
    role: kibana
    variables:
      - kibana_cert_source
      - kibana_tls
      - kibana_tls_certificate_file
      - kibana_tls_key_file
      - kibana_tls_ca_file
      - kibana_tls_certificate_content
      - kibana_tls_key_content
      - kibana_tls_ca_content
      - kibana_tls_remote_src
      - kibana_security
    scenario: kibana_cert_content
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.kibana
    expected:
      - "_kibana_cert_stat.results | selectattr('stat.exists') | list | length == 3"
      - "_kibana_cert_hashes.stdout_lines | select('match', '^(\\\\S+) \\\\1$') | list | length == 3"
      - "'server.ssl.keystore.path' not in (_kibana_yml.content | b64decode)"
  - name: logstash_external_certificate_files
    role: logstash
    variables:
      - logstash_cert_source
      - logstash_tls_certificate_file
      - logstash_tls_key_file
      - logstash_tls_ca_file
      - logstash_tls_remote_src
      - logstash_input_beats
      - logstash_input_beats_ssl
      - logstash_input_beats_port
      - logstash_input_beats_client_auth
      - logstash_input_beats_timeout
    scenario: logstash_external_certs
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.logstash
    expected:
      - "server_cert.stat.exists"
      - "ca_cert.stat.exists"
      - "_server_key_header.stdout == '-----BEGIN PRIVATE KEY-----'"
      - "'port => 5044' in (input_content.content | b64decode)"
  - name: logstash_standalone_certificates
    role: logstash
    variables:
      - logstash_cert_source
      - logstash_tls_key_passphrase
      - logstash_input_beats
      - logstash_input_beats_ssl
    scenario: logstash_standalone_certs
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.logstash
    expected:
      - "item.stat.exists"
      - "item.stat.mode == \"0640\""
      - "_pfx_bad_check.rc != 0"
  - name: logstash_security_user_and_role
    role: logstash
    variables:
      - logstash_create_role
      - logstash_role_name
      - logstash_role_cluster_privileges
      - logstash_role_indicies_names
      - logstash_role_indicies_privileges
      - logstash_create_user
      - logstash_user_name
      - logstash_user_password
      - logstash_user_email
      - logstash_user_fullname
    scenario: logstash_elasticsearch
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.logstash
    expected:
      - "_logstash_role_response.json[logstash_role_name].cluster == ['monitor', 'manage_ilm']"
      - "_logstash_role_response.json[logstash_role_name].indices[0].names == ['molecule-logs-*']"
      - "_logstash_user_response.json[logstash_user_name].email == 'molecule@example.test'"
      - "_logstash_user_response.json[logstash_user_name].full_name == 'Molecule Logstash Writer'"
  - name: elasticsearch_node_maintenance_lifecycle
    role: elasticsearch
    variables:
      - elasticsearch_api_host
      - elasticsearch_http_protocol
      - elasticsearch_validate_api_certs
      - elasticsearch_ml_enabled
      - elasticsearch_nodename
      - elasticsearch_maintenance_wait_status
      - elasticsearch_maintenance_health_retries
      - elasticsearch_maintenance_health_delay
      - elasticsearch_maintenance_wait_health
      - elasticsearch_maintenance_require_green
      - elasticsearch_drain_cluster_settings
      - elasticsearch_cluster_settings
    contract: tests/integration/node_maintenance_contract.yml
    roles:
      - oddly.elasticstack.elasticsearch
    expected:
      - "_log.stdout is search('voting_config_exclusions.*node_names=esA')"
      - "_log.stdout is search('200mb.*\"method\": \"PUT\".*/_cluster/settings')"
      - "_log.stdout is not search('_ml/set_upgrade_mode')"
  - name: elasticsearch_security_management_lifecycle
    role: elasticsearch
    variables:
      - elasticsearch_api_host
      - elasticsearch_security
      - elasticsearch_http_security
      - elasticsearch_validate_api_certs
      - elasticsearch_security_roles
      - elasticsearch_users
      - elasticsearch_builtin_passwords
      - elasticsearch_role_mappings
    contract: tests/integration/elasticsearch_security_management_contract.yml
    roles:
      - ../../roles/elasticsearch/tasks/elasticsearch-security-management.yml
    expected:
      - "_fake_security_api_log_result.stdout is search('path.*_security/role/app_writer')"
      - "_fake_security_api_idempotence_log.stdout is not search('method.*PUT')"
      - "_fake_security_api_rotation_log.stdout is search('password_set.*true')"
      - "_fake_security_api_multi_host_log.stdout is not search('\\\"method\\\": \\\"PUT\\\"')"
  - name: elasticsearch_rolling_restart_lifecycle
    role: elasticsearch
    variables:
      - elasticsearch_security
      - elasticsearch_http_protocol
      - elasticsearch_validate_api_certs
      - elasticsearch_config_restart_strategy
      - elasticsearch_config_restart_flush
      - elasticsearch_config_restart_wait_status
      - elasticsearch_config_restart_health_retries
      - elasticsearch_config_restart_health_delay
      - elasticsearch_config_restart_node_retries
      - elasticsearch_config_restart_node_delay
    contract: tests/integration/rolling_restart_contract.yml
    roles:
      - ../../roles/elasticsearch/tasks/restart_and_verify_elasticsearch_rolling.yml
    expected:
      - "_fake_api_log.stdout is search('\"path\": \"/_flush\", \"port\": 19200')"
      - "_fake_api_log.stdout is not search('\"path\": \"/_flush\"')"
      - "ansible_failed_result.msg is search('elastic user password is unavailable')"
  - name: shared_certificate_passphrase
    role: elasticstack
    variables:
      - elasticstack_cert_pass
      - elasticstack_elasticsearch_group_name
      - elasticstack_kibana_group_name
    scenario: elasticstack_common_passphrase
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.kibana
    expected:
      - "_http_keystore_pass.stdout == _expected_passphrase"
      - "_transport_keystore_pass.stdout == _expected_passphrase"
  - name: beats_peculiar_inputs
    role: beats
    variables:
      - beats_filebeat_mysql_slowlog_input
    scenario: beats_peculiar
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.beats
    expected:
      - "'id: mysql-slowlog' in (filebeat_yml.content | b64decode)"
      - "'/var/log/mysql/*-slow.log' in (filebeat_yml.content | b64decode)"
  - name: beats_disabled_services
    role: beats
    variables:
      - beats_metricbeat_enable
      - beats_auditbeat_enable
    scenario: beats_advanced
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.beats
    expected:
      - "ansible_facts.services.get('metricbeat.service', {}).get('state', 'stopped') != 'running'"
      - "ansible_facts.services.get('auditbeat.service', {}).get('state', 'stopped') != 'running'"
  - name: beats_security_runtime
    role: beats
    variables:
      - beats_security
      - beats_filebeat_elastic_monitoring
      - beats_ca_dir
      - beats_tls_cacert
      - beats_tls_cert
      - beats_tls_key
      - beats_tls_key_passphrase
      - beats_ssl_verification_mode
      - beats_filebeat_syslog_tcp_ssl
    scenario: beats_security
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.beats
    expected:
      - "'certificate_authorities' in (filebeat_yml.content | b64decode)"
      - "'output.elasticsearch' in (filebeat_yml.content | b64decode)"
      - "'ssl.verification_mode: full' in (filebeat_yml.content | b64decode)"
      - "'ssl.key_passphrase: BeatsSecurityPassword!' in (filebeat_yml.content | b64decode)"
      - "filebeat_config.monitoring.enabled | bool"
      - "(_filebeat_search.json.hits.total.value | default(0) | int) > 0"
  - name: beats_standalone_target_and_loadbalance
    role: beats
    variables:
      - beats_target_hosts
      - beats_filebeat_loadbalance
    scenario: beats_default
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.beats
    expected:
      - "'localhost:5044' in (filebeat_yml.content | b64decode | from_yaml)['output.logstash']['hosts']"
      - "((filebeat_yml.content | b64decode | from_yaml)['output.logstash']['loadbalance'] | bool) == false"
  - name: beats_certificate_renewal
    role: beats
    variables:
      - beats_tls_key_passphrase
      - beats_cert_validity_period
      - beats_cert_expiration_buffer
      - beats_cert_will_expire_soon
    scenario: cert_renewal
    assertions_file: molecule/cert_renewal/converge.yml
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.beats
    expected:
      - "_beats_cert_fp_before.stdout != _beats_cert_fp_after.stdout"
  - name: beats_full_stack_modules
    role: beats
    variables:
      - beats_filebeat_modules
    scenario: elasticstack_default
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.logstash
      - oddly.elasticstack.kibana
      - oddly.elasticstack.beats
    expected:
      - "_fb_system_module.stat.exists"
  - name: elasticsearch_roles_calculation
    role: elasticsearch
    variables:
      - elasticsearch_check_calculation
      - elasticsearch_node_types
    scenario: elasticsearch_roles_calculation
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "'elasticsearch.service' not in ansible_facts.services"
  - name: elasticsearch_security_api_runtime
    role: elasticsearch
    variables:
      - elasticsearch_elastic_password
      - elasticsearch_security_roles
      - elasticsearch_users
      - elasticsearch_role_mappings
    scenario: elasticsearch_security_api
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "role_create.json.role.created | default(false)"
      - "user_create.json.created | default(false)"
      - "managed_role.json['molecule-managed-role'].metadata.owner == 'molecule'"
      - "managed_user.json['molecule-managed-user'].full_name == 'Molecule managed user'"
      - "managed_mapping.json['molecule-managed-mapping'].roles == ['molecule-managed-role']"
  - name: elasticsearch_keystore_runtime
    role: elasticsearch
    variables:
      - elasticsearch_keystore_entries
    scenario: es_kibana
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.kibana
    expected:
      - "'xpack.notification.slack.account.test.secure_url' in keystore_list.stdout_lines"
      - "keystore_value.stdout == \"https://hooks.example.com/test\""
  - name: elasticstack_full_stack_runtime
    role: elasticstack
    variables:
      - elasticstack_full_stack
      - elasticstack_release
      - elasticstack_no_log
      - elasticstack_rpm_workaround
    scenario: elasticstack_default
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.logstash
      - oddly.elasticstack.kibana
      - oddly.elasticstack.beats
    expected:
      - "kibana_status.json.status.overall.level == 'available'"
      - "(_ls_es_count.json.count | default(0) | int) > 0"
      - "'testbed' in (filebeat_yml.content | b64decode)"
  - name: elasticstack_security_mode
    role: elasticstack
    variables:
      - elasticstack_security
    scenario: elasticsearch_no-security
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "'xpack.security.enabled: false' in (_es_config.content | b64decode)"
  - name: elasticstack_upgrade_runtime
    role: elasticstack
    variables:
      - elasticstack_initial_passwords
      - elasticstack_elasticsearch_http_port
      - elasticstack_version
      - elasticstack_release
    scenario: elasticsearch_upgrade_8to9_single
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "es_info.json.version.number is version('9.0.0', '>='"
      - "test_doc.json._source.message == \"pre-upgrade-test-data\""
  - name: elasticstack_certificate_renewal
    role: elasticstack
    variables:
      - elasticstack_ca_will_expire_soon
    scenario: cert_renewal
    assertions_file: molecule/cert_renewal/converge.yml
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.logstash
      - oddly.elasticstack.kibana
    expected:
      - "_es_cert_fp_before.stdout != _es_cert_fp_after.stdout"
  - name: elasticsearch_upgrade_health_budget
    role: elasticsearch
    variables:
      - elasticsearch_upgrade_health_retries
      - elasticsearch_upgrade_health_delay
    scenario: elasticsearch_upgrade_8to9
    assignment_file: molecule/elasticsearch_upgrade_8to9/molecule.yml
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "elasticsearch_upgrade_health_retries | int == 20"
      - "elasticsearch_upgrade_health_delay | int == 15"
  - name: elasticsearch_certificate_renewal
    role: elasticsearch
    variables:
      - elasticsearch_tls_key_passphrase
      - elasticsearch_cert_will_expire_soon
    scenario: cert_renewal
    assertions_file: molecule/cert_renewal/converge.yml
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
    expected:
      - "_es_cert_fp_before.stdout != _es_cert_fp_after.stdout"
  - name: kibana_custom_runtime
    role: kibana
    variables:
      - kibana_config_backup
      - kibana_public_base_url
      - kibana_security_encryptionkey
      - kibana_encryptedsavedobjects_encryptionkey
      - kibana_sniff_on_start
      - kibana_extra_config
    scenario: kibana_custom
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.kibana
    expected:
      - "kibana_status.json.status.overall.level == 'available'"
      - "'server.publicBaseUrl: \"https://kibana.example.com\"' in (kibana_yml.content | b64decode)"
      - "provided_keys.results[0].stdout_lines[-1] == 'moleculeProvidedSecurityKey0123456789abcd'"
      - "backups.files | length > 0"
  - name: kibana_security_password_runtime
    role: kibana
    variables:
      - kibana_system_password
    scenario: es_kibana
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.kibana
    expected:
      - "kibana_auth.json.username == 'kibana_system'"
  - name: kibana_certificate_renewal
    role: kibana
    variables:
      - kibana_tls_key_passphrase
      - kibana_cert_will_expire_soon
    scenario: cert_renewal
    assertions_file: molecule/cert_renewal/converge.yml
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.kibana
    expected:
      - "_kb_cert_fp_before.stdout != _kb_cert_fp_after.stdout"
  - name: logstash_elastic_agent_runtime
    role: logstash
    variables:
      - logstash_input_elastic_agent
      - logstash_input_elastic_agent_port
      - logstash_input_elastic_agent_ssl
    scenario: logstash_ssl
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.logstash
    expected:
      - "'elastic_agent {' in (input_content.content | b64decode)"
      - "'port => 5044' in (input_content.content | b64decode)"
      - "'ssl_enabled => true' in (input_content.content | b64decode)"
  - name: logstash_custom_pipeline_runtime
    role: logstash
    variables:
      - logstash_custom_pipeline
    scenario: logstash_custom_pipeline
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.logstash
    expected:
      - "pipeline_conf.stat.exists"
      - "'processed_by' in output_content.content | b64decode"
  - name: logstash_sniffing_runtime
    role: logstash
    variables:
      - logstash_sniffing
    scenario: logstash_elasticsearch
    roles:
      - oddly.elasticstack.repos
      - oddly.elasticstack.elasticsearch
      - oddly.elasticstack.logstash
    expected:
      - "'sniffing => true' in (logstash_output_content.content | b64decode)"
  - name: logstash_certificate_renewal
    role: logstash
    variables:
