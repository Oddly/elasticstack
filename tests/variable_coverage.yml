    logstash_monitoring_enabled:
      scenario: logstash_centralized_pipelines
      expected:
        - "monitoring.enabled: false"
    logstash_xpack_management_elasticsearch_username:
      scenario: logstash_centralized_pipelines
      expected:
        - "logstash_internal"
    logstash_xpack_management_elasticsearch_password:
      scenario: logstash_centralized_pipelines
