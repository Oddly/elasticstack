---
name: Test Elasticsearch Upgrade 8→9
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  pull_request:
    types: [labeled]
    paths:
      - 'roles/elasticsearch/**'
      - 'roles/elasticstack/**'
      - 'molecule/elasticsearch_upgrade*/**'
      - 'molecule/shared/**'
      - '.github/workflows/test_elasticsearch_upgrade.yml'
  schedule:
    - cron: "0 2 * * *"  # Daily at 02:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.label.name != 'ci:run' && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  lint_elasticsearch:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:run' }}
    uses: ./.github/workflows/test_linting.yml
    with:
      rolename: elasticsearch
    secrets: inherit

  upgrade_multi_node:
    needs: lint_elasticsearch
    runs-on: self-hosted
    timeout-minutes: 180

    env:
      COLLECTION_NAMESPACE: oddly
      COLLECTION_NAME: elasticstack
      ANSIBLE_PIPELINING: 'true'
      ANSIBLE_GATHERING: smart
      ANSIBLE_ANY_ERRORS_FATAL: 'true'
      ANSIBLE_DISPLAY_SKIPPED_HOSTS: 'false'
      ANSIBLE_TRANSFER_METHOD: sftp
      ANSIBLE_SSH_RETRIES: '5'
      ANSIBLE_HOST_KEY_CHECKING: 'false'
      ANSIBLE_INJECT_FACTS_AS_VARS: 'false'
      ANSIBLE_TIMEOUT: '60'
      ANSIBLE_FORKS: '10'
      ANSIBLE_SSH_ARGS: >-
        -o ControlMaster=auto
        -o ControlPersist=60s
        -o PreferredAuthentications=publickey

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        distro:
          - debian13
          - rockylinux9
        scenario:
          - elasticsearch_upgrade_8to9

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          uv venv "$RUNNER_TEMP/venv" --python "$(command -v python3.12)"
          source "$RUNNER_TEMP/venv/bin/activate"
          uv pip install -r requirements-test.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

      - name: Verify Ansible executable
        run: |
          command -v ansible-playbook
          ansible-playbook --version | grep -Eq 'core 2\.20\.'

      - name: Set up collections path
        run: |
          {
            echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/collections"
            echo "MOLECULE_EPHEMERAL_DIRECTORY=$RUNNER_TEMP/molecule"
            echo "ANSIBLE_SSH_CONTROL_PATH_DIR=$RUNNER_TEMP/ssh-cp"
            echo "MOLECULE_RUN_SUFFIX=-${GITHUB_RUN_ID: -6}"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ssh-cp"

      - name: Install collection
        env:
          CACHE_HOST: ${{ secrets.INCUS_HOST }}
        run: |
          collection_path="$ANSIBLE_COLLECTIONS_PATH/ansible_collections/$COLLECTION_NAMESPACE/$COLLECTION_NAME"
          mkdir -p "$(dirname "$collection_path")"
          cp -a "$GITHUB_WORKSPACE" "$collection_path"
          if [ -n "$CACHE_HOST" ]; then
            ansible-galaxy collection install \
              "http://${CACHE_HOST}:8082/collections/community-general-12.3.0.tar.gz" \
              "http://${CACHE_HOST}:8082/collections/community-crypto-3.1.1.tar.gz" \
              "http://${CACHE_HOST}:8082/collections/ansible-posix-2.1.0.tar.gz"
          else
            ansible-galaxy collection install \
              community.general:12.3.0 \
              community.crypto:3.1.1 \
              ansible.posix:2.1.0
          fi

      - name: Set up SSH key for molecule
        run: |
          echo "${{ secrets.MOLECULE_SSH_PRIVATE_KEY }}" > ${{ runner.temp }}/molecule_id_ed25519
          chmod 600 ${{ runner.temp }}/molecule_id_ed25519
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 ${{ secrets.INCUS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Compute gate deadline
        id: gate
        run: echo "deadline=$((120 * 60))" >> "$GITHUB_OUTPUT"

      - name: Acquire memory slot
        # Single-authority admission gate: MemTotal − reserve − committed
        # limits.memory − pending reservations, FIFO with bounded
        # overtakes. The 120-minute deadline leaves a 60-minute rollout
        # window inside this job's 180-minute timeout.
        uses: Oddly/incus-memory-gate@a4be4db5ffc59c8ee77c8fd7ff589612eb16be61  # v1.0.2
        with:
          mode: acquire
          molecule-scenario: ${{ matrix.scenario }}
          deadline-seconds: ${{ steps.gate.outputs.deadline }}
          incus-host: ${{ secrets.INCUS_HOST }}
          ssh-key: ${{ runner.temp }}/molecule_id_ed25519

      - name: Test with molecule
        run: molecule test -s ${{ matrix.scenario }} --destroy=never
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_DIFF_ALWAYS: 'true'
          ELASTICSTACK_REPO_BASE_URL: http://elastic-cache.chiark.dev:8080
          ANSIBLE_CALLBACKS_ENABLED: profile_tasks
          INCUS_HOST: ${{ secrets.INCUS_HOST }}
          MOLECULE_SSH_KEY: ${{ runner.temp }}/molecule_id_ed25519
          DISTRO_CACHE_URL: http://${{ secrets.REGISTRY_HOST }}:8081

      - name: Release memory slot
        # Runs whether converge/verify/idempotence passed or failed, so
        # the reservation is freed promptly. Normally a no-op: create.yml
        # already converted the reservation at container launch.
        if: always()
        uses: Oddly/incus-memory-gate@a4be4db5ffc59c8ee77c8fd7ff589612eb16be61  # v1.0.2
        with:
          mode: release

      - name: Collect and upload diagnostics
        # !success() (not failure()) so diagnostics are still collected when a
        # job is ended by timeout-minutes. GitHub records a timeout as
        # "cancelled", and if: failure() steps are skipped on cancellation —
        # which is exactly how the multi-node upgrade flake used to discard
        # its own evidence. Collecting on any non-success keeps that from
        # happening again.
        if: ${{ !success() }}
        uses: ./.github/actions/collect-diagnostics
        with:
          artifact-name: diag-${{ matrix.scenario }}-${{ matrix.distro }}
        env:
          INCUS_HOST: ${{ secrets.INCUS_HOST }}
          MOLECULE_SSH_KEY: ${{ runner.temp }}/molecule_id_ed25519

      - name: Cleanup molecule
        if: always()
        run: molecule destroy -s ${{ matrix.scenario }}
        continue-on-error: true
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          INCUS_HOST: ${{ secrets.INCUS_HOST }}
          MOLECULE_SSH_KEY: ${{ runner.temp }}/molecule_id_ed25519
          DISTRO_CACHE_URL: http://${{ secrets.REGISTRY_HOST }}:8081

      - name: Clean up SSH state
        if: always()
        run: |
          # Kill orphaned SSH processes from this job
          pkill -f "${{ runner.temp }}/molecule_id_ed25519" 2>/dev/null || true
          # Remove ControlMaster sockets and SSH key
          rm -rf "${{ runner.temp }}/ssh-cp"
          rm -f "${{ runner.temp }}/molecule_id_ed25519"

  upgrade_single_node:
    needs: lint_elasticsearch
    runs-on: self-hosted
    timeout-minutes: 180

    env:
      COLLECTION_NAMESPACE: oddly
      COLLECTION_NAME: elasticstack
      ANSIBLE_PIPELINING: 'true'
      ANSIBLE_GATHERING: smart
      ANSIBLE_ANY_ERRORS_FATAL: 'true'
      ANSIBLE_DISPLAY_SKIPPED_HOSTS: 'false'
      ANSIBLE_TRANSFER_METHOD: sftp
      ANSIBLE_SSH_RETRIES: '5'
      ANSIBLE_HOST_KEY_CHECKING: 'false'
      ANSIBLE_INJECT_FACTS_AS_VARS: 'false'
      ANSIBLE_TIMEOUT: '60'
      ANSIBLE_FORKS: '10'
      ANSIBLE_SSH_ARGS: >-
        -o ControlMaster=auto
        -o ControlPersist=60s
        -o PreferredAuthentications=publickey

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        distro:
          - debian13
          - rockylinux9
        scenario:
          - elasticsearch_upgrade_8to9_single

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          uv venv "$RUNNER_TEMP/venv" --python "$(command -v python3.12)"
          source "$RUNNER_TEMP/venv/bin/activate"
          uv pip install -r requirements-test.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

      - name: Verify Ansible executable
        run: |
          command -v ansible-playbook
          ansible-playbook --version | grep -Eq 'core 2\.20\.'

      - name: Set up collections path
        run: |
          {
            echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/collections"
            echo "MOLECULE_EPHEMERAL_DIRECTORY=$RUNNER_TEMP/molecule"
            echo "ANSIBLE_SSH_CONTROL_PATH_DIR=$RUNNER_TEMP/ssh-cp"
            echo "MOLECULE_RUN_SUFFIX=-${GITHUB_RUN_ID: -6}"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ssh-cp"

      - name: Install collection
        env:
          CACHE_HOST: ${{ secrets.INCUS_HOST }}
        run: |
          collection_path="$ANSIBLE_COLLECTIONS_PATH/ansible_collections/$COLLECTION_NAMESPACE/$COLLECTION_NAME"
          mkdir -p "$(dirname "$collection_path")"
          cp -a "$GITHUB_WORKSPACE" "$collection_path"
          if [ -n "$CACHE_HOST" ]; then
            ansible-galaxy collection install \
              "http://${CACHE_HOST}:8082/collections/community-general-12.3.0.tar.gz" \
              "http://${CACHE_HOST}:8082/collections/community-crypto-3.1.1.tar.gz" \
              "http://${CACHE_HOST}:8082/collections/ansible-posix-2.1.0.tar.gz"
          else
            ansible-galaxy collection install \
              community.general:12.3.0 \
              community.crypto:3.1.1 \
              ansible.posix:2.1.0
          fi

      - name: Set up SSH key for molecule
        run: |
          echo "${{ secrets.MOLECULE_SSH_PRIVATE_KEY }}" > ${{ runner.temp }}/molecule_id_ed25519
          chmod 600 ${{ runner.temp }}/molecule_id_ed25519
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 ${{ secrets.INCUS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Compute gate deadline
        id: gate
        run: echo "deadline=$((120 * 60))" >> "$GITHUB_OUTPUT"

      - name: Acquire memory slot
        # Single-authority admission gate: MemTotal − reserve − committed
        # limits.memory − pending reservations, FIFO with bounded
        # overtakes. The 120-minute deadline leaves a 60-minute rollout
        # window inside this job's 180-minute timeout.
        uses: Oddly/incus-memory-gate@a4be4db5ffc59c8ee77c8fd7ff589612eb16be61  # v1.0.2
        with:
          mode: acquire
          molecule-scenario: ${{ matrix.scenario }}
          deadline-seconds: ${{ steps.gate.outputs.deadline }}
          incus-host: ${{ secrets.INCUS_HOST }}
          ssh-key: ${{ runner.temp }}/molecule_id_ed25519

      - name: Test with molecule
        run: molecule test -s ${{ matrix.scenario }} --destroy=never
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_DIFF_ALWAYS: 'true'
          ELASTICSTACK_REPO_BASE_URL: http://elastic-cache.chiark.dev:8080
          ANSIBLE_CALLBACKS_ENABLED: profile_tasks
          INCUS_HOST: ${{ secrets.INCUS_HOST }}
          MOLECULE_SSH_KEY: ${{ runner.temp }}/molecule_id_ed25519
          DISTRO_CACHE_URL: http://${{ secrets.REGISTRY_HOST }}:8081

      - name: Release memory slot
        # Runs whether converge/verify/idempotence passed or failed, so
        # the reservation is freed promptly. Normally a no-op: create.yml
        # already converted the reservation at container launch.
        if: always()
        uses: Oddly/incus-memory-gate@a4be4db5ffc59c8ee77c8fd7ff589612eb16be61  # v1.0.2
        with:
          mode: release

      - name: Collect and upload diagnostics
        # !success() (not failure()) so diagnostics are still collected when a
        # job is ended by timeout-minutes. GitHub records a timeout as
        # "cancelled", and if: failure() steps are skipped on cancellation —
        # which is exactly how the multi-node upgrade flake used to discard
        # its own evidence. Collecting on any non-success keeps that from
        # happening again.
        if: ${{ !success() }}
        uses: ./.github/actions/collect-diagnostics
        with:
          artifact-name: diag-${{ matrix.scenario }}-${{ matrix.distro }}
        env:
          INCUS_HOST: ${{ secrets.INCUS_HOST }}
          MOLECULE_SSH_KEY: ${{ runner.temp }}/molecule_id_ed25519

      - name: Cleanup molecule
        if: always()
        run: molecule destroy -s ${{ matrix.scenario }}
        continue-on-error: true
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          INCUS_HOST: ${{ secrets.INCUS_HOST }}
          MOLECULE_SSH_KEY: ${{ runner.temp }}/molecule_id_ed25519
          DISTRO_CACHE_URL: http://${{ secrets.REGISTRY_HOST }}:8081

      - name: Clean up SSH state
        if: always()
        run: |
          # Kill orphaned SSH processes from this job
          pkill -f "${{ runner.temp }}/molecule_id_ed25519" 2>/dev/null || true
          # Remove ControlMaster sockets and SSH key
          rm -rf "${{ runner.temp }}/ssh-cp"
          rm -f "${{ runner.temp }}/molecule_id_ed25519"
