---
name: Test Linting
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  workflow_call:
    inputs:
      rolename:
        required: true
        type: string
  pull_request:
    types: [labeled]
    branches:
      - '*'

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:run' }}
    # Linting and contract checks do not need Incus. Keeping them on a
    # GitHub-hosted runner leaves the self-hosted pool for service tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

      - name: Install Ansible collection dependencies.
        run: |
          ansible-galaxy collection install \
            community.general:12.3.0 \
            community.crypto:3.1.1 \
            ansible.posix:2.1.0

      - name: Set up Node.js for Markdown lint.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
        if: ${{ inputs.rolename == '' }}

      - name: Lint Markdown.
        run: npx --yes markdownlint-cli2@0.22.0
        if: ${{ inputs.rolename == '' }}

      - name: Lint code (yamllint).
        run: |
          yamllint .
        if: ${{ inputs.rolename == '' }}

      - name: Lint Role (yamllint).
        run: |
          yamllint "roles/${ROLENAME}"
        env:
          ROLENAME: ${{ inputs.rolename }}
        if: ${{ inputs.rolename != '' }}

      - name: Lint code (ansible-lint).
        run: |
          ansible-lint
        if: ${{ inputs.rolename == '' }}

      - name: Lint Role (ansible-lint).
        run: |
          ansible-lint "roles/${ROLENAME}"
        env:
          ROLENAME: ${{ inputs.rolename }}
        if: ${{ inputs.rolename != '' }}

      # Fails if a role's meta/argument_specs.yml is out of sync with its
      # defaults/main.yml — catches "I added a var but forgot to update the
      # spec" and its inverse. See scripts/gen_argspecs.py for regeneration.
      - name: Check argument_specs drift.
        run: |
          python3 scripts/check_argspecs.py
        if: ${{ inputs.rolename == '' }}
