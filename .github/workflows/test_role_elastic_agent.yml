---
name: Test Role Elastic Agent
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  pull_request:
    types: [labeled]
    paths:
      - 'roles/elastic_agent/**'
      - 'roles/elasticstack/**'
      - 'molecule/elastic_agent_*/**'
      - 'molecule/shared/**'
      - '.github/workflows/test_role_elastic_agent.yml'
      - '.github/workflows/molecule.yml'
  schedule:
    - cron: "30 6 * * 2,4,6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.label.name != 'ci:run' && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  lint_elastic_agent:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:run' }}
    uses: ./.github/workflows/test_linting.yml
    with:
      rolename: elastic_agent
    secrets: inherit

  molecule_elastic_agent:
    needs: lint_elastic_agent
    uses: ./.github/workflows/molecule.yml
    with:
      scenarios: '["elastic_agent_default","elastic_agent_fleet"]'
      # Both supported Elastic majors are intentionally exercised here. The
      # role's command and package behavior differ between 8.x and 9.x.
      releases: '["8","9"]'
      distros: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["rockylinux10","debian13"]' || '["rockylinux9","rockylinux10","ubuntu2204","ubuntu2404","ubuntu2604","debian13"]' }}
      max-parallel: 2
    secrets: inherit
