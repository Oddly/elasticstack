---
name: Cleanup stale Incus containers
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Set up SSH key
        env:
          MOLECULE_SSH_PRIVATE_KEY: ${{ secrets.MOLECULE_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$MOLECULE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/molecule_id_ed25519"
          chmod 600 "$RUNNER_TEMP/molecule_id_ed25519"

      - name: Run smart cleanup (checks GitHub API for orphaned containers)
        run: |
          ssh_args=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o ConnectionAttempts=1
            -o ServerAliveInterval=3
            -o ServerAliveCountMax=1
            -i "$RUNNER_TEMP/molecule_id_ed25519"
            "root@${INCUS_HOST}"
          )
          ssh "${ssh_args[@]}" /usr/local/bin/cleanup-molecule-containers.sh
        env:
          INCUS_HOST: ${{ secrets.INCUS_HOST }}

      - name: Clean up SSH key
        if: always()
        run: rm -f ${{ runner.temp }}/molecule_id_ed25519
