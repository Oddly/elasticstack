---
name: KICS Security Scan
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  pull_request:
    types: [labeled]
  push:
    branches:
      - 'main'
  merge_group:
  schedule:
    - cron: '15 6 * * 4'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.label.name != 'ci:run' && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  kics:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create results directory
        run: mkdir -p results-dir

      - name: Install pinned KICS binary
        env:
          KICS_VERSION: "2.1.20"
          KICS_ARCHIVE_SHA256: "8a5aa375ccfdc0ddd1114eddf1f9638ad7f6122e98d12a592207509dbe6d81f8"
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/kics_${KICS_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/kics"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive_path" \
            "https://github.com/Checkmarx/kics/releases/download/v${KICS_VERSION}/kics_${KICS_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$KICS_ARCHIVE_SHA256" "$archive_path" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$install_dir"
          test -x "$install_dir/kics"

      - name: Run KICS scan
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/kics/kics" scan \
            --path "$GITHUB_WORKSPACE" \
            --output-path "$GITHUB_WORKSPACE/results-dir" \
            --report-formats json,sarif \
            --ignore-on-exit results

      # Workaround for Checkmarx/kics#7588: repeated CWE findings cause KICS
      # to emit duplicate entries in runs[].taxonomies[].taxa, which the SARIF
      # schema (uniqueItems: true) rejects, blocking the upload step.
      - name: Deduplicate SARIF taxa
        run: |
          jq '.runs |= map(.taxonomies |= (. // [] | map(.taxa |= (. // [] | unique_by(.id)))))' \
            results-dir/results.sarif > results-dir/results.dedup.sarif
          mv results-dir/results.dedup.sarif results-dir/results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@af56b044b5d41c317aef5d19920b3183cb4fbbec # v3
        with:
          sarif_file: results-dir/results.sarif
