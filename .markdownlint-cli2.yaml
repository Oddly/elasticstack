# Markdownlint config.
#
# We turn off the default rule set and re-enable only the rules that
# CodeRabbit's CHILL profile flags on this repo. The rule set stays small
# while the file scope covers the Markdown maintained by this repository.
#
# Add more rules when the existing Markdown has been brought into compliance.
config:
  default: false
  MD040: true   # fenced-code-language: opening fences must specify a language
  MD046:        # code-block-style: prefer fenced over indented
    style: fenced

# Lint tracked repository Markdown, including root documentation, the docs
# site, plugin and role documentation, and CI documentation.
globs:
  - "*.md"
  - "ci/**/*.md"
  - "docs/**/*.md"
  - "plugins/**/*.md"
  - "roles/**/README.md"

ignores:
  - ".venv/**"
  - "venv/**"
  - "node_modules/**"
  - ".ansible/**"
  - ".claude/**"
  - ".superpowers/**"
